<html lang="ja">

<title>漢字ドリル帳</title>

<style>

:root[data-theme=dark]{color-scheme:dark;--paper:#12171f;--card:#1a212c;--ink:#e8edf4;--sub:#99a6b8;--rule:#2e3846;--pen:#ff7a6e;--ok:#5fcf9d;--accent:#8fb2f2;--accent-ink:#0f1722}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--paper:#12171f;--card:#1a212c;--ink:#e8edf4;--sub:#99a6b8;--rule:#2e3846;--pen:#ff7a6e;--ok:#5fcf9d;--accent:#8fb2f2;--accent-ink:#0f1722}}
*{box-sizing:border-box}
html{overflow-anchor:none;scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;margin:0;letter-spacing:.04em}h2{font-size:13px;margin:0 0 8px;color:var(--sub);letter-spacing:.12em;font-weight:500}
button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.top p,.hint{margin:0;color:var(--sub);font-size:13px}
.panel,.q{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;max-width:100%}.seg button{background:transparent;border:0;padding:8px 12px;font-size:14px}.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.kai{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.kai button{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 6px;text-align:center;line-height:1.3}.kai b{display:block;font-size:15px}.kai small{color:var(--sub);font-size:12px}.kai button.done{border-color:var(--ok)}.kai button.done small{color:var(--ok)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:700}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:500}.btn:disabled{opacity:.4;cursor:default}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.q{padding:28px 20px;min-height:140px;display:flex;align-items:center}.sent{font:clamp(22px,5.5vw,30px)/2 var(--f-text);margin:0;word-break:keep-all;overflow-wrap:anywhere}
.tg{color:var(--accent);border-bottom:2px dotted var(--accent);padding:0 .1em;white-space:nowrap}.tg.right{color:var(--ok);border-bottom:2px solid var(--ok);font-weight:600}.tg.wrong{color:var(--pen);border-bottom:2px solid var(--pen);font-weight:600}
.fb{min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.fb p{margin:0}.ans{font:26px var(--f-text);color:var(--pen)}.mark{font:44px/1 var(--f-text);width:56px;height:56px;border:3px solid;border-radius:50%;display:grid;place-items:center;flex:none}.mark.right{color:var(--pen);border-color:var(--pen)}.mark.wrong{color:var(--pen);border:0;font-size:52px}
form.ans{display:flex;gap:10px;scroll-margin-block:0}
form.ans input{flex:1;min-width:0;font:24px var(--f-text);padding:10px 14px;border:2px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);scroll-margin-block:0; -webkit-appearance:none;appearance:none}
.res{display:flex;align-items:baseline;gap:10px}.res b{font-size:56px;line-height:1}.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font:17px var(--f-text)}.list li:first-child{border-top:0}.list li span:last-child{color:var(--pen);white-space:nowrap}
.padbox{position:relative}#pad{display:block;width:100%;height:230px;touch-action:none;border:1px solid var(--rule);border-radius:10px;background-color:var(--card);background-image:linear-gradient(var(--rule),var(--rule)),linear-gradient(var(--rule),var(--rule));background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
#clr-pad{position:absolute;right:8px;top:8px;padding:4px 10px;font-size:13px;background:var(--card)}
.fade{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:420px){.seg button{padding:8px;font-size:12px}.panel{padding:13px}form.ans{gap:6px}form.ans input{font-size:21px}.btn{padding:10px 13px}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
</style>
</head>

const KAIS=[...new Set(DATA.map(d=>d.kai))];
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let wrong=new Set(store.get('kd_wrong',[]));
let mode=store.get('kd_mode','self');
let direction=store.get('kd_direction','write');
let shuffle=store.get('kd_shuffle',false);
let bestWrite=store.get('kd_best_write',store.get('kd_best',{}));
let bestRead=store.get('kd_best_read',{});
let S=null;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFKC').replace(/\s+/g,'').replace(/々/g,'');
const hira=s=>norm(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const expected=q=>direction==='read'?q.mid:q.ans;
const okAns=(q,v)=>{
 const a=expected(q),b=norm(v);
 return direction==='read'?hira(a)===hira(b):(b===norm(a)||(q.ans==='粒粒'&&b==='粒'));
};
function sentence(q,state){
 const target=direction==='read'?q.ans:q.mid;
 return `${esc(q.pre)}<span class="tg ${state||''}">${esc(target)}</span>${esc(q.post)}`;
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

 const best=direction==='read'?bestRead:bestWrite;
 app.innerHTML=`
 <div class="top fade"><h1>漢字ドリル帳</h1><p>全${DATA.length}問・第1〜${KAIS.length}回</p></div>
 <section class="panel fade">

 <div class="row">
 <div class="seg" role="group" aria-label="テストの種類">

 </div></div>

 <div class="seg" role="group" aria-label="答え方">

 </div>
 <p class="hint" style="margin-top:10px">${direction==='read'?'読みテストはキーボード入力で回答します。':'手書きでは答えを見てから自己採点できます。'}</p>
 <h2 style="margin-top:16px">出題順</h2>
 <div class="seg" role="group" aria-label="出題順">
 <button id="o-seq" aria-pressed="${!shuffle}">順番どおり</button>
 <button id="o-rnd" aria-pressed="${shuffle}">ランダム</button>
 </div></section>
 <section class="panel fade"><h2>回を選ぶ（${direction==='read'?'読み':'書き取り'}の成績）</h2><div class="kai">
 ${KAIS.map(k=>`<button data-kai="${k}" class="${best[k]!=null?'done':''}"><b>第${k}回</b><small>${best[k]!=null?best[k]+' / '+cnt(k):cnt(k)+'問'}</small></button>`).join('')}
 </div></section>
 <section class="panel fade"><h2>まとめて練習</h2><div class="row">
 <button class="btn" id="go-full">全${DATA.length}問を通してやる</button>
 <button class="btn ghost" id="go-all">ランダム20問</button>
 <button class="btn ghost" id="go-wrong" ${wrong.size?'':'disabled'}>間違えた問題（${wrong.size}問）</button>
 </div>${wrong.size?'<p style="margin-top:10px"><button class="btn ghost" id="clr" style="padding:5px 10px;font-size:13px">間違いの記録を消す</button></p>':''}</section>`;
 $('#d-write').onclick=()=>setDirection('write');
 $('#d-read').onclick=()=>setDirection('read');
 $('#m-type').onclick=()=>{mode='type';store.set('kd_mode',mode);home()};
 $('#m-self').onclick=()=>{mode='self';store.set('kd_mode',mode);home()};
 $('#o-seq').onclick=()=>{shuffle=false;store.set('kd_shuffle',shuffle);home()};
 $('#o-rnd').onclick=()=>{shuffle=true;store.set('kd_shuffle',shuffle);home()};
 document.querySelectorAll('[data-kai]').forEach(b=>b.onclick=()=>{
  const k=+b.dataset.kai,ids=DATA.filter(d=>d.kai===k).map(d=>d.id);
  start(shuffle?shuf(ids):ids,`第${k}回`,k);
 });
 $('#go-full').onclick=()=>{const ids=DATA.map(d=>d.id);start(shuffle?shuf(ids):ids,'全'+DATA.length+'問',null)};
 $('#go-all').onclick=()=>start(shuf(DATA.map(d=>d.id)).slice(0,20),'ランダム20問',null);
 $('#go-wrong').onclick=()=>{const ids=[...wrong].filter(id=>DATA[id]);if(ids.length)start(shuffle?shuf(ids):ids,'間違い直し',null)};
 const c=$('#clr');if(c)c.onclick=()=>{wrong.clear();store.set('kd_wrong',[]);home()};
}
function setDirection(v){direction=v;store.set('kd_direction',v);home()}
function start(ids,title,kai){S={ids,title,kai,i:0,score:0,miss:[],answered:false};show()}

function show(){
 const q=DATA[S.ids[S.i]],n=S.ids.length;
 S.answered=false;
 app.innerHTML=`
 <div class="top"><h1 style="font-size:17px">${esc(S.title)} · ${direction==='read'?'読みテスト':'書き取り'}</h1><button class="btn ghost" id="quit" style="padding:6px 12px;font-size:13px">やめる</button></div>
 <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
 <div class="meta"><span>${S.i+1} / ${n}問</span><span>正解 ${S.score}</span></div>
 <div class="q fade"><p class="sent" id="sent">${sentence(q)}</p></div>
 <div id="padwrap"></div><div class="fb" id="fb" aria-live="polite"></div><div id="ctl"></div>`;
 $('#quit').onclick=home;
 const ctl=$('#ctl');
 if(direction==='read'||mode==='type'){
  ctl.innerHTML=`<form class="ans" id="f" autocomplete="off"><input id="ans" lang="ja" aria-label="${direction==='read'?'読みを答える':'漢字で答える'}" placeholder="${direction==='read'?'ひらがなで読みを入力':'漢字で入力'}" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">答える</button></form><p class="hint" style="margin-top:8px">${direction==='read'?'ひらがな・カタカナのどちらでも回答できます。':'変換を確定してから「答える」を押します。'}</p>`;

  // 入力欄を自動フォーカスしない。問題表示時の自動スクロールを防ぐ。
  const answer=$('#ans');
  let savedScrollY=window.scrollY;
  answer.addEventListener('pointerdown',()=>{
   savedScrollY=window.scrollY;
  },{passive:true});
  answer.addEventListener('focus',()=>{
   savedScrollY=window.scrollY;
   requestAnimationFrame(()=>window.scrollTo({top:savedScrollY,behavior:'auto'}));
  });
  $('#f').onsubmit=e=>{e.preventDefault();if(S.answered)return next();const v=$('#ans').value;if(!v.trim())return;judge(q,okAns(q,v),v)};
 }else{
  setupPad();ctl.innerHTML='<button class="btn" id="reveal" style="width:100%">答えを見る</button><p class="hint" style="margin-top:8px">枠に書いてから押します。</p>';
  $('#reveal').onclick=reveal;
 }
}
function setupPad(){
 const c=$('#padwrap');c.innerHTML='<div class="padbox"><canvas id="pad" aria-label="手書きの練習スペース"></canvas><button class="btn ghost" id="clr-pad" type="button">消す</button></div>';
 const p=$('#pad'),dpr=window.devicePixelRatio||1,r=p.getBoundingClientRect();
 p.width=Math.round(r.width*dpr);p.height=Math.round(r.height*dpr);
 const x=p.getContext('2d');x.scale(dpr,dpr);x.lineCap='round';x.lineJoin='round';x.lineWidth=4.5;
 let down=false,lx=0,ly=0;
 const pos=e=>{const r=p.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 p.onpointerdown=e=>{down=true;[lx,ly]=pos(e);try{p.setPointerCapture(e.pointerId)}catch(_){}x.strokeStyle=getComputedStyle(document.body).color;x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.01,ly);x.stroke();e.preventDefault()};
 p.onpointermove=e=>{if(!down)return;const evs=e.getCoalescedEvents?.()||[];for(const a of evs.length?evs:[e]){const[px,py]=pos(a);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py}};
 p.onpointerup=p.onpointercancel=p.onlostpointercapture=()=>down=false;
 p.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});p.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
 $('#clr-pad').onclick=()=>x.clearRect(0,0,p.width/dpr,p.height/dpr);
}
function reveal(){
 const q=DATA[S.ids[S.i]];
 $('#sent').innerHTML=sentence(q,'right');
 $('#fb').innerHTML=`<p class="ans">${esc(expected(q))}</p><p class="hint">書いた字と見比べましょう。</p>`;
 $('#ctl').innerHTML='<div class="row"><button class="btn" id="yes" style="flex:1">できた</button><button class="btn ghost" id="no" style="flex:1">まちがえた</button></div>';
 $('#yes').onclick=()=>judge(q,true,null);$('#no').onclick=()=>judge(q,false,null);
}
function judge(q,ok,val){
 if(S.answered)return;
 S.answered=true;
 if(ok){S.score++;wrong.delete(q.id)}else{S.miss.push(q.id);wrong.add(q.id)}
 store.set('kd_wrong',[...wrong]);
 $('#sent').innerHTML=sentence(q,ok?'right':'wrong');
 const a=expected(q);
 $('#fb').innerHTML=ok?`<div class="mark right">○</div><p class="ans" style="color:var(--ok)">${esc(a)}</p>`:`<div class="mark wrong">×</div><div><p class="hint">${val?esc(val)+' は ちがいます':''}</p><p class="ans">${esc(a)}</p></div>`;
 $('#ctl').innerHTML=`<button class="btn" id="nx" style="width:100%">${S.i===S.ids.length-1?'結果を見る':'次の問題'}</button>`;
 $('#nx').onclick=next;
}
function next(){if(S.i<S.ids.length-1){S.i++;show()}else finish()}
function finish(){
 const n=S.ids.length;
 if(S.kai!=null){
  const best=direction==='read'?bestRead:bestWrite;
  best[S.kai]=Math.max(best[S.kai]??0,S.score);
  if(direction==='read')store.set('kd_best_read',best);else store.set('kd_best_write',best);
 }
 const miss=S.miss.map(id=>DATA[id]);
 app.innerHTML=`<div class="top fade"><h1>${esc(S.title)} の結果</h1></div>
 <section class="panel fade"><div class="res"><b>${S.score}</b><span>/ ${n}問 正解</span></div>
 <p class="hint">${miss.length?'まちがえた問題は「間違えた問題」に保存されます。':'全問正解です。'}</p>
 <p class="hint">テスト：${direction==='read'?'読みテスト':'書き取り'}</p></section>
 ${miss.length?`<section class="panel fade"><h2>まちがえた問題</h2><ul class="list">${miss.map(q=>`<li><span>${esc(q.pre)}［${esc(q.ans)}］${esc(q.post)}</span><span>${esc(expected(q))}</span></li>`).join('')}</ul></section>`:''}
 <div class="row fade">${miss.length?`<button class="btn" id="re">まちがえた${miss.length}問をやり直す</button>`:''}<button class="btn ghost" id="again">もう一度</button><button class="btn ghost" id="hm">回の一覧へ</button></div>`;
 const re=$('#re');if(re)re.onclick=()=>start(S.miss.slice(),'やり直し',null);
 const ids=S.ids.slice(),t=S.title,k=S.kai;
 $('#again').onclick=()=>start(shuffle?shuf(ids):ids,t,k);
 $('#hm').onclick=home;
}
home();
</script>
</body>
</html>
