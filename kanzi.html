<style>
/* Layout: 練習帳のページのように、1画面1問。上に進み具合、中央に例文、下に答え欄。 */
:root{
  --paper:#f4f6f8;      /* 青みのある紙 */
  --card:#ffffff;
  --ink:#1d2736;        /* 墨に近い紺 */
  --sub:#5d6b7d;
  --rule:#d5dce5;
  --pen:#d23a2f;        /* 赤ペン */
  --ok:#1f7a55;
  --accent:#2a4f8f;
  --accent-ink:#ffffff;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-text:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12171f;--card:#1a212c;--ink:#e8edf4;--sub:#99a6b8;--rule:#2e3846;--pen:#ff7a6e;--ok:#5fcf9d;--accent:#8fb2f2;--accent-ink:#0f1722;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171f;--card:#1a212c;--ink:#e8edf4;--sub:#99a6b8;--rule:#2e3846;--pen:#ff7a6e;--ok:#5fcf9d;--accent:#8fb2f2;--accent-ink:#0f1722;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;margin:0;letter-spacing:.04em}
h2{font-size:13px;margin:0 0 8px;color:var(--sub);letter-spacing:.12em;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top p{margin:0;color:var(--sub);font-size:13px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.kai{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.kai button{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 6px;text-align:center;line-height:1.3}
.kai button b{display:block;font-size:15px}
.kai button small{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.kai button.done{border-color:var(--ok)}
.kai button.done small{color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:500}
.btn[disabled]{opacity:.4;cursor:default}
/* quiz */
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.q{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:28px 20px;min-height:140px;display:flex;align-items:center}
.sent{font-family:var(--f-text);font-size:clamp(22px,5.5vw,30px);line-height:2;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.tg{color:var(--accent);border-bottom:2px dotted var(--accent);padding:0 .1em;white-space:nowrap}
.tg.right{color:var(--ok);border-bottom:2px solid var(--ok);font-weight:600}
.tg.wrong{color:var(--pen);border-bottom:2px solid var(--pen);font-weight:600}
.fb{min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font-family:var(--f-text);font-size:44px;line-height:1;width:56px;height:56px;border:3px solid;border-radius:50%;display:grid;place-items:center;flex:none}
.mark.right{color:var(--pen);border-color:var(--pen)}
.mark.wrong{color:var(--pen);border:0;font-size:52px}
.fb p{margin:0}
.fb .ans{font-family:var(--f-text);font-size:26px;color:var(--pen)}
form.ans{display:flex;gap:10px}
form.ans input{flex:1;min-width:0;font:inherit;font-family:var(--f-text);font-size:24px;padding:10px 14px;border:2px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
.hint{font-size:13px;color:var(--sub);margin:0}
.res{display:flex;align-items:baseline;gap:10px}
.res b{font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-family:var(--f-text);font-size:17px}
.list li:first-child{border-top:0}
.list li span:last-child{color:var(--pen);white-space:nowrap}
.padbox{position:relative}
.q,.fb,.padbox,.meta,.bar,.top{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#pad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;display:block;width:100%;height:230px;touch-action:none;cursor:crosshair;border:1px solid var(--rule);border-radius:10px;background-color:var(--card);
  background-image:linear-gradient(var(--rule),var(--rule)),linear-gradient(var(--rule),var(--rule));background-size:100% 1px,1px 100%;background-position:center,center;background-repeat:no-repeat}
#clr-pad{position:absolute;right:8px;top:8px;padding:4px 10px;font-size:13px;background:var(--card)}
.fade{animation:in .18s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
</style>

    <h2>まとめて練習</h2>
    <div class="row">
      <button class="btn" id="go-full">全${DATA.length}問を通してやる</button>
      <button class="btn ghost" id="go-all">ランダム20問</button>
      <button class="btn ghost" id="go-wrong" ${wrong.size?'':'disabled'}>間違えた問題（${wrong.size}問）</button>
    </div>
    ${wrong.size?`<p class="hint" style="margin-top:10px"><button class="btn ghost" id="clr" style="padding:5px 10px;font-size:13px">間違いの記録を消す</button></p>`:''}
  </section>`;
  $('#m-type').onclick=()=>{mode='type';store.set('kd_mode',mode);home()};
  $('#m-self').onclick=()=>{mode='self';store.set('kd_mode',mode);home()};
  $('#o-seq').onclick=()=>{shuffle=false;store.set('kd_shuffle',shuffle);home()};
  $('#o-rnd').onclick=()=>{shuffle=true;store.set('kd_shuffle',shuffle);home()};
  document.querySelectorAll('[data-kai]').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.kai; const ids=DATA.filter(d=>d.kai===k).map(d=>d.id);
    start(shuffle?shuf(ids):ids,`第${k}回`,k);
  });
  $('#go-full').onclick=()=>{const ids=DATA.map(d=>d.id);start(shuffle?shuf(ids):ids,'全'+DATA.length+'問',null)};
  $('#go-all').onclick=()=>start(shuf(DATA.map(d=>d.id)).slice(0,20),'ランダム20問',null);
  const gw=$('#go-wrong'); gw.onclick=()=>{const ids=[...wrong];start(shuffle?shuf(ids):ids,'間違い直し',null)};
  const c=$('#clr'); if(c) c.onclick=()=>{wrong.clear();store.set('kd_wrong',[]);home()};
}

function start(ids,title,kai){
  S={ids,title,kai,i:0,score:0,miss:[],answered:false};
  show();
}

function show(){
  const q = DATA[S.ids[S.i]], n=S.ids.length;
  S.answered=false;
  app.innerHTML = `
  <div class="top"><h1 style="font-size:17px">${esc(S.title)}</h1><button class="btn ghost" id="quit" style="padding:6px 12px;font-size:13px">やめる</button></div>
  <div class="bar" aria-hidden="true"><i style="width:${S.i/n*100}%"></i></div>
  <div class="meta"><span>${S.i+1} / ${n}問</span><span>正解 ${S.score}</span></div>
  <div class="q fade"><p class="sent" id="sent">${sentence(q)}</p></div>
  <div id="padwrap"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div id="ctl"></div>`;
  $('#quit').onclick=home;
  const ctl=$('#ctl');
  if(mode==='type'){
    ctl.innerHTML=`<form class="ans" id="f" autocomplete="off"><input id="ans" lang="ja" aria-label="漢字で答える" placeholder="漢字で入力" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">答える</button></form><p class="hint" style="margin-top:8px">変換を確定してから「答える」を押します。</p>`;
    const inp=$('#ans'); inp.focus();
    $('#f').onsubmit=e=>{e.preventDefault(); if(S.answered) return next(); const v=inp.value; if(!v.trim()) return; judge(q,okAns(q,v),v)};
  }else{
    setupPad(); ctl.innerHTML=`<button class="btn" id="reveal" style="width:100%">答えを見る</button><p class="hint" style="margin-top:8px">枠に書いてから押します。</p>`;
    $('#reveal').onclick=reveal;
  }
}
function setupPad(){
  const w=$('#padwrap');
  w.innerHTML=`<div class="padbox"><canvas id="pad" aria-label="手書きの練習スペース"></canvas><button class="btn ghost" id="clr-pad" type="button">消す</button></div>`;
  const c=$('#pad'), dpr=window.devicePixelRatio||1, r0=c.getBoundingClientRect();
  c.width=Math.round(r0.width*dpr); c.height=Math.round(r0.height*dpr);
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineCap='round'; x.lineJoin='round'; x.lineWidth=4.5;
  let d=false,lx=0,ly=0;
  const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{d=true;try{getSelection().removeAllRanges()}catch(_){}[lx,ly]=pos(e);try{c.setPointerCapture(e.pointerId)}catch(_){}x.strokeStyle=getComputedStyle(document.body).color;x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.01,ly);x.stroke();e.preventDefault()};
  c.onpointermove=e=>{if(!d)return;const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];for(const p of (evs.length?evs:[e])){const [px,py]=pos(p);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py}};
  c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>{d=false};
  for(const t of ['touchstart','touchmove'])c.addEventListener(t,e=>e.preventDefault(),{passive:false});
  for(const t of ['contextmenu','selectstart','dragstart'])c.addEventListener(t,e=>e.preventDefault());
  $('#clr-pad').onclick=()=>x.clearRect(0,0,c.width/dpr,c.height/dpr);
}
function reveal(){
  const q=DATA[S.ids[S.i]];
  $('#sent').innerHTML=sentence(q,'right');
  $('#fb').innerHTML=`<p class="ans">${esc(q.ans)}</p><p class="hint">書いた字と見比べましょう。</p>`;
  $('#ctl').innerHTML=`<div class="row"><button class="btn" id="yes" style="flex:1">できた</button><button class="btn ghost" id="no" style="flex:1">まちがえた</button></div>`;
  $('#yes').focus();
  $('#yes').onclick=()=>judge(q,true,null);
  $('#no').onclick=()=>judge(q,false,null);
}
function judge(q,ok,val){
  S.answered=true;
  if(ok){S.score++; wrong.delete(q.id)} else {S.miss.push(q.id); wrong.add(q.id)}
  store.set('kd_wrong',[...wrong]);
  $('#sent').innerHTML=sentence(q, ok?'right':'wrong');
  const last = S.i===S.ids.length-1;
  $('#fb').innerHTML = ok
    ? `<div class="mark right">○</div><p class="ans" style="color:var(--ok)">${esc(q.ans)}</p>`
    : `<div class="mark wrong">×</div><div><p class="hint">${val?esc(val)+' は ちがいます':''}</p><p class="ans">${esc(q.ans)}</p></div>`;
  $('#ctl').innerHTML=`<button class="btn" id="nx" style="width:100%">${last?'結果を見る':'次の問題'}</button>`;
  const nx=$('#nx'); nx.focus(); nx.onclick=next;
}
function next(){
  if(S.i<S.ids.length-1){S.i++;show()} else finish();
}
function finish(){
  const n=S.ids.length;
  if(S.kai!=null){ best[S.kai]=Math.max(best[S.kai]??0,S.score); store.set('kd_best',best) }
  const miss=S.miss.map(id=>DATA[id]);
  app.innerHTML=`
  <div class="top fade"><h1>${esc(S.title)} のけっか</h1></div>
  <section class="panel fade">
    <div class="res"><b>${S.score}</b><span>/ ${n}問 正解</span></div>
    <p class="hint">${miss.length?'まちがえた問題は「間違えた問題」にたまります。':'全問正解です。'}</p>
  </section>
  ${miss.length?`<section class="panel fade"><h2>まちがえた問題</h2><ul class="list">${miss.map(q=>`<li><span>${esc(q.pre)}［${esc(q.mid)}］${esc(q.post)}</span><span>${esc(q.ans)}</span></li>`).join('')}</ul></section>`:''}
  <div class="row fade">
    ${miss.length?`<button class="btn" id="re">まちがえた${miss.length}問をやり直す</button>`:''}
    <button class="btn ghost" id="again">もう一度</button>
    <button class="btn ghost" id="hm">回の一覧へ</button>
  </div>`;
  const re=$('#re'); if(re) re.onclick=()=>start(S.miss.slice(),'やり直し',null);
  const ids=S.ids.slice(), t=S.title, k=S.kai;
  $('#again').onclick=()=>start(shuffle?shuf(ids):ids,t,k);
  $('#hm').onclick=home;
}
home();
</script>

</body></html>
