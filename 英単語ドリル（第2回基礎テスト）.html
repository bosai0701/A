<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英単語ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#f4f6f8;--card:#fff;--ink:#1d2736;--sub:#5d6b7d;--rule:#d5dce5;--pen:#d23a2f;--ok:#1f7a55;--accent:#2a4f8f;--accent-ink:#fff;
  --f:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12171f;--card:#1a212c;--ink:#e8edf4;--sub:#99a6b8;--rule:#2e3846;--pen:#ff7a6e;--ok:#5fcf9d;--accent:#8fb2f2;--accent-ink:#0f1722;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12171f;--card:#1a212c;--ink:#e8edf4;--sub:#99a6b8;--rule:#2e3846;--pen:#ff7a6e;--ok:#5fcf9d;--accent:#8fb2f2;--accent-ink:#0f1722;color-scheme:dark}
*{box-sizing:border-box}
[hidden]:not([hidden=until-found i]){display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;margin:0;letter-spacing:.04em}
h2{font-size:13px;margin:0 0 8px;color:var(--sub);letter-spacing:.12em;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top p{margin:0;color:var(--sub);font-size:13px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.kai{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.kai button{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 6px;text-align:center;line-height:1.3}
.kai button b{display:block;font-size:15px}
.kai button small{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.kai button.done{border-color:var(--ok)}
.kai button.done small{color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:500}
.btn[disabled]{opacity:.4;cursor:default}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.q{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:28px 20px;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.q small{color:var(--sub);font-size:13px}
.p{font-size:clamp(28px,8vw,40px);line-height:1.4;margin:0;overflow-wrap:anywhere}
.p.en{letter-spacing:.02em}
.fb{min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font-size:44px;line-height:1;width:56px;height:56px;border:3px solid;border-radius:50%;display:grid;place-items:center;flex:none}
.mark.right{color:var(--pen);border-color:var(--pen)}
.mark.wrong{color:var(--pen);border:0;font-size:52px}
.fb p{margin:0}
.fb .ans{font-size:28px;color:var(--pen);font-weight:700}
.fb .ans.ok{color:var(--ok)}
form.ans{display:flex;gap:10px}
form.ans input{flex:1;min-width:0;font:inherit;font-size:24px;padding:10px 14px;border:2px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
.hint{font-size:13px;color:var(--sub);margin:0}
.res{display:flex;align-items:baseline;gap:10px}
.res b{font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:17px}
.list li:first-child{border-top:0}
.list li span:last-child{color:var(--pen);white-space:nowrap;font-weight:700}
.padbox{position:relative}
.q,.fb,.padbox,.meta,.bar,.top{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#pad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:block;width:100%;height:200px;touch-action:none;cursor:crosshair;border:1px solid var(--rule);border-radius:10px;background-color:var(--card);
  background-image:linear-gradient(var(--rule),var(--rule));background-size:100% 1px;background-position:center 66%;background-repeat:no-repeat}
#clr-pad{position:absolute;right:8px;top:8px;padding:4px 10px;font-size:13px;background:var(--card)}
.fade{animation:in .18s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
</style></head><body>
<main id="app"></main>
<script>
const W=[["もってくる","bring"],["もってきた","brought"],["怒って","angry"],["必要な","necessary"],["残念ながら","afraid"],["部分","part"],["～に沿って","along"],["薬","medicine"],["始める","begin"],["始めた","began"],["側","side"],["値段","price"],["完全な","perfect"],["忙しい","busy"],["早く","early"],["重い","heavy"],["親切な","kind"],["（声が）大きな","loud"],["安全な","safe"],["すぐに","soon"],["温かい","warm"],["注意深い","careful"],["難しい","difficult"],["たやすく","easily"],["わくわくさせる","exciting"],["有名な","famous"],["役に立つ","helpful"],["重要な","important"],["興味深い","interesting"],["人気のある","popular"],["じょうずに","well"],["声","voice"],["男性（複数形）","men"],["火","fire"],["理由","reason"],["失う","lose"],["急速にすぐに","quickly"],["身につける","wear"],["受け取る","receive"],["台所","kitchen"],["店","store"],["線","line"],["賛成する","agree"],["半分","half"],["（2つの）間","between"],["理解する","understand"],["戦争","war"],["～でさえ","even"],["たてもの","building"],["よりよい","better"]];
const DATA=W.map((r,i)=>({id:i,no:i+1,ja:r[0],en:r[1]}));
const GROUPS=[0,1,2,3,4];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const wrongs={jp:new Set(store.get('ev_wrong_jp',[])),en:new Set(store.get('ev_wrong_en',[]))};
const bests={jp:store.get('ev_best_jp',{}),en:store.get('ev_best_en',{})};
let dir=store.get('ev_dir','jp');       // jp: 日本語→英語 / en: 英語→日本語
let mode=store.get('ev_mode','type');   // type | self
let shuffle=store.get('ev_shuffle',false);
let S=null;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const effMode=d=>d==='en'?'self':mode;
const gl=g=>`No.${g*10+1}〜${g*10+10}`;
const saveW=d=>store.set('ev_wrong_'+d,[...wrongs[d]]);
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function home(){
  S=null;const wr=wrongs[dir],best=bests[dir],jp=dir==='jp';
  app.innerHTML=`
  <div class="top fade"><h1>英単語ドリル</h1><p>3年生 第2回基礎テスト・全${DATA.length}語</p></div>
  <section class="panel fade"><h2>出題</h2>
    <div class="seg" role="group" aria-label="出題"><button id="d-jp" aria-pressed="${jp}">日本語 → 英語</button><button id="d-en" aria-pressed="${!jp}">英語 → 日本語</button></div>
  </section>
  <section class="panel fade"><h2>答え方</h2>
    <div class="row" style="align-items:center">
      ${jp?`<div class="seg" role="group" aria-label="答え方"><button id="m-type" aria-pressed="${mode==='type'}">キーボード入力</button><button id="m-self" aria-pressed="${mode==='self'}">手書きで自己採点</button></div>`:''}
      <div class="seg" role="group" aria-label="順番"><button id="o-seq" aria-pressed="${!shuffle}">順番どおり</button><button id="o-rnd" aria-pressed="${shuffle}">ランダム</button></div>
    </div>
    <p class="hint" style="margin-top:10px">${jp?(mode==='type'?'日本語を見て、英単語をつづりで入力します。':'日本語を見て、枠に英単語を書き、答えを見て自分で採点します。'):'英単語を見て、意味を考え、答えを見て自分で採点します。'}</p>
  </section>
  <section class="panel fade"><h2>範囲を選ぶ</h2>
    <div class="kai">${GROUPS.map(g=>`<button data-g="${g}" class="${best[g]!=null?'done':''}"><b>${gl(g)}</b><small>${best[g]!=null?best[g]+' / 10':'10問'}</small></button>`).join('')}</div>
  </section>
  <section class="panel fade"><h2>まとめて練習</h2>
    <div class="row">
      <button class="btn" id="go-full">全${DATA.length}語を通してやる</button>
      <button class="btn ghost" id="go-40">本番形式（ランダム40問）</button>
      <button class="btn ghost" id="go-wrong" ${wr.size?'':'disabled'}>間違えた問題（${wr.size}問）</button>
    </div>
    ${wr.size?`<p class="hint" style="margin-top:10px"><button class="btn ghost" id="clr" style="padding:5px 10px;font-size:13px">間違いの記録を消す</button></p>`:''}
  </section>`;
  $('#d-jp').onclick=()=>{dir='jp';store.set('ev_dir',dir);home()};
  $('#d-en').onclick=()=>{dir='en';store.set('ev_dir',dir);home()};
  if(jp){$('#m-type').onclick=()=>{mode='type';store.set('ev_mode',mode);home()};$('#m-self').onclick=()=>{mode='self';store.set('ev_mode',mode);home()}}
  $('#o-seq').onclick=()=>{shuffle=false;store.set('ev_shuffle',false);home()};
  $('#o-rnd').onclick=()=>{shuffle=true;store.set('ev_shuffle',true);home()};
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g,ids=DATA.filter(d=>Math.floor(d.id/10)===g).map(d=>d.id);start(shuffle?shuf(ids):ids,gl(g),g)});
  $('#go-full').onclick=()=>{const ids=DATA.map(d=>d.id);start(shuffle?shuf(ids):ids,'全'+DATA.length+'語',null)};
  $('#go-40').onclick=()=>start(shuf(DATA.map(d=>d.id)).slice(0,40),'本番形式40問',null);
  $('#go-wrong').onclick=()=>{const ids=[...wr];start(shuffle?shuf(ids):ids,'間違い直し',null)};
  const c=$('#clr');if(c)c.onclick=()=>{wr.clear();saveW(dir);home()};
}
function start(ids,title,g,d){d=d||dir;S={ids,d,title:title+(d==='jp'?'（日→英）':'（英→日）'),g,i:0,score:0,miss:[],mode:effMode(d)};show()}
const prompt_=q=>S.d==='jp'?q.ja:q.en, answer_=q=>S.d==='jp'?q.en:q.ja;
function show(){
  const q=DATA[S.ids[S.i]],n=S.ids.length,jp=S.d==='jp';S.answered=false;
  app.innerHTML=`
  <div class="top"><h1 style="font-size:17px">${esc(S.title)}</h1><button class="btn ghost" id="quit" style="padding:6px 12px;font-size:13px">やめる</button></div>
  <div class="bar" aria-hidden="true"><i style="width:${S.i/n*100}%"></i></div>
  <div class="meta"><span>${S.i+1} / ${n}問</span><span>正解 ${S.score}</span></div>
  <div class="q fade"><small>No.${q.no}　${jp?'英語で書きましょう':'日本語の意味は？'}</small><p class="p ${jp?'':'en'}">${esc(prompt_(q))}</p></div>
  <div id="padwrap"></div><div class="fb" id="fb" aria-live="polite"></div><div id="ctl"></div>`;
  $('#quit').onclick=home;
  const ctl=$('#ctl');
  if(S.mode==='type'){
    ctl.innerHTML=`<form class="ans" id="f" autocomplete="off"><input id="ans" lang="en" aria-label="英単語を入力" placeholder="英単語を入力" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" type="submit">答える</button></form>`;
    const inp=$('#ans');inp.focus();
    $('#f').onsubmit=e=>{e.preventDefault();if(S.answered)return next();const v=inp.value;if(!v.trim())return;judge(q,v.trim().toLowerCase().replace(/\s+/g,' ')===q.en,v.trim())};
  }else{
    if(jp)setupPad();
    ctl.innerHTML=`<button class="btn" id="reveal" style="width:100%">答えを見る</button>${jp?'<p class="hint" style="margin-top:8px">枠に書いてから押します。</p>':''}`;
    $('#reveal').onclick=reveal;
  }
}
function setupPad(){
  $('#padwrap').innerHTML=`<div class="padbox"><canvas id="pad" aria-label="手書きの練習スペース"></canvas><button class="btn ghost" id="clr-pad" type="button">消す</button></div>`;
  const c=$('#pad'),dpr=window.devicePixelRatio||1,r0=c.getBoundingClientRect();
  c.width=Math.round(r0.width*dpr);c.height=Math.round(r0.height*dpr);
  const x=c.getContext('2d');x.scale(dpr,dpr);x.lineCap='round';x.lineJoin='round';x.lineWidth=3.5;
  let d=false,lx=0,ly=0;
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{d=true;[lx,ly]=pos(e);try{c.setPointerCapture(e.pointerId)}catch(_){}x.strokeStyle=getComputedStyle(document.body).color;x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.01,ly);x.stroke();e.preventDefault()};
  c.onpointermove=e=>{if(!d)return;const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];for(const p of(evs.length?evs:[e])){const[px,py]=pos(p);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py}};
  c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>{d=false};
  for(const t of['touchstart','touchmove'])c.addEventListener(t,e=>e.preventDefault(),{passive:false});
  for(const t of['contextmenu','selectstart','dragstart'])c.addEventListener(t,e=>e.preventDefault());
  $('#clr-pad').onclick=()=>x.clearRect(0,0,c.width/dpr,c.height/dpr);
}
const speakBtn=q=>`<button class="btn ghost" id="spk" type="button" style="padding:6px 12px;font-size:13px">🔊 発音</button>`;
function reveal(){
  const q=DATA[S.ids[S.i]];
  $('#fb').innerHTML=`<p class="ans">${esc(answer_(q))}</p>${S.d==='jp'?'<p class="hint">書いた字と見比べましょう。</p>':''}${speakBtn()}`;
  $('#spk').onclick=()=>speak(q.en);
  $('#ctl').innerHTML=`<div class="row"><button class="btn" id="yes" style="flex:1">できた</button><button class="btn ghost" id="no" style="flex:1">まちがえた</button></div>`;
  $('#yes').focus();$('#yes').onclick=()=>judge(q,true,null);$('#no').onclick=()=>judge(q,false,null);
}
function judge(q,ok,val){
  S.answered=true;const wr=wrongs[S.d];
  if(ok){S.score++;wr.delete(q.id)}else{S.miss.push(q.id);wr.add(q.id)}
  saveW(S.d);
  const last=S.i===S.ids.length-1;
  $('#fb').innerHTML=(ok?`<div class="mark right">○</div><p class="ans ok">${esc(answer_(q))}</p>`
    :`<div class="mark wrong">×</div><div><p class="hint">${val?esc(val)+' は ちがいます':''}</p><p class="ans">${esc(answer_(q))}</p></div>`)+speakBtn();
  $('#spk').onclick=()=>speak(q.en);
  $('#ctl').innerHTML=`<button class="btn" id="nx" style="width:100%">${last?'結果を見る':'次の問題'}</button>`;
  const nx=$('#nx');nx.focus();nx.onclick=next;
}
function next(){if(S.i<S.ids.length-1){S.i++;show()}else finish()}
function finish(){
  const n=S.ids.length;
  if(S.g!=null){const b=bests[S.d];b[S.g]=Math.max(b[S.g]??0,S.score);store.set('ev_best_'+S.d,b)}
  const miss=S.miss.map(id=>DATA[id]),jp=S.d==='jp';
  app.innerHTML=`
  <div class="top fade"><h1>${esc(S.title)} のけっか</h1></div>
  <section class="panel fade"><div class="res"><b>${S.score}</b><span>/ ${n}問 正解</span></div>
    <p class="hint">${miss.length?'まちがえた問題は「間違えた問題」にたまります。':'全問正解です。'}</p></section>
  ${miss.length?`<section class="panel fade"><h2>まちがえた問題</h2><ul class="list">${miss.map(q=>`<li><span>${q.no}. ${esc(prompt_(q))}</span><span>${esc(answer_(q))}</span></li>`).join('')}</ul></section>`:''}
  <div class="row fade">
    ${miss.length?`<button class="btn" id="re">まちがえた${miss.length}問をやり直す</button>`:''}
    <button class="btn ghost" id="again">もう一度</button><button class="btn ghost" id="hm">一覧へ</button>
  </div>`;
  const ids=S.ids.slice(),t=S.title.replace(/（.+）$/,''),g=S.g,d=S.d,ms=S.miss.slice();
  const re=$('#re');if(re)re.onclick=()=>start(ms,'やり直し',null,d);
  $('#again').onclick=()=>start(shuffle?shuf(ids):ids,t,g,d);
  $('#hm').onclick=home;
}
home();
</script></body></html>
