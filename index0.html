<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>降水ナウキャスト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.css">

<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#fff;
}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  visibility:hidden;
  background:#fff;
}

.maplibregl-canvas{
  image-rendering:auto;
  transform:translateZ(0);
}

#loading{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  transition:opacity .25s ease;
  font-family:Arial,sans-serif;
}

#loading.hide{
  opacity:0;
  pointer-events:none;
}

.loading-box{
  width:min(82vw,360px);
  text-align:center;
}

.loading-title{
  font-size:20px;
  font-weight:bold;
  color:#222;
  margin-bottom:8px;
}

.loading-status{
  min-height:22px;
  font-size:14px;
  color:#666;
  margin-bottom:18px;
  line-height:1.6;
}

.loading-spinner{
  width:34px;
  height:34px;
  margin:0 auto 18px;
  border:4px solid #e5e5e5;
  border-top-color:#1976d2;
  border-radius:50%;
  animation:loading-spin .8s linear infinite;
}

@keyframes loading-spin{
  to{transform:rotate(360deg)}
}

.loading-progress{
  width:100%;
  height:5px;
  overflow:hidden;
  border-radius:10px;
  background:#e8e8e8;
}

.loading-progress-bar{
  width:0%;
  height:100%;
  border-radius:10px;
  background:#1976d2;
  transition:width .1s ease;
}

.loading-percent{
  margin-top:9px;
  font-size:12px;
  color:#888;
}

#connection-status{
  position:fixed;
  top:10px;
  right:10px;
  z-index:5000;
  padding:6px 10px;
  border-radius:14px;
  background:rgba(255,255,255,.88);
  box-shadow:0 2px 6px rgba(0,0,0,.18);
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:bold;
  color:#16823b;
  pointer-events:none;
  display:none;
  white-space:nowrap;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

#connection-status.unstable{
  color:#d88a00;
}

#connection-status.offline{
  color:#d32f2f;
}

#info-panel{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(255,255,255,.85);
  padding:10px 14px;
  border-radius:6px;
  font-size:14px;
  font-family:Arial,sans-serif;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  z-index:1000;
  visibility:hidden;
  pointer-events:none;
  transform:translateZ(0);
  line-height:1.5;
}

#clock{
  font-weight:bold;
}

#sat-time,
#nowcast-time{
  margin-top:2px;
}

.maplibregl-ctrl-bottom-left,
.maplibregl-ctrl-bottom-right{
  display:none !important;
}

#location-btn{
  position:fixed;
  right:12px;
  bottom:12px;
  z-index:5000;
  width:52px;
  height:52px;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  transition:background .15s ease,transform .15s ease;
}

#location-btn:active{
  transform:scale(.92);
}

#location-btn.active{
  background:#1976d2;
}

#location-btn svg{
  width:25px;
  height:25px;
  display:block;
  fill:none;
  stroke:#333;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#location-btn.active svg{
  stroke:#fff;
}

.user-location-marker{
  position:relative;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#1976d2;
  border:3px solid #fff;
  box-shadow:
    0 0 0 2px rgba(25,118,210,.45),
    0 2px 6px rgba(0,0,0,.35);
}

.user-location-marker::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:6px;
  height:6px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#fff;
}
</style>
</head>

<body>

<div id="loading">
  <div class="loading-box">
    <div id="loading-spinner" class="loading-spinner"></div>
    <div class="loading-title">降水ナウキャスト</div>
    <div id="loading-status" class="loading-status">地図を準備しています…</div>

    <div id="loading-progress" class="loading-progress">
      <div id="loading-progress-bar" class="loading-progress-bar"></div>
    </div>

    <div id="loading-percent" class="loading-percent">0%</div>
  </div>
</div>

<div id="connection-status">● オンライン</div>

<div id="map"></div>

<div id="info-panel">
  <div id="clock">----/--/-- --:--:--</div>
  <div id="sat-time">衛星: --</div>
  <div id="nowcast-time">降水: --</div>
</div>

<button
  id="location-btn"
  type="button"
  aria-label="現在地を表示"
  title="現在地"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="7"></circle>
    <line x1="12" y1="2" x2="12" y2="5"></line>
    <line x1="12" y1="19" x2="12" y2="22"></line>
    <line x1="2" y1="12" x2="5" y2="12"></line>
    <line x1="19" y1="12" x2="22" y2="12"></line>
  </svg>
</button>

<script src="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.js"></script>

<script>

/* =========================================================
   キャッシュバスター（スクリプトのみ更新）
========================================================= */

const APP_BOOT_ID =
  Date.now().toString(36) +
  '-' +
  Math.random().toString(36).slice(2);

const APP_CACHE_BUSTER =
  'fresh=' +
  encodeURIComponent(APP_BOOT_ID);

/* =========================================================
   初期状態
========================================================= */

let loadingError = false;
let mapReady = false;
let initializing = false;
let initGeneration = 0;

let jmaConnectionTimer = null;
let nowcastTimer = null;
let satelliteTimer = null;
let initialDisplayTimer = null;

let locationMarker = null;
let locationTimer = null;
let locationEnabled = false;
let locationFirstMove = true;

/* =========================================================
   非表示5分で自動リロード
========================================================= */

const RETURN_RELOAD_TIME =
  5 * 60 * 1000;

let hiddenAt = null;
let returnReloadTimer = null;

function startReturnReloadTimer(){

  if(returnReloadTimer){

    clearTimeout(
      returnReloadTimer
    );

    returnReloadTimer = null;
  }

  hiddenAt =
    Date.now();

  returnReloadTimer =
    setTimeout(
      () => {

        returnReloadTimer = null;

        if(document.hidden){

          window.location.reload();

        }

      },
      RETURN_RELOAD_TIME
    );
}

function cancelReturnReloadTimer(){

  if(returnReloadTimer){

    clearTimeout(
      returnReloadTimer
    );

    returnReloadTimer = null;
  }

  hiddenAt = null;
}

/* =========================================================
   DOM
========================================================= */

const loading =
  document.getElementById('loading');

const loadingStatus =
  document.getElementById('loading-status');

const loadingProgress =
  document.getElementById('loading-progress');

const loadingProgressBar =
  document.getElementById('loading-progress-bar');

const loadingPercent =
  document.getElementById('loading-percent');

const loadingSpinner =
  document.getElementById('loading-spinner');

const connectionStatus =
  document.getElementById('connection-status');

const mapElement =
  document.getElementById('map');

const infoPanel =
  document.getElementById('info-panel');

const locationBtn =
  document.getElementById('location-btn');

/* =========================================================
   接続状態
========================================================= */

function setConnectionStatus(state){

  connectionStatus.className = '';

  if(state === 'online'){

    connectionStatus.textContent =
      '● オンライン';

  }else if(state === 'unstable'){

    connectionStatus.textContent =
      '● 接続不安定';

    connectionStatus.classList.add(
      'unstable'
    );

  }else{

    connectionStatus.textContent =
      '● オフライン';

    connectionStatus.classList.add(
      'offline'
    );
  }

  if(mapReady){
    connectionStatus.style.display =
      'block';
  }
}

/* =========================================================
   初期エラー
========================================================= */

function showInitialError(message){

  loadingError = true;

  initGeneration++;

  if(initialDisplayTimer){

    clearTimeout(
      initialDisplayTimer
    );

    initialDisplayTimer = null;
  }

  mapElement.style.visibility =
    'hidden';

  infoPanel.style.visibility =
    'hidden';

  loading.style.display =
    'flex';

  loading.classList.remove(
    'hide'
  );

  loadingSpinner.style.display =
    'none';

  loadingProgress.style.display =
    'none';

  loadingPercent.style.display =
    'none';

  loadingStatus.innerHTML =
    message ||
    '降水ナウキャストのデータがありません。<br>' +
    'データがないか、通信に障害が発生しています。';

  setConnectionStatus(
    navigator.onLine
      ? 'unstable'
      : 'offline'
  );
}

/* =========================================================
   ローディング
========================================================= */

function showLoading(){

  loadingError = false;

  if(initialDisplayTimer){

    clearTimeout(
      initialDisplayTimer
    );

    initialDisplayTimer = null;
  }

  loading.style.display =
    'flex';

  loading.classList.remove(
    'hide'
  );

  loadingSpinner.style.display =
    'block';

  loadingProgress.style.display =
    'block';

  loadingPercent.style.display =
    'block';

  loadingProgressBar.style.width =
    '0%';

  loadingPercent.textContent =
    '0%';
}

function setLoading(
  text,
  percent
){

  if(loadingError) return;

  if(!navigator.onLine){

    if(!mapReady){

      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );
    }

    return;
  }

  loadingStatus.textContent =
    text;

  const value =
    Math.max(
      0,
      Math.min(
        100,
        percent
      )
    );

  loadingProgressBar.style.width =
    value + '%';

  loadingPercent.textContent =
    Math.round(value) + '%';
}

function showMapAfterLoading(){

  if(
    loadingError ||
    !navigator.onLine
  ){
    return;
  }

  loadingProgressBar.style.width =
    '100%';

  loadingPercent.textContent =
    '100%';

  loadingStatus.textContent =
    '地図の表示準備が完了しました';

  if(initialDisplayTimer){

    clearTimeout(
      initialDisplayTimer
    );

    initialDisplayTimer = null;
  }

  initialDisplayTimer =
    setTimeout(() => {

      initialDisplayTimer = null;

      if(
        loadingError ||
        !navigator.onLine
      ){
        return;
      }

      mapElement.style.visibility =
        'visible';

      infoPanel.style.visibility =
        'visible';

      mapReady = true;

      connectionStatus.style.display =
        'block';

      setConnectionStatus(
        'online'
      );

      requestAnimationFrame(() => {

        map.resize();
        map.triggerRepaint();

      });

      loading.classList.add(
        'hide'
      );

      setTimeout(() => {

        if(
          !loadingError &&
          navigator.onLine
        ){
          loading.style.display =
            'none';
        }

      },300);

    },50);
}

/* =========================================================
   定数
========================================================= */

const NOWCAST_OPACITY = 0.55;

const BASE_ZOOM = 8;
const HIGH_ZOOM = 10;

const TILE_SIZE = 256;

const CONCURRENCY = 8;

const TILE_TIMEOUT = 8000;

const TILE_X_MIN = 212;
const TILE_X_MAX = 243;

const TILE_Y_MIN = 92;
const TILE_Y_MAX = 115;

const NOWCAST_SCALE = 1;

const SAT_ZOOM = 4;

const SAT_SCALE =
  Math.pow(
    2,
    SAT_ZOOM - 4
  );

const SAT_X_MIN =
  10 * SAT_SCALE;

const SAT_X_MAX =
  19 * SAT_SCALE - 1;

const SAT_Y_MIN =
  1 * SAT_SCALE;

const SAT_Y_MAX =
  15 * SAT_SCALE - 1;

const SATELLITE_SCALE = 1;

let latestTime1 = '';
let latestTime2 = '';

let previousTimestamp = '';

let z10Generation = 0;

let switchingToZ10 = false;

let nowcastBusy = false;

let latestSatValidTime = null;
let latestSatBaseTime = null;

let satChecking = false;

/* =========================================================
   現在地
========================================================= */

function updateUserLocation(){

  if(!locationEnabled) return;

  if(!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(

    position => {

      if(!locationEnabled) return;

      const lng =
        position.coords.longitude;

      const lat =
        position.coords.latitude;

      if(
        !Number.isFinite(lng) ||
        !Number.isFinite(lat)
      ){
        return;
      }

      if(!locationMarker){

        const element =
          document.createElement(
            'div'
          );

        element.className =
          'user-location-marker';

        locationMarker =
          new maplibregl.Marker({
            element:element,
            anchor:'center'
          })
          .setLngLat([
            lng,
            lat
          ])
          .addTo(map);

      }else{

        locationMarker.setLngLat([
          lng,
          lat
        ]);
      }

      if(locationFirstMove){

        locationFirstMove = false;

        map.flyTo({

          center:[
            lng,
            lat
          ],

          zoom:10,

          duration:1000

        });
      }

    },

    error => {

      console.warn(
        '位置情報取得エラー:',
        error
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }
  );
}

function startLocationTracking(){

  if(locationEnabled) return;

  if(!navigator.geolocation) return;

  locationEnabled = true;

  locationFirstMove = true;

  locationBtn.classList.add(
    'active'
  );

  updateUserLocation();

  if(locationTimer){

    clearInterval(
      locationTimer
    );
  }

  locationTimer =
    setInterval(() => {

      if(
        locationEnabled &&
        !document.hidden
      ){
        updateUserLocation();
      }

    },3000);
}

function stopLocationTracking(){

  locationEnabled = false;

  locationBtn.classList.remove(
    'active'
  );

  if(locationTimer){

    clearInterval(
      locationTimer
    );

    locationTimer = null;
  }
}

locationBtn.addEventListener(
  'click',
  () => {

    if(locationEnabled){

      stopLocationTracking();

    }else{

      startLocationTracking();
    }
  }
);

/* =========================================================
   時刻
========================================================= */

function formatSatJST(
  utcString
){

  const value =
    String(utcString);

  const date =
    new Date(
      Date.UTC(

        Number(
          value.slice(0,4)
        ),

        Number(
          value.slice(4,6)
        ) - 1,

        Number(
          value.slice(6,8)
        ),

        Number(
          value.slice(8,10)
        ),

        Number(
          value.slice(10,12)
        )
      )
    );

  date.setUTCHours(
    date.getUTCHours() + 9
  );

  const m =
    String(
      date.getUTCMonth() + 1
    ).padStart(2,'0');

  const d =
    String(
      date.getUTCDate()
    ).padStart(2,'0');

  const h =
    String(
      date.getUTCHours()
    ).padStart(2,'0');

  const min =
    String(
      date.getUTCMinutes()
    ).padStart(2,'0');

  return (
    `${date.getUTCFullYear()}/${m}/${d} ${h}:${min} JST`
  );
}

/* =========================================================
   座標
========================================================= */

function tileXToLng(
  x,
  z
){

  return (
    (x / Math.pow(2, z) - 0.5) * 360
  );
}

function tileYToLat(
  y,
  z
){

  const n =
    Math.PI -
    (
      2 * Math.PI * y
    ) /
    Math.pow(2, z);

  return (
    (
      180 /
      Math.PI *
      Math.atan(
        Math.sinh(n)
      )
    )
  );
}

/* =========================================================
   降水ナウキャスト
========================================================= */

let nowcastSources = {};

function addNowcastSource(
  sourceId,
  urls
){

  if(
    nowcastSources[sourceId]
  ){
    return;
  }

  nowcastSources[sourceId] = urls;

  map.addSource(
    sourceId,
    {
      type:'raster',
      tiles:urls,
      tileSize:256
    }
  );
}

function removeNowcastSource(
  sourceId
){

  if(!nowcastSources[sourceId]){
    return;
  }

  const layers =
    map.getStyle().layers;

  for(const layer of layers){

    if(
      layer.source === sourceId
    ){

      map.removeLayer(
        layer.id
      );
    }
  }

  map.removeSource(
    sourceId
  );

  delete nowcastSources[
    sourceId
  ];
}

function addNowcastLayer(
  layerId,
  sourceId,
  zIndex
){

  const style =
    map.getStyle();

  if(!style) return;

  const layers =
    style.layers || [];

  let insertBeforeId = null;

  for(const layer of layers){

    if(
      layer.metadata &&
      layer.metadata['layer-type'] ===
      'boundary'
    ){

      insertBeforeId =
        layer.id;

      break;
    }
  }

  if(
    map.getLayer(
      layerId
    )
  ){
    map.removeLayer(
      layerId
    );
  }

  map.addLayer(
    {
      id:layerId,
      type:'raster',
      source:sourceId,
      paint:{
        'raster-opacity':
          NOWCAST_OPACITY
      }
    },
    insertBeforeId
  );
}

let nowcastLoadingCount = 0;

function loadNowcastTiles(
  generation
){

  if(
    nowcastBusy ||
    generation !== z10Generation
  ){
    return;
  }

  nowcastBusy = true;

  const now =
    new Date();

  const timestamp =
    [
      now.getUTCFullYear(),
      String(
        now.getUTCMonth() + 1
      ).padStart(2,'0'),
      String(
        now.getUTCDate()
      ).padStart(2,'0'),
      String(
        now.getUTCHours()
      ).padStart(2,'0'),
      String(
        now.getUTCMinutes()
      ).padStart(2,'0')
    ]
    .join('');

  if(
    previousTimestamp ===
    timestamp
  ){

    nowcastBusy = false;

    return;
  }

  previousTimestamp =
    timestamp;

  nowcastLoadingCount = 0;

  setLoading(
    '降水ナウキャストを読み込み中…',
    10
  );

  (async () => {

    try{

      const urls = [];

      for(
        let x = TILE_X_MIN;
        x <= TILE_X_MAX;
        x++
      ){

        for(
          let y = TILE_Y_MIN;
          y <= TILE_Y_MAX;
          y++
        ){

          const url =
            `https://www.jma.go.jp/bosai/jmatile/data/nowc/${timestamp}/none/${HIGH_ZOOM}/${x}/${y}.png?${APP_CACHE_BUSTER}`;

          urls.push({
            url:url,
            x:x,
            y:y
          });
        }
      }

      const sourceId =
        `nowcast-${timestamp}`;

      const tileUrls =
        urls.map(
          item =>
            item.url
        );

      addNowcastSource(
        sourceId,
        tileUrls
      );

      const layerId =
        `nowcast-${timestamp}-layer`;

      addNowcastLayer(
        layerId,
        sourceId,
        0
      );

      latestTime1 =
        timestamp;

      const oldSourceId =
        nowcastSources[
          sourceId
        ]
          ? Object.keys(
              nowcastSources
            ).find(
              id =>
                id.startsWith(
                  'nowcast-'
                ) &&
                id !== sourceId
            )
          : null;

      if(oldSourceId){

        removeNowcastSource(
          oldSourceId
        );
      }

      setLoading(
        '降水ナウキャストを読み込み中…',
        100
      );

      setTimeout(() => {

        nowcastBusy = false;

        if(
          generation ===
          z10Generation
        ){
          loadNowcastTiles(
            generation
          );
        }

      },60000);

    }catch(e){

      console.error(
        '降水ナウキャスト読み込みエラー:',
        e
      );

      nowcastBusy = false;

      if(
        generation ===
        z10Generation
      ){

        setTimeout(() => {

          loadNowcastTiles(
            generation
          );

        },10000);
      }
    }

  })();
}

/* =========================================================
   気象衛星
========================================================= */

let satelliteSources = {};

function addSatelliteSource(
  sourceId,
  urls
){

  if(
    satelliteSources[sourceId]
  ){
    return;
  }

  satelliteSources[sourceId] =
    urls;

  map.addSource(
    sourceId,
    {
      type:'raster',
      tiles:urls,
      tileSize:256
    }
  );
}

function removeSatelliteSource(
  sourceId
){

  if(
    !satelliteSources[sourceId]
  ){
    return;
  }

  const layers =
    map.getStyle().layers;

  for(const layer of layers){

    if(
      layer.source === sourceId
    ){

      map.removeLayer(
        layer.id
      );
    }
  }

  map.removeSource(
    sourceId
  );

  delete satelliteSources[
    sourceId
  ];
}

function addSatelliteLayer(
  layerId,
  sourceId
){

  const style =
    map.getStyle();

  if(!style) return;

  const layers =
    style.layers || [];

  let insertBeforeId = null;

  for(const layer of layers){

    if(
      layer.metadata &&
      (
        layer.metadata[
          'layer-type'
        ] ===
        'nowcast' ||
        layer.metadata[
          'layer-type'
        ] ===
        'boundary'
      )
    ){

      insertBeforeId =
        layer.id;

      break;
    }
  }

  if(
    map.getLayer(
      layerId
    )
  ){
    map.removeLayer(
      layerId
    );
  }

  map.addLayer(
    {
      id:layerId,
      type:'raster',
      source:sourceId,
      paint:{
        'raster-opacity':0.5
      }
    },
    insertBeforeId
  );
}

let satLoadingCount = 0;

function loadSatelliteTiles(){

  if(satChecking) return;

  satChecking = true;

  setLoading(
    '気象衛星画像を確認中…',
    5
  );

  (async () => {

    try{

      const validTimesUrl =
        'https://www.jma.go.jp/bosai/jmatile/data/sat/20220801_0900/targetTimes_nHem.json';

      const resp =
        await fetch(
          validTimesUrl +
          '?' +
          APP_CACHE_BUSTER
        );

      if(!resp.ok){

        throw new Error(
          `Failed to fetch valid times: ${resp.status}`
        );
      }

      const data =
        await resp.json();

      if(
        !Array.isArray(
          data.ValidTimes
        )
      ){

        throw new Error(
          'Invalid response format'
        );
      }

      const latestTime =
        data.ValidTimes[
          data.ValidTimes.length - 1
        ];

      if(
        !latestTime ||
        typeof latestTime !==
        'string'
      ){

        throw new Error(
          'No valid time available'
        );
      }

      latestSatValidTime =
        latestTime;

      latestSatBaseTime =
        '20220801_0900';

      setLoading(
        '気象衛星画像を読み込み中…',
        10
      );

      const urls = [];

      for(
        let x = SAT_X_MIN;
        x <= SAT_X_MAX;
        x++
      ){

        for(
          let y = SAT_Y_MIN;
          y <= SAT_Y_MAX;
          y++
        ){

          const url =
            `https://www.jma.go.jp/bosai/jmatile/data/sat/${latestSatBaseTime}/${latestSatValidTime}/${SAT_ZOOM}/${x}/${y}.png?${APP_CACHE_BUSTER}`;

          urls.push(url);
        }
      }

      const sourceId =
        `satellite-${latestSatValidTime}`;

      addSatelliteSource(
        sourceId,
        urls
      );

      const layerId =
        `satellite-${latestSatValidTime}-layer`;

      addSatelliteLayer(
        layerId,
        sourceId
      );

      latestTime2 =
        latestSatValidTime;

      const oldSourceId =
        Object.keys(
          satelliteSources
        ).find(
          id =>
            id.startsWith(
              'satellite-'
            ) &&
            id !== sourceId
        );

      if(oldSourceId){

        removeSatelliteSource(
          oldSourceId
        );
      }

      setLoading(
        '気象衛星画像を読み込み中…',
        100
      );

      satChecking = false;

      if(satelliteTimer){

        clearTimeout(
          satelliteTimer
        );
      }

      satelliteTimer =
        setTimeout(() => {

          loadSatelliteTiles();

        },60000);

    }catch(e){

      console.error(
        '気象衛星読み込みエラー:',
        e
      );

      satChecking = false;

      if(satelliteTimer){

        clearTimeout(
          satelliteTimer
        );
      }

      satelliteTimer =
        setTimeout(() => {

          loadSatelliteTiles();

        },30000);
    }

  })();
}

/* =========================================================
   境界線
========================================================= */

let boundarySources = {};

function loadBoundaryTiles(){

  if(
    boundarySources.boundary
  ){
    return;
  }

  const urls = [];

  for(
    let x = TILE_X_MIN;
    x <= TILE_X_MAX;
    x++
  ){

    for(
      let y = TILE_Y_MIN;
      y <= TILE_Y_MAX;
      y++
    ){

      const url =
        `https://www.jma.go.jp/bosai/jmatile/data/jikei_100000_wnull/2023010100000000/12/${x}/${y}.png?${APP_CACHE_BUSTER}`;

      urls.push(url);
    }
  }

  boundarySources.boundary = urls;

  map.addSource(
    'boundary',
    {
      type:'raster',
      tiles:urls,
      tileSize:256
    }
  );

  map.addLayer(
    {
      id:'boundary-layer',
      type:'raster',
      source:'boundary',
      paint:{
        'raster-opacity':1
      }
    }
  );
}

/* =========================================================
   マ��プ初期化
========================================================= */

let map;

(async () => {

  try{

    showLoading();

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          100
        )
    );

    map =
      new maplibregl.Map({
        container:'map',
        style:'https://maps.gsi.go.jp/xyz/pale/style.json',
        center:[
          137.7,
          35.7
        ],
        zoom:BASE_ZOOM,
        attributionControl:false
      });

    map.on(
      'load',
      () => {

        document.addEventListener(
          'visibilitychange',
          () => {

            if(
              document.hidden
            ){

              startReturnReloadTimer();

            }else{

              cancelReturnReloadTimer();

            }
          }
        );

        document.addEventListener(
          'visibilitychange',
          () => {

            if(
              !document.hidden
            ){

              const currentZoom =
                map.getZoom();

              if(
                currentZoom >= HIGH_ZOOM
              ){

                if(
                  z10Generation > 0
                ){

                  loadNowcastTiles(
                    z10Generation
                  );
                }

                loadSatelliteTiles();

              }
            }
          }
        );

        loadBoundaryTiles();

        loadSatelliteTiles();

        map.on(
          'zoom',
          () => {

            const currentZoom =
              map.getZoom();

            if(
              currentZoom >= HIGH_ZOOM &&
              !switchingToZ10
            ){

              if(
                z10Generation === 0
              ){

                z10Generation = 1;

              }else{

                z10Generation++;
              }

              switchingToZ10 = true;

              loadNowcastTiles(
                z10Generation
              );

              setTimeout(() => {

                switchingToZ10 = false;

              },1000);

            }
          }
        );

        showMapAfterLoading();

      }
    );

    map.on(
      'error',
      event => {

        console.error(
          'Map error:',
          event
        );

        showInitialError(
          'マップ読み込みエラーが発生しました。<br>' +
          '画面をリロードしてください。'
        );
      }
    );

  }catch(e){

    console.error(
      'Failed to initialize map:',
      e
    );

    showInitialError(
      'マップ初期化に失敗しました。<br>' +
      '画面をリロードしてください。'
    );
  }

})();

</script>
