<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>降水ナウキャスト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.css">
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#fff}
#map{position:absolute;inset:0;width:100%;height:100%;visibility:hidden;background:#fff}
.maplibregl-canvas{image-rendering:auto;transform:translateZ(0)}
#loading{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .25s ease;font-family:Arial,sans-serif}
#loading.hide{opacity:0;pointer-events:none}
.loading-box{width:min(82vw,360px);text-align:center}
.loading-title{font-size:20px;font-weight:bold;color:#222;margin-bottom:8px}
.loading-status{min-height:22px;font-size:14px;color:#666;margin-bottom:18px;line-height:1.6}
.loading-spinner{width:34px;height:34px;margin:0 auto 18px;border:4px solid #e5e5e5;border-top-color:#1976d2;border-radius:50%;animation:loading-spin .8s linear infinite}
@keyframes loading-spin{to{transform:rotate(360deg)}}
.loading-progress{width:100%;height:5px;overflow:hidden;border-radius:10px;background:#e8e8e8}
.loading-progress-bar{width:0%;height:100%;border-radius:10px;background:#1976d2;transition:width .1s ease}
.loading-percent{margin-top:9px;font-size:12px;color:#888}
#connection-status{position:fixed;top:10px;right:10px;z-index:5000;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.88);box-shadow:0 2px 6px rgba(0,0,0,.18);font-family:Arial,sans-serif;font-size:12px;color:#333}
#connection-status.unstable{color:#d88a00}
#connection-status.offline{color:#d32f2f}
#info-panel{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.85);padding:10px 14px;border-radius:6px;font-size:14px;font-family:Arial,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:100;visibility:hidden}
#clock{font-weight:bold}
#sat-time,#nowcast-time{margin-top:2px}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none !important}
#location-btn{position:fixed;right:12px;bottom:12px;z-index:5000;width:52px;height:52px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
#location-btn:hover{background:rgba(255,255,255,1)}
#location-btn:active{transform:scale(.92)}
#location-btn.active{background:#1976d2}
#location-btn svg{width:25px;height:25px;display:block;fill:none;stroke:#333;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#location-btn.active svg{stroke:#fff}
.user-location-marker{position:relative;width:18px;height:18px;border-radius:50%;background:#1976d2;border:3px solid #fff;box-shadow:0 0 0 2px rgba(25,118,210,.45),0 2px 6px rgba(0,0,0,.35)}
.user-location-marker::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;transform:translate(-50%,-50%);border-radius:50%;background:#fff}
</style>
</head>
<body>

<div id="loading">
  <div class="loading-box">
    <div id="loading-spinner" class="loading-spinner"></div>
    <div class="loading-title">降水ナウキャスト</div>
    <div id="loading-status" class="loading-status">地図を準備しています…</div>
    <div id="loading-progress" class="loading-progress"><div id="loading-progress-bar" class="loading-progress-bar"></div></div>
    <div id="loading-percent" class="loading-percent">0%</div>
  </div>
</div>

<div id="connection-status">● オンライン</div>
<div id="map"></div>

<div id="info-panel">
  <div id="clock">----/--/-- --:--:--</div>
  <div id="sat-time">衛星: --</div>
  <div id="nowcast-time">降水: --</div>
</div>

<button id="location-btn" type="button" aria-label="現在地を表示" title="現在地">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="7"></circle>
    <line x1="12" y1="2" x2="12" y2="5"></line>
    <line x1="12" y1="19" x2="12" y2="22"></line>
    <line x1="2" y1="12" x2="5" y2="12"></line>
    <line x1="19" y1="12" x2="22" y2="12"></line>
  </svg>
</button>

<script src="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.js"></script>
<script>

let loadingError = false;
let mapReady = false;
let initializing = false;
let initGeneration = 0;

let jmaConnectionTimer = null;
let nowcastTimer = null;
let satelliteTimer = null;
let initialDisplayTimer = null;

/* 現在地 */
let locationMarker = null;
let locationTimer = null;
let locationEnabled = false;
let locationFirstMove = true;

/* DOM */
const loading = document.getElementById('loading');
const loadingStatus = document.getElementById('loading-status');
const loadingProgress = document.getElementById('loading-progress');
const loadingProgressBar = document.getElementById('loading-progress-bar');
const loadingPercent = document.getElementById('loading-percent');
const loadingSpinner = document.getElementById('loading-spinner');
const connectionStatus = document.getElementById('connection-status');
const mapElement = document.getElementById('map');
const infoPanel = document.getElementById('info-panel');
const locationBtn = document.getElementById('location-btn');

/* グローバルmap変数 */
let map = null;

/* =========================================
   接続状態 / ローディング
========================================= */

function setConnectionStatus(state) {
  connectionStatus.className = '';

  if (state === 'online') {
    connectionStatus.textContent = '● オンライン';
  } else if (state === 'unstable') {
    connectionStatus.textContent = '● 接続不安定';
    connectionStatus.classList.add('unstable');
  } else {
    connectionStatus.textContent = '● オフライン';
    connectionStatus.classList.add('offline');
  }

  if (mapReady) connectionStatus.style.display = 'block';
}

function showInitialError(message) {
  loadingError = true;
  initGeneration++;

  if (initialDisplayTimer) {
    clearTimeout(initialDisplayTimer);
    initialDisplayTimer = null;
  }

  mapElement.style.visibility = 'hidden';
  infoPanel.style.visibility = 'hidden';

  loading.style.display = 'flex';
  loading.classList.remove('hide');

  loadingSpinner.style.display = 'none';
  loadingProgress.style.display = 'none';
  loadingPercent.style.display = 'none';

  loadingStatus.innerHTML =
    message ||
    '降水ナウキャストのデータがありません。<br>' +
    'データがないか、通信に障害が発生しています。';

  setConnectionStatus(navigator.onLine ? 'unstable' : 'offline');
}

function showLoading() {
  loadingError = false;

  if (initialDisplayTimer) {
    clearTimeout(initialDisplayTimer);
    initialDisplayTimer = null;
  }

  loading.style.display = 'flex';
  loading.classList.remove('hide');

  loadingSpinner.style.display = 'block';
  loadingProgress.style.display = 'block';
  loadingPercent.style.display = 'block';

  loadingProgressBar.style.width = '0%';
  loadingPercent.textContent = '0%';
}

function setLoading(text, percent) {
  if (loadingError) return;

  if (!navigator.onLine) {
    if (!mapReady) {
      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );
    }
    return;
  }

  loadingStatus.textContent = text;

  const value = Math.max(0, Math.min(100, percent));

  loadingProgressBar.style.width = value + '%';
  loadingPercent.textContent = Math.round(value) + '%';
}

function showMapAfterLoading() {
  if (loadingError || !navigator.onLine) return;

  loadingProgressBar.style.width = '100%';
  loadingPercent.textContent = '100%';
  loadingStatus.textContent = '地図の表示準備が完了しました';

  if (initialDisplayTimer) {
    clearTimeout(initialDisplayTimer);
    initialDisplayTimer = null;
  }

  initialDisplayTimer = setTimeout(() => {
    initialDisplayTimer = null;

    if (loadingError || !navigator.onLine) return;

    mapElement.style.visibility = 'visible';
    infoPanel.style.visibility = 'visible';

    mapReady = true;
    connectionStatus.style.display = 'block';

    setConnectionStatus('online');

    requestAnimationFrame(() => {
      if (map) {
        map.resize();
        map.triggerRepaint();
      }
    });

    loading.classList.add('hide');

    setTimeout(() => {
      if (!loadingError && navigator.onLine) {
        loading.style.display = 'none';
      }
    }, 300);

  }, 50);
}

/* =========================================
   定数
========================================= */

const NOWCAST_OPACITY = 0.55;
const BASE_ZOOM = 8;
const HIGH_ZOOM = 10;
const TILE_SIZE = 256;

const CONCURRENCY = 8;
const TILE_TIMEOUT = 8000;

const TILE_X_MIN = 212;
const TILE_X_MAX = 243;
const TILE_Y_MIN = 92;
const TILE_Y_MAX = 115;

const NOWCAST_SCALE = 1;

const SAT_ZOOM = 4;
const SAT_SCALE = Math.pow(2, SAT_ZOOM - 4);

const SAT_X_MIN = 11 * SAT_SCALE;
const SAT_X_MAX = 19 * SAT_SCALE - 1;
const SAT_Y_MIN = 1 * SAT_SCALE;
const SAT_Y_MAX = 15 * SAT_SCALE - 1;

const SATELLITE_SCALE = 1;

let latestTime1 = '';
let latestTime2 = '';
let previousTimestamp = '';
let z10Generation = 0;
let switchingToZ10 = false;
let nowcastBusy = false;

let latestSatValidTime = null;
let latestSatBaseTime = null;
let satChecking = false;

/* =========================================
   現在地
========================================= */

function updateUserLocation() {
  if (!locationEnabled) return;
  if (!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(
    position => {
      if (!locationEnabled) return;

      const lng = position.coords.longitude;
      const lat = position.coords.latitude;

      if (!Number.isFinite(lng) || !Number.isFinite(lat)) return;

      if (!locationMarker) {
        const element = document.createElement('div');
        element.className = 'user-location-marker';

        locationMarker = new maplibregl.Marker({
          element: element,
          anchor: 'center'
        })
        .setLngLat([lng, lat])
        .addTo(map);

      } else {
        locationMarker.setLngLat([lng, lat]);
      }

      if (locationFirstMove) {
        locationFirstMove = false;

        map.flyTo({
          center: [lng, lat],
          zoom: 10,
          duration: 1000
        });
      }
    },
    error => {
      console.warn('位置情報取得エラー:', error);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

function startLocationTracking() {
  if (locationEnabled) return;
  if (!navigator.geolocation) return;

  locationEnabled = true;
  locationFirstMove = true;

  locationBtn.classList.add('active');

  updateUserLocation();

  if (locationTimer) clearInterval(locationTimer);

  locationTimer = setInterval(() => {
    if (locationEnabled && !document.hidden) {
      updateUserLocation();
    }
  }, 3000);
}

function stopLocationTracking() {
  locationEnabled = false;

  locationBtn.classList.remove('active');

  if (locationTimer) {
    clearInterval(locationTimer);
    locationTimer = null;
  }
}

locationBtn.addEventListener('click', () => {
  if (locationEnabled) {
    stopLocationTracking();
  } else {
    startLocationTracking();
  }
});

/* =========================================
   時刻表示
========================================= */

function formatSatJST(utcString) {
  const value = String(utcString);

  const date = new Date(Date.UTC(
    Number(value.slice(0, 4)),
    Number(value.slice(4, 6)) - 1,
    Number(value.slice(6, 8)),
    Number(value.slice(8, 10)),
    Number(value.slice(10, 12))
  ));

  date.setUTCHours(date.getUTCHours() + 9);

  const m = String(date.getUTCMonth() + 1).padStart(2, '0');
  const d = String(date.getUTCDate()).padStart(2, '0');
  const h = String(date.getUTCHours()).padStart(2, '0');
  const min = String(date.getUTCMinutes()).padStart(2, '0');

  return `${date.getUTCFullYear()}/${m}/${d} ${h}:${min} JST`;
}

/* =========================================
   座標
========================================= */

function tileXToLng(x, z) {
  return (x / Math.pow(2, z)) * 360 - 180;
}

function tileYToLat(y, z) {
  const n = Math.PI - (2 * Math.PI * y / Math.pow(2, z));

  return (180 / Math.PI) *
    Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

function mosaicCoordinates(xMin, xMax, yMin, yMax, z) {
  const w = tileXToLng(xMin, z);
  const e = tileXToLng(xMax + 1, z);
  const n = tileYToLat(yMin, z);
  const s = tileYToLat(yMax + 1, z);

  return [
    [w, n],
    [e, n],
    [e, s],
    [w, s]
  ];
}

const nowcastCoordinates =
  mosaicCoordinates(
    TILE_X_MIN,
    TILE_X_MAX,
    TILE_Y_MIN,
    TILE_Y_MAX,
    BASE_ZOOM
  );

const satCoordinates =
  mosaicCoordinates(
    SAT_X_MIN,
    SAT_X_MAX,
    SAT_Y_MIN,
    SAT_Y_MAX,
    SAT_ZOOM
  );

/* =========================================
   高画質モザイク
========================================= */

async function buildMosaic(options) {
  const xMin = options.xMin;
  const yMin = options.yMin;

  const cols = options.xMax - xMin + 1;
  const rows = options.yMax - yMin + 1;

  const total = cols * rows;

  const scale =
    options.scale === undefined ? 1 : options.scale;

  const outputTileSize = TILE_SIZE * scale;

  const canvas = document.createElement('canvas');

  canvas.width = cols * outputTileSize;
  canvas.height = rows * outputTileSize;

  const ctx = canvas.getContext('2d', {
    alpha: true,
    willReadFrequently: false
  });

  ctx.imageSmoothingEnabled = false;

  let next = 0;
  let done = 0;
  let loaded = 0;

  const worker = async () => {
    while (true) {
      const i = next++;

      if (i >= total) return;
      if (!navigator.onLine) return;

      const x = xMin + (i % cols);
      const y = yMin + Math.floor(i / cols);

      const controller = new AbortController();

      const timer = setTimeout(() => {
        controller.abort();
      }, TILE_TIMEOUT);

      try {
        const response = await fetch(
          options.urlFn(x, y),
          {
            signal: controller.signal
          }
        );

        if (response.ok) {
          const blob = await response.blob();

          if (window.createImageBitmap) {

            const bitmap = await createImageBitmap(
              blob,
              {
                colorSpaceConversion: 'none'
              }
            );

            ctx.drawImage(
              bitmap,
              (x - xMin) * outputTileSize,
              (y - yMin) * outputTileSize,
              outputTileSize,
              outputTileSize
            );

            bitmap.close();

          } else {

            const img = new Image();

            const objectURL = URL.createObjectURL(blob);

            img.src = objectURL;

            await new Promise(resolve => {
              img.onload = resolve;
              img.onerror = resolve;
            });

            ctx.drawImage(
              img,
              (x - xMin) * outputTileSize,
              (y - yMin) * outputTileSize,
              outputTileSize,
              outputTileSize
            );

            URL.revokeObjectURL(objectURL);
          }

          loaded++;
        }

      } catch (error) {
        /* 取得失敗タイルは空白のまま */
      } finally {

        clearTimeout(timer);

        done++;

        if (
          options.onProgress &&
          (done % 8 === 0 || done === total)
        ) {
          options.onProgress(done, total);
        }
      }
    }
  };

  await Promise.all(
    Array.from(
      { length: CONCURRENCY },
      worker
    )
  );

  if (!navigator.onLine || loaded === 0) {
    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    return null;
  }

  return canvas;
}

/* =========================================
   キャンバスレイヤー
========================================= */

let canvasSeq = 0;
const activeCanvasLayers = {};

function swapCanvasLayer(
  key,
  canvas,
  coordinates,
  layerOptions,
  beforeId
) {
  const n = ++canvasSeq;

  const sourceId =
    key + '-src-' + n;

  const layerId =
    key + '-layer-' + n;

  const layers =
    map.getStyle().layers || [];

  for (const layer of layers) {
    if (layer.id.startsWith(key + '-layer-')) {
      if (map.getLayer(layer.id)) {
        map.removeLayer(layer.id);
      }
    }
  }

  const previousCanvas =
    activeCanvasLayers[key] &&
    activeCanvasLayers[key].canvas;

  const sources =
    map.getStyle().sources || {};

  for (const srcId in sources) {
    if (srcId.startsWith(key + '-src-')) {
      if (map.getSource(srcId)) {
        map.removeSource(srcId);
      }
    }
  }

  map.addSource(sourceId, {
    type: 'canvas',
    canvas: canvas,
    coordinates: coordinates,
    animate: false
  });

  map.addLayer(
    {
      id: layerId,
      type: 'raster',
      source: sourceId,
      minzoom: layerOptions.minzoom,
      maxzoom: layerOptions.maxzoom,
      paint: {
        'raster-opacity': layerOptions.opacity,
        'raster-resampling': layerOptions.resampling,
        'raster-fade-duration': 0
      }
    },
    beforeId
  );

  if (
    previousCanvas &&
    previousCanvas !== canvas
  ) {
    previousCanvas.width = 0;
    previousCanvas.height = 0;
  }

  activeCanvasLayers[key] = {
    sourceId: sourceId,
    layerId: layerId,
    canvas: canvas
  };

  map.triggerRepaint();
}

function activeLayerId(key) {
  const active =
    activeCanvasLayers[key];

  return active &&
    map.getLayer(active.layerId)
    ? active.layerId
    : null;
}

function setNowcastOpacity(value) {
  const id = activeLayerId('nowcast');

  if (id) {
    map.setPaintProperty(
      id,
      'raster-opacity',
      value
    );
  }
}

/* =========================================
   衛星
========================================= */

async function getSatLatestTime() {
  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 5000);

  try {
    const response = await fetch(
      'https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_fd.json?' +
      Date.now(),
      {
        cache: 'no-store',
        signal: controller.signal
      }
    );

    if (!response.ok) {
      throw new Error(
        'targetTimes_fd.json取得失敗'
      );
    }

    const data =
      await response.json();

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {
      throw new Error(
        '時刻データがありません'
      );
    }

    data.sort((a, b) =>
      String(a.validtime)
        .localeCompare(String(b.validtime))
    );

    return data[data.length - 1];

  } finally {
    clearTimeout(timeout);
  }
}

function getSatelliteBeforeLayerId() {
  const layers =
    map.getStyle().layers || [];

  const z10Layer =
    layers.find(layer =>
      layer.id.startsWith(
        'nowcast-z10-layer-'
      )
    );

  if (z10Layer) {
    return z10Layer.id;
  }

  const nowcastId =
    activeLayerId('nowcast');

  if (nowcastId) {
    return nowcastId;
  }

  return 'jma-mask';
}

async function updateSatellite() {
  if (satChecking) return;
  if (!map || !map.isStyleLoaded()) return;

  if (!navigator.onLine) {
    setConnectionStatus('offline');
    return;
  }

  satChecking = true;

  try {
    const target =
      await getSatLatestTime();

    const baseTime =
      String(target.basetime);

    const validTime =
      String(target.validtime);

    if (
      latestSatValidTime === validTime &&
      latestSatBaseTime === baseTime &&
      activeLayerId('satellite')
    ) {
      return;
    }

    const canvas =
      await buildMosaic({
        xMin: SAT_X_MIN,
        xMax: SAT_X_MAX,
        yMin: SAT_Y_MIN,
        yMax: SAT_Y_MAX,

        scale: SATELLITE_SCALE,

        urlFn: (x, y) => {
          const worldTiles =
            Math.pow(2, SAT_ZOOM);

          const wx =
            ((x % worldTiles) +
              worldTiles) %
            worldTiles;

          return (
            'https://www.jma.go.jp/bosai/himawari/data/satimg/' +
            baseTime +
            '/fd/' +
            validTime +
            '/B13/TBB/' +
            SAT_ZOOM +
            '/' +
            wx +
            '/' +
            y +
            '.jpg'
          );
        }
      });

    if (!canvas) {
      throw new Error(
        '衛星モザイク生成失敗'
      );
    }

    swapCanvasLayer(
      'satellite',
      canvas,
      satCoordinates,
      {
        minzoom: 0,
        maxzoom: 19,
        opacity: 0.65,
        resampling: 'linear'
      },
      getSatelliteBeforeLayerId()
    );

    latestSatValidTime =
      validTime;

    latestSatBaseTime =
      baseTime;

    document.getElementById(
      'sat-time'
    ).textContent =
      '衛星: ' +
      formatSatJST(validTime);

  } catch (error) {

    console.warn(
      '衛星画像更新エラー:',
      error
    );

    if (navigator.onLine) {
      setConnectionStatus('unstable');
    }

  } finally {

    satChecking = false;
  }
}

/* =========================================
   JMA通信速度チェック
========================================= */

async function checkJMAConnection() {
  if (!navigator.onLine) {
    setConnectionStatus('offline');
    return false;
  }

  const start =
    performance.now();

  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 5000);

  try {
    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?check=' +
        Date.now(),
        {
          cache: 'no-store',
          signal: controller.signal
        }
      );

    clearTimeout(timeout);

    const elapsed =
      performance.now() - start;

    if (!response.ok) {
      if (navigator.onLine) {
        setConnectionStatus('unstable');
      }

      return false;
    }

    setConnectionStatus(
      elapsed >= 1000
        ? 'unstable'
        : 'online'
    );

    return true;

  } catch (error) {

    clearTimeout(timeout);

    setConnectionStatus(
      navigator.onLine
        ? 'unstable'
        : 'offline'
    );

    return false;
  }
}

function startConnectionMonitor() {
  if (jmaConnectionTimer) {
    clearInterval(
      jmaConnectionTimer
    );
  }

  jmaConnectionTimer =
    setInterval(() => {
      checkJMAConnection();
    }, 1000);
}

/* =========================================
   最新時刻取得
========================================= */

async function fetchLatestTimes() {
  if (!navigator.onLine) {

    if (!mapReady) {
      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );
    }

    return false;
  }

  const start =
    performance.now();

  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 8000);

  try {
    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?' +
        Date.now(),
        {
          cache: 'no-store',
          signal: controller.signal
        }
      );

    clearTimeout(timeout);

    if (!response.ok) {
      throw new Error(
        'targetTimes_N1.json取得失敗'
      );
    }

    const data =
      await response.json();

    if (
      !Array.isArray(data) ||
      data.length < 2
    ) {
      throw new Error(
        '時刻データが不足しています'
      );
    }

    data.sort((a, b) =>
      String(a).localeCompare(String(b))
    );

    latestTime1 =
      String(data[data.length - 2]);

    latestTime2 =
      String(data[data.length - 1]);

    document.getElementById(
      'nowcast-time'
    ).textContent =
      '降水: ' + latestTime2;

    return true;

  } catch (error) {

    console.warn(
      '最新時刻取得エラー:',
      error
    );

    if (navigator.onLine) {
      setConnectionStatus('unstable');
    }

    return false;

  } finally {

    clearTimeout(timeout);
  }
}

/* =========================================
   降水ナウキャスト更新
========================================= */

async function updateNowcast() {
  if (nowcastBusy) return;
  if (!navigator.onLine) return;
  if (!mapReady && !initializing) return;

  nowcastBusy = true;

  try {
    const success =
      await fetchLatestTimes();

    if (!success) {
      throw new Error(
        '時刻情報の取得に失敗'
      );
    }

    const zoomLevel =
      map.getZoom();

    const targetZoom =
      zoomLevel >= HIGH_ZOOM
        ? 'z10'
        : 'base';

    let sourceTime =
      targetZoom === 'z10'
        ? latestTime2
        : latestTime1;

    if (!sourceTime) {
      throw new Error(
        'ソース時刻が未設定'
      );
    }

    if (previousTimestamp === sourceTime) {
      return;
    }

    previousTimestamp =
      sourceTime;

    const generation =
      ++z10Generation;

    if (targetZoom === 'z10') {
      switchingToZ10 = true;
    }

    setLoading(
      '降水データを読み込み中…',
      20
    );

    const canvas =
      await buildMosaic({
        xMin: TILE_X_MIN,
        xMax: TILE_X_MAX,
        yMin: TILE_Y_MIN,
        yMax: TILE_Y_MAX,

        scale: NOWCAST_SCALE,

        onProgress: (done, total) => {
          const percent =
            20 + (done / total) * 60;

          setLoading(
            '降水データを読み込み中…',
            percent
          );
        },

        urlFn: (x, y) => {
          return (
            'https://www.jma.go.jp/bosai/jmatile/data/nowc/' +
            sourceTime +
            '/100/' +
            BASE_ZOOM +
            '/' +
            x +
            '/' +
            y +
            '.png'
          );
        }
      });

    if (generation !== z10Generation) {
      return;
    }

    if (!canvas) {
      throw new Error(
        '降水モザイク生成失敗'
      );
    }

    if (targetZoom === 'z10') {
      const z10Canvas =
        await buildMosaic({
          xMin: TILE_X_MIN,
          xMax: TILE_X_MAX,
          yMin: TILE_Y_MIN,
          yMax: TILE_Y_MAX,

          scale: NOWCAST_SCALE,

          urlFn: (x, y) => {
            return (
              'https://www.jma.go.jp/bosai/jmatile/data/nowc/' +
              latestTime2 +
              '/100/' +
              HIGH_ZOOM +
              '/' +
              (x * 2) +
              '/' +
              (y * 2) +
              '.png'
            );
          }
        });

      if (z10Canvas && generation === z10Generation) {
        swapCanvasLayer(
          'nowcast-z10',
          z10Canvas,
          nowcastCoordinates,
          {
            minzoom: HIGH_ZOOM,
            maxzoom: 19,
            opacity: NOWCAST_OPACITY,
            resampling: 'linear'
          },
          'jma-mask'
        );
      }
    }

    if (generation !== z10Generation) {
      return;
    }

    swapCanvasLayer(
      'nowcast',
      canvas,
      nowcastCoordinates,
      {
        minzoom: 0,
        maxzoom: targetZoom === 'z10' ? HIGH_ZOOM - 0.5 : 19,
        opacity: NOWCAST_OPACITY,
        resampling: 'linear'
      },
      'jma-mask'
    );

    if (!mapReady) {
      showMapAfterLoading();
    }

    setLoading(
      '降水データを読み込み中…',
      100
    );

  } catch (error) {

    console.warn(
      '降水ナウキャスト更新エラー:',
      error
    );

    if (!mapReady) {
      showInitialError(
        '降水ナウキャストのデータ取得に失敗しました。<br>' +
        'しばらく経ってから再度アクセスしてください。'
      );
    } else if (navigator.onLine) {
      setConnectionStatus('unstable');
    }

  } finally {

    nowcastBusy = false;
    switchingToZ10 = false;
  }
}

/* =========================================
   時計
========================================= */

function updateClock() {
  const now = new Date();

  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');

  document.getElementById('clock').textContent =
    `${y}/${m}/${d} ${h}:${min}:${s}`;
}

/* =========================================
   定期実行
========================================= */

async function initializeMap() {
  if (initializing) return;

  initializing = true;
  const generation = ++initGeneration;

  showLoading();

  try {
    setLoading(
      '地図を初期化中…',
      5
    );

    map = new maplibregl.Map({
      container: 'map',
      style: 'https://tile.openstreetmap.jp/styles/osm-bright/style.json',
      center: [138, 36.5],
      zoom: BASE_ZOOM,
      minZoom: 4,
      maxZoom: 18,
      attributionControl: false
    });

    await new Promise(resolve => {
      map.once('load', resolve);
    });

    if (generation !== initGeneration) return;

    setLoading(
      '地図要素を追加中…',
      15
    );

    map.addSource('jma-mask', {
      type: 'geojson',
      data: {
        type: 'Feature',
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [-180, -85],
            [180, -85],
            [180, 85],
            [-180, 85],
            [-180, -85]
          ]]
        }
      }
    });

    map.addLayer({
      id: 'jma-mask',
      type: 'fill',
      source: 'jma-mask',
      paint: {
        'fill-color': '#fff',
        'fill-opacity': 0
      }
    });

    startConnectionMonitor();
    setInterval(updateClock, 500);

    updateClock();

    await updateNowcast();

    if (generation !== initGeneration) return;

    nowcastTimer = setInterval(() => {
      updateNowcast();
    }, 60000);

    satelliteTimer = setInterval(() => {
      updateSatellite();
    }, 600000);

    updateSatellite();

  } catch (error) {

    console.error(
      'マップ初期化エラー:',
      error
    );

    if (generation === initGeneration) {
      showInitialError(
        'マップの初期化に失敗しました。<br>' +
        'ページをリロードしてください。'
      );
    }

  } finally {

    if (generation === initGeneration) {
      initializing = false;
    }
  }
}

/* =========================================
   起動
========================================= */

window.addEventListener('online', () => {
  setConnectionStatus('online');
  if (mapReady) {
    fetchLatestTimes();
  }
});

window.addEventListener('offline', () => {
  setConnectionStatus('offline');
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && mapReady) {
    updateNowcast();
    updateSatellite();
  }
});

map = null;
initializeMap();

</script>
