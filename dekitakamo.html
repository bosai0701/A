<script>

/* =====================================
   URL設定
===================================== */

/* ブラウザは wss のみで接続する。強震モニタの取得・解析はWorker側 */
const WS_URL =
'wss://green-grass-374f.mirakuro5472.workers.dev/';

const NTP_URL =
'https://api.wolfx.jp/ntp.json';

const POINTS_URL =
'https://raw.githubusercontent.com/ingen084/kyoshin-monitor-observation-points/refs/heads/master/intensity-points.json';

/* =====================================
   更新設定
===================================== */

const TIME_SYNC_INTERVAL = 60000;
const TIME_SYNC_SAMPLES = 5;

const POINTS_TIMEOUT = 8000;

const RECONNECT_BASE = 1000;
const RECONNECT_MAX = 10000;
const PING_INTERVAL = 10000;
const HIDDEN_DISCONNECT = 60000;

/* =====================================
   状態
===================================== */

let clockBaseEpoch = null;
let clockBasePerf = null;
let clockSynced = false;
let timeSyncPromise = null;

let lastAppliedImageMs = null;

let records = null;
let recordsPromise = null;

let preparedPoints = null;

/* 観測点（静的情報＋解析結果）。地図には色とindexだけを渡す */
let stations = [];
let forceUpdate = true;

let firstFit = true;
let map;

let lastImageWidth = 0;
let lastImageHeight = 0;

let lastImageCompletedPerf = null;

const $ = id => document.getElementById(id);

const HEX = Array.from({length:256},(_,i)=>i.toString(16).padStart(2,'0'));

/* =====================================
   共通処理
===================================== */

const p2 = n=>String(n).padStart(2,'0');

/* 値が変わらない時はDOMに触らない */
function setText(el,text){

 if(el._t===text)return;

 el._t=text;
 el.textContent=text;
}

let lastStatusKey=null;

function setStatus(message,isError=false){

 const key=(isError?'E':'N')+message;

 if(key===lastStatusKey)return;

 lastStatusKey=key;

 const el=$('status');
 el.textContent='';

 const dot=document.createElement('span');
 dot.className='status-dot';

 el.appendChild(dot);
 el.appendChild(document.createTextNode(message));

 el.classList.toggle('error',isError);
}

function getSyncedNow(){

 if(!clockSynced){
  return Date.now();
 }

 return clockBaseEpoch+
  (performance.now()-clockBasePerf);
}

function jstParts(ms){

 const d=new Date(ms+9*3600e3);

 return {
  Y:d.getUTCFullYear(),
  M:p2(d.getUTCMonth()+1),
  D:p2(d.getUTCDate()),
  h:p2(d.getUTCHours()),
  m:p2(d.getUTCMinutes()),
  s:p2(d.getUTCSeconds())
 };
}

function formatJST(ms){

 const t=jstParts(ms);

 return `${t.Y}/${t.M}/${t.D} ${t.h}:${t.m}:${t.s}`;
}

function updateDiagnostics(fetchMs,analysisMs,intervalMs){

 const fetchText=
  Number.isFinite(fetchMs)
   ?`${(fetchMs/1000).toFixed(2)}秒`
   :'—';

 const analysisText=
  Number.isFinite(analysisMs)
   ?`${(analysisMs/1000).toFixed(2)}秒`
   :'—';

 setText(
  $('diagnostics'),
  `画像取得 ${fetchText} / 画像解析 ${analysisText} / 更新間隔 1.00秒`
 );
}

/* =====================================
   Wolfx時刻同期
===================================== */

async function fetchWolfxTime(){

 const start=performance.now();

 const controller=new AbortController();

 const timeout=setTimeout(
  ()=>controller.abort(),
  8000
 );

 try{

  const response=await fetch(
   NTP_URL+'?_='+Date.now(),
   {
    cache:'no-store',
    signal:controller.signal
   }
  );

  if(!response.ok){
   throw new Error('Wolfx HTTP '+response.status);
  }

  const data=await response.json();

  const end=performance.now();

  let epoch=Number(data.timestamp);

  if(!Number.isFinite(epoch)||epoch<1000000000000){

   const value=data.JST?.int;

   if(value){

    const s=String(value);

    if(/^\d{14}$/.test(s)){

     const iso=
      `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T`+
      `${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}+09:00`;

     epoch=Date.parse(iso);
    }
   }
  }

  if(!Number.isFinite(epoch)){
   throw new Error('Wolfx時刻を解析できません');
  }

  return {
   epoch,
   perf:(start+end)/2,
   rtt:end-start
  };

 }finally{
  clearTimeout(timeout);
 }
}

async function syncClock(){

 if(timeSyncPromise){
  return timeSyncPromise;
 }

 timeSyncPromise=(async()=>{

  const samples=[];

  for(let i=0;i<TIME_SYNC_SAMPLES;i++){

   try{
    samples.push(await fetchWolfxTime());
   }catch(e){
    console.warn('Wolfx同期失敗:',e);
   }
  }

  if(!samples.length){
   throw new Error('Wolfx時刻を取得できません');
  }

  samples.sort((a,b)=>a.rtt-b.rtt);

  const best=samples[0];

  clockBaseEpoch=best.epoch;
  clockBasePerf=best.perf;
  clockSynced=true;

  console.log('Wolfx時刻同期完了',{
   RTT:Math.round(best.rtt),
   samples:samples.length,
   serverTime:new Date(best.epoch).toISOString()
  });

  return best;

 })().finally(()=>{
  timeSyncPromise=null;
 });

 return timeSyncPromise;
}

async function maintainClock(){

 try{
  await syncClock();
 }catch(e){
  console.error('時刻再同期エラー:',e);
 }

 setTimeout(maintainClock,TIME_SYNC_INTERVAL);
}

/* =====================================
   Wolfx時刻表示
   秒が変わるタイミングでのみ更新
===================================== */

function tickSyncTime(){

 const now=getSyncedNow();

 setText($('syncTime'),formatJST(now));

 setTimeout(
  tickSyncTime,
  1000-(now%1000)+15
 );
}

/* =====================================
   WSS受信（Workerから配信）
   受信: バイナリ（little endian）
   [type u8][画像時刻ms f64][幅 u16][高さ u16][flags u8]
   [観測点総数 u16][件数 u16][サーバー処理ms u16][閲覧数 u16]
   続けて件数ぶん [index u16][有効 u8][r u8][g u8][b u8]
   flags bit0 = 全データ（差分ではなく全置換）
===================================== */

const wsStats={
 state:'未接続',
 connects:0,
 frames:0,
 errors:0,
 lastRecvPerf:null,
 clients:null
};

function updateWsInfo(){

 const ago=
  wsStats.lastRecvPerf===null
   ?'—'
   :((performance.now()-wsStats.lastRecvPerf)/1000).toFixed(1)+'秒前';

 const viewers=
  wsStats.clients===null
   ?'—'
   :wsStats.clients+'人';

 setText(
  $('wsInfo'),
  `WSS ${wsStats.state} / 接続回数 ${wsStats.connects}\n`+
  `受信 ${wsStats.frames} / 失敗 ${wsStats.errors} / 最終受信 ${ago} / 接続中 ${viewers}`
 );
}

let ws=null;
let wsPing=null;
let wsReconnectTimer=null;
let wsAttempt=0;
let wsWanted=true;
let hiddenTimer=null;

function scheduleReconnect(){

 if(!wsWanted)return;

 clearTimeout(wsReconnectTimer);

 const delay=Math.min(
  RECONNECT_BASE*2**wsAttempt,
  RECONNECT_MAX
 );

 wsAttempt++;

 setStatus('サーバーとの接続が切れました。再接続します…',true);

 wsReconnectTimer=setTimeout(connectStream,delay);
}

function handleTextMessage(text){

 let msg=null;

 try{
  msg=JSON.parse(text);
 }catch(_){
  return;
 }

 if(msg&&msg.type==='error'){

  wsStats.errors++;

  setStatus('サーバー取得エラー：'+msg.msg,true);

  updateWsInfo();
 }
}

function connectStream(){

 if(!wsWanted)return;

 if(
  ws&&
  (ws.readyState===WebSocket.OPEN||
   ws.readyState===WebSocket.CONNECTING)
 ){
  return;
 }

 wsStats.state='接続処理中';
 updateWsInfo();

 const s=new WebSocket(WS_URL);

 s.binaryType='arraybuffer';

 ws=s;

 s.onopen=()=>{

  wsAttempt=0;

  wsStats.connects++;
  wsStats.state='接続中';

  updateWsInfo();

  clearInterval(wsPing);

  wsPing=setInterval(()=>{

   try{
    if(s.readyState===WebSocket.OPEN){
     s.send('ping');
    }
   }catch(_){}

  },PING_INTERVAL);

  setStatus('サーバーから最新画像を待っています…');

  loadPoints().catch(()=>{});
 };

 s.onmessage=ev=>{

  if(typeof ev.data==='string'){
   handleTextMessage(ev.data);
   return;
  }

  wsStats.frames++;
  wsStats.lastRecvPerf=performance.now();

  const buf=ev.data;

  loadPoints()
   .then(()=>{

    if(ws===s){
     applyFrame(buf);
    }

   })
   .catch(e=>{

    wsStats.errors++;

    setStatus('観測点取得失敗：'+e.message,true);

    /* 差分が欠けたまま進まないよう、再接続して全データを受け取り直す */
    try{
     s.close();
    }catch(_){}
   });
 };

 s.onerror=()=>{};

 s.onclose=()=>{

  if(ws===s){
   ws=null;
  }

  clearInterval(wsPing);

  wsStats.state='切断';

  updateWsInfo();

  scheduleReconnect();
 };
}

/* =====================================
   RGB → HSV変換
===================================== */

function rgbToHSV(r,g,b){

 r/=255;
 g/=255;
 b/=255;

 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);

 const delta=max-min;

 let h=0;
 const v=max;

 const s=max===0?0:delta/max;

 if(delta!==0){

  if(max===r){

   h=(g-b)/delta;

   if(g<b){
    h+=6;
   }

  }else if(max===g){

   h=(b-r)/delta+2;

  }else{

   h=(r-g)/delta+4;
  }

  h/=6;
 }

 return {h,s,v};
}

/* =====================================
   HSV → 色の位置
   区分的多項式補間
===================================== */

function colorToPosition(hsv){

 const h=hsv.h;
 const s=hsv.s;
 const v=hsv.v;

 if(!(v>0.1&&s>0.75)){
  return null;
 }

 let p=0;

 if(h>0.1476){

  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;
  const h5=h4*h;
  const h6=h5*h;

  p=
   280.31*h6
   -916.05*h5
   +1142.6*h4
   -709.95*h3
   +234.65*h2
   -40.27*h
   +3.2217;

 }else if(h>0.001){

  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;

  p=
   151.4*h4
   -49.32*h3
   +6.753*h2
   -2.481*h
   +0.9033;

 }else{

  p=
   -0.005171*v*v
   -0.3282*v
   +1.2236;
 }

 if(p<0){
  p=0;
 }

 if(!Number.isFinite(p)){
  return null;
 }

 return p;
}

/* =====================================
   観測点JSON解析
===================================== */

function walkRecords(value,out=[]){

 if(Array.isArray(value)){

  for(const v of value){
   walkRecords(v,out);
  }

  return out;
 }

 if(value&&typeof value==='object'){

  if(
   value.location&&
   value.point&&
   value.point.center_point
  ){
   out.push(value);
  }

  for(const v of Object.values(value)){

   if(v&&typeof v==='object'){
    walkRecords(v,out);
   }
  }
 }

 return out;
}

/* =====================================
   観測点の事前計算
===================================== */

function preparePoints(recs){

 const result=[];

 for(const item of recs){

  const loc=item.location||{};
  const point=item.point||{};

  const center=point.center_point||{};
  const offset=point.offset||{};

  const lat=Number(loc.latitude);
  const lon=Number(loc.longitude);

  const x=
   Number(center.x)+Number(offset.x||0);

  const y=
   Number(center.y)+Number(offset.y||0);

  if(
   !Number.isFinite(lat)||
   !Number.isFinite(lon)||
   !Number.isFinite(x)||
   !Number.isFinite(y)
  ){
   continue;
  }

  if(item.is_suspended===true)continue;

  result.push({

   lat,
   lon,

   x:Math.round(x),
   y:Math.round(y),

   name:
    item.name||
    item.point_name||
    item.station_name||
    item.code||
    '観測点',

   region:
    item.region||
    item.prefecture||
    '',

   code:item.code||''
  });
 }

 return result;
}

/* =====================================
   観測点JSON取得
===================================== */

function loadPoints(){

 if(recordsPromise){
  return recordsPromise;
 }

 setStatus('観測点JSONを取得しています…');

 recordsPromise=(async()=>{

  const controller=new AbortController();

  const timeout=setTimeout(
   ()=>controller.abort(),
   POINTS_TIMEOUT
  );

  try{

   const response=await fetch(
    POINTS_URL,
    {
     cache:'force-cache',
     signal:controller.signal
    }
   );

   if(!response.ok){
    throw new Error('観測点JSON HTTP '+response.status);
   }

   const raw=await response.text();

   const data=JSON.parse(raw.replace(/^\uFEFF/,''));

   records=walkRecords(data);

   if(!records.length){
    throw new Error('観測点データが見つかりません');
   }

   preparedPoints=preparePoints(records);

   if(!preparedPoints.length){
    throw new Error('有効な観測点がありません');
   }

   setText($('total'),records.length.toLocaleString());

   console.log('観測点準備完了',{
    total:records.length,
    prepared:preparedPoints.length
   });

   return preparedPoints;

  }finally{

   clearTimeout(timeout);
  }

 })().catch(e=>{

  recordsPromise=null;
  records=null;
  preparedPoints=null;

  throw e;
 });

 return recordsPromise;
}

/* =====================================
   観測点の作成（サーバーと同じ条件で絞り込む）
===================================== */

function prepareStations(width,height){

 if(
  stations.length&&
  lastImageWidth===width&&
  lastImageHeight===height
 ){
  return;
 }

 lastImageWidth=width;
 lastImageHeight=height;

 stations=preparedPoints
  .filter(p=>
   p.x>=0&&
   p.y>=0&&
   p.x<width&&
   p.y<height
  )
  .map((p,i)=>({

   i,

   geom:{
    type:'Point',
    coordinates:[p.lon,p.lat]
   },

   name:p.name,
   region:p.region,
   code:p.code,

   x:p.x,
   y:p.y,

   r:0,
   g:0,
   b:0,

   hex:'#000000',
   position:null,

   valid:false
  }));

 forceUpdate=true;
}

/* =====================================
   受信データの反映
   HSV・多項式補間
   推定震度は計算しない
   ・サーバーは色が変わった観測点だけを送る
   ・変化がなければ地図データを更新しない
   ・地図へは有効地点の index と色だけを渡す
===================================== */

function applyFrame(buf){

 const started=performance.now();

 if(buf.byteLength<22)return;

 const dv=new DataView(buf);

 if(dv.getUint8(0)!==1)return;

 const ms=dv.getFloat64(1,true);
 const w=dv.getUint16(9,true);
 const h=dv.getUint16(11,true);
 const flags=dv.getUint8(13);
 const total=dv.getUint16(14,true);
 const count=dv.getUint16(16,true);
 const serverMs=dv.getUint16(18,true);
 const clients=dv.getUint16(20,true);

 if(buf.byteLength!==22+count*6){

  console.error('フレーム長が不正です',buf.byteLength,count);

  return;
 }

 wsStats.clients=clients;

 prepareStations(w,h);

 if(stations.length!==total){

  setStatus(
   '観測点数がサーバーと一致しません（サーバー '+
   total+' / 端末 '+stations.length+'）',
   true
  );

  return;
 }

 setText($('imageSize'),`${w} × ${h}px`);

 let changed=forceUpdate;

 if(flags&1){

  for(const st of stations){
   st.valid=false;
   st.position=null;
  }

  changed=true;
 }

 let o=22;

 for(let k=0;k<count;k++,o+=6){

  const i=dv.getUint16(o,true);

  const st=stations[i];

  if(!st)continue;

  changed=true;

  if(!dv.getUint8(o+2)){

   st.valid=false;
   st.position=null;

   continue;
  }

  const r=dv.getUint8(o+3);
  const g=dv.getUint8(o+4);
  const b=dv.getUint8(o+5);

  st.r=r;
  st.g=g;
  st.b=b;

  const position=colorToPosition(rgbToHSV(r,g,b));

  if(position===null){

   st.valid=false;
   st.position=null;

   continue;
  }

  st.hex='#'+HEX[r]+HEX[g]+HEX[b];
  st.position=position;
  st.valid=true;
 }

 let shown=0;

 for(const st of stations){
  if(st.valid)shown++;
 }

 setText($('shown'),shown.toLocaleString());

 if(changed&&map){

  const source=map.getSource('stations');

  if(source){

   const features=[];

   for(const st of stations){

    if(!st.valid)continue;

    features.push({
     type:'Feature',
     geometry:st.geom,
     properties:{i:st.i,hex:st.hex}
    });
   }

   source.setData({
    type:'FeatureCollection',
    features
   });

   forceUpdate=false;
  }
 }

 if(firstFit&&shown){

  firstFit=false;
  fitAll();
 }

 setText($('imgTime'),formatJST(ms));

 lastAppliedImageMs=ms;

 const analysisDuration=performance.now()-started;

 const completedPerf=performance.now();

 const updateInterval=
  lastImageCompletedPerf===null
   ?null
   :completedPerf-lastImageCompletedPerf;

 lastImageCompletedPerf=completedPerf;

 updateDiagnostics(
  serverMs,
  analysisDuration,
  updateInterval
 );

 setStatus('オンライン：サーバー配信の画像をHSV・多項式補間で解析しています');

 updateWsInfo();
}

/* =====================================
   地図レイヤー
===================================== */

function addSourceAndLayer(){

 if(!map.getSource('stations')){

  map.addSource('stations',{
   type:'geojson',
   data:{type:'FeatureCollection',features:[]}
  });
 }

 if(!map.getLayer('station-points')){

  map.addLayer({

   id:'station-points',
   type:'circle',
   source:'stations',

   paint:{

    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,1.5,
     5,2.9,
     8,3.8,
     11,4.7
    ],

    'circle-color':['get','hex'],

    'circle-stroke-color':'#ffffff',

    'circle-stroke-width':0.35,

    'circle-opacity':1
   }

  });

  map.on('click','station-points',e=>{

   const f=e.features&&e.features[0];

   if(!f)return;

   const st=stations[f.properties.i];

   if(!st)return;

   const hsv=rgbToHSV(st.r,st.g,st.b);

   const hsvText=
    `${hsv.h.toFixed(5)}, `+
    `${hsv.s.toFixed(5)}, `+
    `${hsv.v.toFixed(5)}`;

   new maplibregl.Popup({
    closeButton:true,
    offset:4.4
   })

   .setLngLat(st.geom.coordinates)

   .setHTML(`

    <div class="popup-title">
     ${esc(st.name)}
    </div>

    ${st.region?
     `地域：${esc(st.region)}<br>`:''}

    ${st.code?
     `コード：${esc(st.code)}<br>`:''}

    画像座標：(${st.x}, ${st.y})<br>

    RGB：${st.r}, ${st.g}, ${st.b}<br>

    HEX：${esc(st.hex)}<br>

    HSV：${esc(hsvText)}<br>

    色位置：${Number(st.position).toFixed(5)}

   `)

   .addTo(map);

  });

  map.on(
   'mouseenter',
   'station-points',
   ()=>map.getCanvas().style.cursor='pointer'
  );

  map.on(
   'mouseleave',
   'station-points',
   ()=>map.getCanvas().style.cursor=''
  );
 }
}

/* =====================================
   HTMLエスケープ
===================================== */

function esc(v){

 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

/* =====================================
   全観測点表示
===================================== */

function fitAll(){

 if(!map||!stations.length)return;

 const bounds=new maplibregl.LngLatBounds();

 for(const st of stations){
  bounds.extend(st.geom.coordinates);
 }

 map.fitBounds(bounds,{
  padding:45,
  maxZoom:7,
  duration:700
 });
}

/* =====================================
   地図初期化
===================================== */

map=new maplibregl.Map({

 container:'map',

 style:'https://tiles.openfreemap.org/styles/liberty',

 center:[138,37],

 zoom:4.2,

 attributionControl:true

});

map.on('error',e=>{

 console.error('MapLibre:',e.error||e);

});

map.addControl(
 new maplibregl.NavigationControl(),
 'top-right'
);

/* =====================================
   バックグラウンド・復帰時の接続管理
   非表示が続いたら切断し、戻ったら再接続
===================================== */

document.addEventListener(
 'visibilitychange',
 ()=>{

  if(document.hidden){

   clearTimeout(hiddenTimer);

   hiddenTimer=setTimeout(()=>{

    wsWanted=false;

    clearTimeout(wsReconnectTimer);

    if(ws){

     try{
      ws.close(1000,'hidden');
     }catch(_){}
    }

   },HIDDEN_DISCONNECT);

  }else{

   clearTimeout(hiddenTimer);

   wsWanted=true;

   connectStream();
  }
 }
);

window.addEventListener(
 'pageshow',
 ()=>{

  wsWanted=true;

  connectStream();
 }
);

/* =====================================
   起動処理
===================================== */

map.on('load',()=>{

 addSourceAndLayer();

 setStatus('サーバーに接続しています…');

 maintainClock();

 tickSyncTime();

 connectStream();

 setInterval(updateWsInfo,1000);

});

</script>
