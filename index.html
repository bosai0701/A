<script>
const WS_URL =
'wss://tags-clicks-repeated-painted.trycloudflare.com/';

const NTP_URL =
'https://api.wolfx.jp/ntp.json';

const POINTS_URL =
'https://raw.githubusercontent.com/ingen084/kyoshin-monitor-observation-points/refs/heads/master/intensity-points.json';

const TIME_SYNC_INTERVAL = 60000;
const TIME_SYNC_SAMPLES = 5;
const POINTS_TIMEOUT = 8000;
const RECONNECT_BASE = 1000;
const RECONNECT_MAX = 10000;
const PING_INTERVAL = 10000;
const HIDDEN_DISCONNECT = 60000;

const INITIAL_CENTER = [138,36.5];
const INITIAL_ZOOM = 4.2;

const JAPAN_BOUNDS = [
 [122.5,24],
 [146,46]
];

const MAP_PADDING = {
 top:90,
 right:35,
 bottom:70,
 left:35
};

/* =========================================================
   グリッド検知パラメータ
========================================================= */

const GRID_PARAMS = Object.freeze({

 /*
  * 0.1度単位
  * 日本付近では約11km × 約8～9km
  */
 GRID_SIZE:0.1,

 /*
  * 直近10フレームの履歴
  * 通常の約1秒間隔のフレームを想定
  */
 HISTORY_COUNT:10,

 /*
  * グリッドの震度上昇量
  */
 MIN_RISE:0.35,

 /*
  * 検知対象とする最低震度
  */
 MIN_INTENSITY:-1,

 /*
  * 隣接するグリッドの必要数
  * 自分自身を含まず1個以上
  */
 MIN_NEIGHBORS:1,

 /*
  * イベント終了までの保持時間
  */
 EXPIRE_SECONDS:[
  20,
  30,
  40,
  70,
  80
 ],

 /*
  * 時刻が大きく飛んだ場合の履歴リセット
  */
 HISTORY_RESET_GAP:5

});

let clockBaseEpoch = null;
let clockBasePerf = null;
let clockSynced = false;
let timeSyncPromise = null;
let lastAppliedImageMs = null;
let records = null;
let recordsPromise = null;
let preparedPoints = null;
let stations = [];
let forceUpdate = true;
let firstFit = true;
let map;
let lastImageWidth = 0;
let lastImageHeight = 0;

const $ = id => document.getElementById(id);

const HEX = Array.from(
 {length:256},
 (_,i)=>i.toString(16).padStart(2,'0')
);

const p2 = n=>String(n).padStart(2,'0');

function setText(el,text){
 if(el._t===text)return;
 el._t=text;
 el.textContent=text;
}

function getSyncedNow(){
 if(!clockSynced){
  return Date.now();
 }

 return clockBaseEpoch+
  (performance.now()-clockBasePerf);
}

function jstParts(ms){
 const d=new Date(ms+9*3600e3);

 return {
  Y:d.getUTCFullYear(),
  M:p2(d.getUTCMonth()+1),
  D:p2(d.getUTCDate()),
  h:p2(d.getUTCHours()),
  m:p2(d.getUTCMinutes()),
  s:p2(d.getUTCSeconds())
 };
}

function formatJST(ms){
 const t=jstParts(ms);

 return `${t.Y}/${t.M}/${t.D} ${t.h}:${t.m}:${t.s}`;
}

async function fetchWolfxTime(){
 const start=performance.now();

 const controller=new AbortController();

 const timeout=setTimeout(
  ()=>controller.abort(),
  8000
 );

 try{
  const response=await fetch(
   NTP_URL+'?_='+Date.now(),
   {
    cache:'no-store',
    signal:controller.signal
   }
  );

  if(!response.ok){
   throw new Error('Wolfx HTTP '+response.status);
  }

  const data=await response.json();
  const end=performance.now();

  let epoch=Number(data.timestamp);

  if(!Number.isFinite(epoch)||epoch<1000000000000){
   const value=data.JST?.int;

   if(value){
    const s=String(value);

    if(/^\d{14}$/.test(s)){
     const iso=
      `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T`+
      `${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}+09:00`;

     epoch=Date.parse(iso);
    }
   }
  }

  if(!Number.isFinite(epoch)){
   throw new Error('Wolfx時刻を解析できません');
  }

  return {
   epoch,
   perf:(start+end)/2,
   rtt:end-start
  };

 }finally{
  clearTimeout(timeout);
 }
}

async function syncClock(){
 if(timeSyncPromise){
  return timeSyncPromise;
 }

 timeSyncPromise=(async()=>{
  const samples=[];

  for(let i=0;i<TIME_SYNC_SAMPLES;i++){
   try{
    samples.push(await fetchWolfxTime());
   }catch(e){
    console.warn('Wolfx同期失敗:',e);
   }
  }

  if(!samples.length){
   throw new Error('Wolfx時刻を取得できません');
  }

  samples.sort((a,b)=>a.rtt-b.rtt);

  const best=samples[0];

  clockBaseEpoch=best.epoch;
  clockBasePerf=best.perf;
  clockSynced=true;

  console.log('Wolfx時刻同期完了',{
   RTT:Math.round(best.rtt),
   samples:samples.length,
   serverTime:new Date(best.epoch).toISOString()
  });

  return best;

 })().finally(()=>{
  timeSyncPromise=null;
 });

 return timeSyncPromise;
}

async function maintainClock(){
 try{
  await syncClock();
 }catch(e){
  console.error('時刻再同期エラー:',e);
 }

 setTimeout(maintainClock,TIME_SYNC_INTERVAL);
}

function tickSyncTime(){
 const now=getSyncedNow();

 setText($('syncTime'),formatJST(now));

 setTimeout(
  tickSyncTime,
  1000-(now%1000)+15
 );
}

/* =========================================================
   WebSocket
========================================================= */

const wsStats={
 state:'未接続',
 connects:0,
 frames:0,
 errors:0,
 lastRecvPerf:null,
 clients:null
};

let ws=null;
let wsPing=null;
let wsReconnectTimer=null;
let wsAttempt=0;
let wsWanted=true;
let hiddenTimer=null;

function updateWsInfo(){
 const el=$('wsInfo');

 const connected=
  ws&&ws.readyState===WebSocket.OPEN;

 el.classList.toggle('connected',!!connected);

 const label=el.querySelector('span:last-child');

 setText(
  label,
  connected?'WSS 接続中':'WSS 未接続'
 );
}

function scheduleReconnect(){
 if(!wsWanted)return;

 clearTimeout(wsReconnectTimer);

 const delay=Math.min(
  RECONNECT_BASE*2**wsAttempt,
  RECONNECT_MAX
 );

 wsAttempt++;

 wsReconnectTimer=setTimeout(connectStream,delay);
}

function handleTextMessage(text){
 let msg=null;

 try{
  msg=JSON.parse(text);
 }catch(_){
  return;
 }

 if(msg&&msg.type==='error'){
  wsStats.errors++;
 }
}

function connectStream(){
 if(!wsWanted)return;

 if(
  ws&&
  (ws.readyState===WebSocket.OPEN||
   ws.readyState===WebSocket.CONNECTING)
 ){
  return;
 }

 updateWsInfo();

 const s=new WebSocket(WS_URL);

 s.binaryType='arraybuffer';

 ws=s;

 s.onopen=()=>{
  wsAttempt=0;
  wsStats.connects++;
  wsStats.state='接続中';

  updateWsInfo();

  clearInterval(wsPing);

  wsPing=setInterval(()=>{
   try{
    if(s.readyState===WebSocket.OPEN){
     s.send('ping');
    }
   }catch(_){}
  },PING_INTERVAL);

  loadPoints().catch(()=>{});
 };

 s.onmessage=ev=>{
  if(typeof ev.data==='string'){
   handleTextMessage(ev.data);
   return;
  }

  wsStats.frames++;

  wsStats.lastRecvPerf=performance.now();

  const buf=ev.data;

  loadPoints()
   .then(()=>{
    if(ws===s){
     applyFrame(buf);
    }
   })
   .catch(e=>{
    wsStats.errors++;

    console.error('観測点データ処理エラー:',e);

    try{
     s.close();
    }catch(_){}
   });
 };

 s.onerror=()=>{};

 s.onclose=()=>{
  if(ws===s){
   ws=null;
  }

  clearInterval(wsPing);

  wsStats.state='切断';

  updateWsInfo();

  scheduleReconnect();
 };
}

/* =========================================================
   RGB → HSV → 強震モニタスケール
========================================================= */

function rgbToHSV(r,g,b){
 r/=255;
 g/=255;
 b/=255;

 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);
 const delta=max-min;

 let h=0;

 const v=max;
 const s=max===0?0:delta/max;

 if(delta!==0){
  if(max===r){
   h=(g-b)/delta;

   if(g<b){
    h+=6;
   }

  }else if(max===g){
   h=(b-r)/delta+2;

  }else{
   h=(r-g)/delta+4;
  }

  h/=6;
 }

 return {h,s,v};
}

function colorToPosition(hsv){
 const h=hsv.h;
 const s=hsv.s;
 const v=hsv.v;

 if(!(v>0.1&&s>0.75)){
  return null;
 }

 let p=0;

 if(h>0.1476){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;
  const h5=h4*h;
  const h6=h5*h;

  p=
   280.31*h6
   -916.05*h5
   +1142.6*h4
   -709.95*h3
   +234.65*h2
   -40.27*h
   +3.2217;

 }else if(h>0.001){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;

  p=
   151.4*h4
   -49.32*h3
   +6.753*h2
   -2.481*h
   +0.9033;

 }else{
  p=
   -0.005171*v*v
   -0.3282*v
   +1.2236;
 }

 if(p<0){
  p=0;
 }

 if(!Number.isFinite(p)){
  return null;
 }

 return p;
}

function scaleToIntensity(scale){
 return scale*10-3;
}

/* =========================================================
   観測点JSON
========================================================= */

function walkRecords(value,out=[]){
 if(Array.isArray(value)){
  for(const v of value){
   walkRecords(v,out);
  }

  return out;
 }

 if(value&&typeof value==='object'){
  if(
   value.location&&
   value.point&&
   value.point.center_point
  ){
   out.push(value);
  }

  for(const v of Object.values(value)){
   if(v&&typeof v==='object'){
    walkRecords(v,out);
   }
  }
 }

 return out;
}

function preparePoints(recs){
 const result=[];

 for(const item of recs){
  const loc=item.location||{};
  const point=item.point||{};
  const center=point.center_point||{};
  const offset=point.offset||{};

  const lat=Number(loc.latitude);
  const lon=Number(loc.longitude);

  const x=
   Number(center.x)+Number(offset.x||0);

  const y=
   Number(center.y)+Number(offset.y||0);

  if(
   !Number.isFinite(lat)||
   !Number.isFinite(lon)||
   !Number.isFinite(x)||
   !Number.isFinite(y)
  ){
   continue;
  }

  if(item.is_suspended===true)continue;

  result.push({
   lat,
   lon,
   x:Math.round(x),
   y:Math.round(y),

   name:
    item.name||
    item.point_name||
    item.station_name||
    item.code||
    '観測点',

   region:
    item.region||
    item.prefecture||
    '',

   code:item.code||''
  });
 }

 return result;
}

function loadPoints(){
 if(recordsPromise){
  return recordsPromise;
 }

 recordsPromise=(async()=>{
  const controller=new AbortController();

  const timeout=setTimeout(
   ()=>controller.abort(),
   POINTS_TIMEOUT
  );

  try{
   const response=await fetch(
    POINTS_URL,
    {
     cache:'force-cache',
     signal:controller.signal
    }
   );

   if(!response.ok){
    throw new Error('観測点JSON HTTP '+response.status);
   }

   const raw=await response.text();

   const data=JSON.parse(raw.replace(/^\uFEFF/,''));

   records=walkRecords(data);

   if(!records.length){
    throw new Error('観測点データが見つかりません');
   }

   preparedPoints=preparePoints(records);

   if(!preparedPoints.length){
    throw new Error('有効な観測点がありません');
   }

   setText(
    $('total'),
    records.length.toLocaleString()
   );

   console.log('観測点準備完了',{
    total:records.length,
    prepared:preparedPoints.length
   });

   return preparedPoints;

  }finally{
   clearTimeout(timeout);
  }

 })().catch(e=>{
  recordsPromise=null;
  records=null;
  preparedPoints=null;
  throw e;
 });

 return recordsPromise;
}

/* =========================================================
   グリッド検知エンジン
========================================================= */

const gridEngine={
 grids:new Map(),
 events:[],
 lastFrameTime:null,
 nextEventId:1,
 processedFrames:0
};

/*
 * グリッドキー
 *
 * 0.1度ごとに区切る。
 * 同じグリッド内の観測点は1つのセルに集約する。
 */
function getGridIndex(lon,lat){
 const size=GRID_PARAMS.GRID_SIZE;

 return {
  x:Math.floor(lon/size),
  y:Math.floor(lat/size)
 };
}

function getGridKey(x,y){
 return `${x}:${y}`;
}

function getGridBounds(grid){
 const size=GRID_PARAMS.GRID_SIZE;

 const west=grid.x*size;
 const south=grid.y*size;

 return {
  west,
  south,
  east:west+size,
  north:south+size
 };
}

/*
 * 全観測点をグリッドに振り分ける。
 * 観測点は検知イベントを直接生成しない。
 */
function setupGrids(){
 gridEngine.grids.clear();
 gridEngine.events=[];
 gridEngine.lastFrameTime=null;

 for(const st of stations){
  const index=getGridIndex(st.lon,st.lat);
  const key=getGridKey(index.x,index.y);

  let grid=gridEngine.grids.get(key);

  if(!grid){
   grid={
    key,
    x:index.x,
    y:index.y,
    stations:[],
    history:[],
    intensity:null,
    previousIntensity:null,
    rise:0,
    valid:false,
    active:false,
    level:0
   };

   gridEngine.grids.set(key,grid);
  }

  grid.stations.push(st);
 }

 console.log('グリッド初期化完了',{
  grids:gridEngine.grids.size,
  stations:stations.length,
  gridSize:GRID_PARAMS.GRID_SIZE
 });
}

/*
 * 震度レベル
 */
function getShakeLevel(intensity){
 if(intensity>=4.5)return 4;
 if(intensity>=2.5)return 3;
 if(intensity>=0.5)return 2;
 if(intensity>=-1)return 1;
 return 0;
}

function getShakeLevelName(level){
 return [
  '弱い揺れ',
  '弱い揺れ',
  '中程度',
  '強い揺れ',
  '非常に強い揺れ'
 ][level]||'不明';
}

function getShakeLevelClass(level){
 return 'shake-level-'+level;
}

function getExpireSeconds(level){
 return GRID_PARAMS.EXPIRE_SECONDS[level]??20;
}

/*
 * グリッド内の最大震度を計算する。
 *
 * 無効な観測点は集計しない。
 * すべて無効なら、そのグリッドは無効。
 */
function aggregateGridIntensity(){
 for(const grid of gridEngine.grids.values()){
  let maxIntensity=null;

  for(const st of grid.stations){
   if(!st.valid||!Number.isFinite(st.intensity)){
    continue;
   }

   if(
    maxIntensity===null||
    st.intensity>maxIntensity
   ){
    maxIntensity=st.intensity;
   }
  }

  grid.intensity=maxIntensity;
  grid.valid=maxIntensity!==null;
 }
}

/*
 * グリッドの履歴を更新する。
 *
 * 直近10フレームのうち、最も古い有効値と
 * 現在値の差を上昇量として扱う。
 */
function updateGridHistory(grid){
 const history=grid.history;

 let previous=null;

 for(const sample of history){
  if(sample!==null){
   previous=sample;
   break;
  }
 }

 grid.previousIntensity=previous;

 if(
  grid.valid&&
  previous!==null
 ){
  grid.rise=grid.intensity-previous;
 }else{
  grid.rise=0;
 }

 history.unshift(
  grid.valid?grid.intensity:null
 );

 if(history.length>GRID_PARAMS.HISTORY_COUNT){
  history.length=GRID_PARAMS.HISTORY_COUNT;
 }

 grid.level=grid.valid
  ?getShakeLevel(grid.intensity)
  :0;
}

/*
 * 隣接する8方向のグリッドを取得する。
 */
function getNeighborGrids(grid){
 const result=[];

 for(let dy=-1;dy<=1;dy++){
  for(let dx=-1;dx<=1;dx++){
   if(dx===0&&dy===0)continue;

   const key=getGridKey(
    grid.x+dx,
    grid.y+dy
   );

   const neighbor=gridEngine.grids.get(key);

   if(neighbor){
    result.push(neighbor);
   }
  }
 }

 return result;
}

/*
 * グリッドの検知候補を作る。
 *
 * 自分のグリッドが上昇し、
 * 隣接グリッドも上昇していることが条件。
 */
function findActiveGrids(){
 const candidates=[];

 for(const grid of gridEngine.grids.values()){
  grid.active=false;

  if(!grid.valid)continue;

  if(
   grid.previousIntensity===null||
   grid.rise<GRID_PARAMS.MIN_RISE||
   grid.intensity<GRID_PARAMS.MIN_INTENSITY
  ){
   continue;
  }

  const neighbors=getNeighborGrids(grid);

  let activeNeighborCount=0;

  for(const neighbor of neighbors){
   if(
    neighbor.valid&&
    neighbor.previousIntensity!==null&&
    neighbor.rise>=GRID_PARAMS.MIN_RISE&&
    neighbor.intensity>=GRID_PARAMS.MIN_INTENSITY
   ){
    activeNeighborCount++;
   }
  }

  if(
   activeNeighborCount<
   GRID_PARAMS.MIN_NEIGHBORS
  ){
   continue;
  }

  grid.active=true;
  candidates.push(grid);
 }

 return candidates;
}

/*
 * 検知中のグリッドを隣接関係でグループ化する。
 *
 * 1つの連続したグリッド群が1イベントになる。
 */
function createGridClusters(activeGrids){
 const activeMap=new Map();

 for(const grid of activeGrids){
  activeMap.set(grid.key,grid);
 }

 const visited=new Set();
 const clusters=[];

 for(const start of activeGrids){
  if(visited.has(start.key))continue;

  const stack=[start];
  const cells=[];

  visited.add(start.key);

  while(stack.length){
   const current=stack.pop();

   cells.push(current);

   for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
     if(dx===0&&dy===0)continue;

     const key=getGridKey(
      current.x+dx,
      current.y+dy
     );

     const neighbor=activeMap.get(key);

     if(!neighbor||visited.has(key)){
      continue;
     }

     visited.add(key);
     stack.push(neighbor);
    }
   }
  }

  /*
   * 1セルだけの反応はイベントにしない。
   * 少なくとも2つの隣接グリッドを必要とする。
   */
  if(cells.length>=2){
   clusters.push(cells);
  }
 }

 return clusters;
}

/*
 * グリッドイベント同士の接続判定。
 */
function gridsTouch(a,b){
 return Math.abs(a.x-b.x)<=1&&
        Math.abs(a.y-b.y)<=1;
}

function clusterTouchesEvent(cluster,event){
 for(const grid of cluster){
  for(const oldGrid of event.cells){
   if(gridsTouch(grid,oldGrid)){
    return true;
   }
  }
 }

 return false;
}

/*
 * イベント統合。
 */
function mergeGridEvents(target,source){
 if(target===source)return;

 for(const grid of source.cells){
  target.cells.add(grid);
 }

 target.level=Math.max(
  target.level,
  source.level
 );

 target.peakIntensity=Math.max(
  target.peakIntensity,
  source.peakIntensity
 );

 target.lastActiveAt=Math.max(
  target.lastActiveAt,
  source.lastActiveAt
 );

 gridEngine.events=gridEngine.events.filter(
  event=>event!==source
 );
}

/*
 * 新しいグリッドイベントを生成する。
 */
function createGridEvent(cluster,time){
 let maxIntensity=-Infinity;
 let level=0;

 for(const grid of cluster){
  maxIntensity=Math.max(
   maxIntensity,
   grid.intensity
  );

  level=Math.max(level,grid.level);
 }

 const event={
  id:gridEngine.nextEventId++,
  createdAt:time,
  lastActiveAt:time,
  level,
  peakIntensity:maxIntensity,
  cells:new Set(cluster)
 };

 gridEngine.events.push(event);

 return event;
}

/*
 * クラスタと既存イベントを結び付ける。
 *
 * 隣接したイベントは古いイベントに統合する。
 */
function updateGridEvents(clusters,time){
 for(const cluster of clusters){
  const matched=gridEngine.events.filter(
   event=>clusterTouchesEvent(cluster,event)
  );

  let event;

  if(matched.length===0){
   event=createGridEvent(cluster,time);

  }else{
   matched.sort(
    (a,b)=>a.createdAt-b.createdAt
   );

   event=matched[0];

   for(let i=1;i<matched.length;i++){
    mergeGridEvents(event,matched[i]);
   }

   event.cells=new Set(cluster);
   event.lastActiveAt=time;

   for(const grid of cluster){
    event.level=Math.max(
     event.level,
     grid.level
    );

    event.peakIntensity=Math.max(
     event.peakIntensity,
     grid.intensity
    );
   }
  }
 }

 /*
  * イベントの有効期限を確認する。
  */
 gridEngine.events=gridEngine.events.filter(event=>{
  const expire=getExpireSeconds(event.level)*1000;

  return time-event.lastActiveAt<expire;
 });
}

/*
 * メインのグリッド検知処理。
 */
function processGridDetection(time){
 aggregateGridIntensity();

 for(const grid of gridEngine.grids.values()){
  updateGridHistory(grid);
 }

 const activeGrids=findActiveGrids();

 const clusters=createGridClusters(activeGrids);

 updateGridEvents(clusters,time);

 gridEngine.processedFrames++;

 updateShakeUI();
 updateShakeMap();
}

/*
 * 履歴をリセット。
 */
function resetGridHistories(){
 for(const grid of gridEngine.grids.values()){
  grid.history=[];
  grid.previousIntensity=null;
  grid.rise=0;
  grid.active=false;
 }

 gridEngine.events=[];
 gridEngine.lastFrameTime=null;

 updateShakeUI();
 updateShakeMap();
}

/*
 * フレーム時刻の飛びを検出する。
 */
function processShakeFrame(time){
 if(!gridEngine.grids.size)return;

 if(gridEngine.lastFrameTime!==null){
  const gap=Math.abs(
   time-gridEngine.lastFrameTime
  );

  if(
   gap>=GRID_PARAMS.HISTORY_RESET_GAP*1000
  ){
   console.warn(
    'グリッド履歴リセット: 時刻ジャンプ',
    gap
   );

   resetGridHistories();
  }
 }

 gridEngine.lastFrameTime=time;

 processGridDetection(time);
}

/* =========================================================
   検知UI
========================================================= */

function updateShakeUI(){
 const events=gridEngine.events
  .slice()
  .sort((a,b)=>b.createdAt-a.createdAt);

 setText(
  $('shakeCount'),
  String(events.length)
 );

 const state=$('shakeState');

 state.classList.toggle(
  'active',
  events.length>0
 );

 setText(
  $('shakeStateText'),
  events.length>0
   ?'地震検知中'
   :'現在検知なし'
 );

 const list=$('shakeList');

 while(list.firstChild){
  list.removeChild(list.firstChild);
 }

 for(const event of events.slice(0,5)){
  const item=document.createElement('div');
  item.className='shake-item';

  const name=document.createElement('span');
  name.className='shake-item-name';

  name.textContent=
   `グリッド ${event.cells.size}セル`;

  const level=document.createElement('span');
  level.className=
   'shake-level '+
   getShakeLevelClass(event.level);

  level.textContent=getShakeLevelName(
   event.level
  );

  item.appendChild(name);
  item.appendChild(level);

  list.appendChild(item);
 }
}

/* =========================================================
   グリッド検知マップ
========================================================= */

function updateShakeMap(){
 if(!map)return;

 const source=map.getSource('shake-grids');

 if(!source)return;

 const features=[];

 for(const event of gridEngine.events){
  for(const grid of event.cells){
   const bounds=getGridBounds(grid);

   features.push({
    type:'Feature',

    geometry:{
     type:'Polygon',
     coordinates:[[
      [bounds.west,bounds.south],
      [bounds.east,bounds.south],
      [bounds.east,bounds.north],
      [bounds.west,bounds.north],
      [bounds.west,bounds.south]
     ]]
    },

    properties:{
     level:event.level,
     eventId:event.id,
     gridKey:grid.key
    }
   });
  }
 }

 source.setData({
  type:'FeatureCollection',
  features
 });
}

/* =========================================================
   観測点準備
========================================================= */

function prepareStations(width,height){
 if(
  stations.length&&
  lastImageWidth===width&&
  lastImageHeight===height
 ){
  return;
 }

 lastImageWidth=width;
 lastImageHeight=height;

 stations=preparedPoints
  .filter(p=>
   p.x>=0&&
   p.y>=0&&
   p.x<width&&
   p.y<height
  )
  .map((p,i)=>({
   i,

   geom:{
    type:'Point',
    coordinates:[p.lon,p.lat]
   },

   name:p.name,
   region:p.region,
   code:p.code,

   x:p.x,
   y:p.y,

   lat:p.lat,
   lon:p.lon,

   r:0,
   g:0,
   b:0,

   hex:'#000000',

   position:null,
   intensity:null,
   valid:false
  }));

 setupGrids();

 forceUpdate=true;
}

/* =========================================================
   バイナリフレーム処理
========================================================= */

function applyFrame(buf){
 if(buf.byteLength<22)return;

 const dv=new DataView(buf);

 if(dv.getUint8(0)!==1)return;

 const ms=dv.getFloat64(1,true);

 if(
  lastAppliedImageMs!==null&&
  ms<=lastAppliedImageMs
 ){
  return;
 }

 const w=dv.getUint16(9,true);
 const h=dv.getUint16(11,true);
 const flags=dv.getUint8(13);
 const total=dv.getUint16(14,true);
 const count=dv.getUint16(16,true);
 const serverMs=dv.getUint16(18,true);
 const clients=dv.getUint16(20,true);

 if(buf.byteLength!==22+count*6){
  console.error(
   'フレーム長が不正です',
   buf.byteLength,
   count
  );

  return;
 }

 wsStats.clients=clients;

 prepareStations(w,h);

 if(stations.length!==total){
  console.error(
   '観測点数がサーバーと一致しません',
   total,
   stations.length
  );

  return;
 }

 setText($('imageSize'),`${w} × ${h}px`);

 let changed=forceUpdate;

 /*
  * フルフレームの場合は全観測点を無効化する。
  */
 if(flags&1){
  for(const st of stations){
   st.valid=false;
   st.position=null;
   st.intensity=null;
  }

  changed=true;
 }

 let o=22;

 for(let k=0;k<count;k++,o+=6){
  const i=dv.getUint16(o,true);
  const st=stations[i];

  if(!st)continue;

  changed=true;

  if(!dv.getUint8(o+2)){
   st.valid=false;
   st.position=null;
   st.intensity=null;

   continue;
  }

  const r=dv.getUint8(o+3);
  const g=dv.getUint8(o+4);
  const b=dv.getUint8(o+5);

  st.r=r;
  st.g=g;
  st.b=b;

  const position=colorToPosition(
   rgbToHSV(r,g,b)
  );

  if(position===null){
   st.valid=false;
   st.position=null;
   st.intensity=null;

   continue;
  }

  st.hex='#'+HEX[r]+HEX[g]+HEX[b];

  st.position=position;

  st.intensity=scaleToIntensity(position);

  st.valid=true;
 }

 /*
  * 差分フレームで更新されなかった観測点は、
  * 以前の有効値を維持してグリッドに集約する。
  */
 processShakeFrame(ms);

 let shown=0;

 for(const st of stations){
  if(st.valid)shown++;
 }

 setText(
  $('shown'),
  shown.toLocaleString()
 );

 if(changed&&map){
  const source=map.getSource('stations');

  if(source){
   const features=[];

   for(const st of stations){
    if(!st.valid)continue;

    features.push({
     type:'Feature',

     geometry:st.geom,

     properties:{
      i:st.i,
      hex:st.hex
     }
    });
   }

   source.setData({
    type:'FeatureCollection',
    features
   });

   forceUpdate=false;
  }
 }

 if(firstFit&&shown){
  firstFit=false;
  fitAll();
 }

 setText($('imgTime'),formatJST(ms));

 lastAppliedImageMs=ms;
}

/* =========================================================
   MapLibre
========================================================= */

function addSourceAndLayer(){
 if(!map.getSource('stations')){
  map.addSource('stations',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('station-points')){
  map.addLayer({
   id:'station-points',
   type:'circle',
   source:'stations',

   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,1.55,
     5,3.0,
     8,4.0,
     11,4.85
    ],

    'circle-color':['get','hex'],

    'circle-stroke-color':'#ffffff',
    'circle-stroke-width':0.25,

    'circle-opacity':1
   }
  });
 }

 /*
  * グリッド検知用GeoJSON
  */
 if(!map.getSource('shake-grids')){
  map.addSource('shake-grids',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 /*
  * 検知グリッド塗りつぶし
  */
 if(!map.getLayer('shake-grid-fill')){
  map.addLayer({
   id:'shake-grid-fill',
   type:'fill',
   source:'shake-grids',

   paint:{
    'fill-color':[
     'match',
     ['get','level'],
     0,'#94a3b8',
     1,'#3b82f6',
     2,'#eab308',
     3,'#f97316',
     4,'#dc2626',
     '#64748b'
    ],

    'fill-opacity':0.38
   }
  });
 }

 /*
  * グリッド境界線
  */
 if(!map.getLayer('shake-grid-outline')){
  map.addLayer({
   id:'shake-grid-outline',
   type:'line',
   source:'shake-grids',

   paint:{
    'line-color':[
     'match',
     ['get','level'],
     0,'#64748b',
     1,'#2563eb',
     2,'#ca8a04',
     3,'#ea580c',
     4,'#dc2626',
     '#475569'
    ],

    'line-width':1.2,
    'line-opacity':0.9
   }
  });
 }

 updateShakeMap();
}

function fitAll(){
 if(!map)return;

 const bounds=new maplibregl.LngLatBounds();

 let hasValidPoint=false;

 for(const st of stations){
  if(
   !st.geom||
   !Array.isArray(st.geom.coordinates)
  ){
   continue;
  }

  const [lon,lat]=st.geom.coordinates;

  if(
   !Number.isFinite(lon)||
   !Number.isFinite(lat)
  ){
   continue;
  }

  bounds.extend([lon,lat]);

  hasValidPoint=true;
 }

 const options={
  padding:MAP_PADDING,
  maxZoom:5.2,
  bearing:0,
  pitch:0,
  duration:700
 };

 if(hasValidPoint){
  map.fitBounds(bounds,options);
 }else{
  map.fitBounds(JAPAN_BOUNDS,options);
 }
}

$('resetMapButton').addEventListener('click',()=>{
 fitAll();
});

map=new maplibregl.Map({
 container:'map',

 style:'https://tiles.openfreemap.org/styles/positron',

 center:INITIAL_CENTER,
 zoom:INITIAL_ZOOM,
 bearing:0,
 pitch:0,

 attributionControl:{
  customAttribution:
   '<a href="https://www.kyoshin.bosai.go.jp/ja/about_kmoni/" target="_blank" rel="noopener noreferrer">防災科学技術研究所（NIED）</a>'
 }
});

map.on('error',e=>{
 console.error('MapLibre:',e.error||e);
});

   ページ状態管理
========================================================= */

 'visibilitychange',
 ()=>{
  if(document.hidden){
   clearTimeout(hiddenTimer);

   hiddenTimer=setTimeout(()=>{
    wsWanted=false;

    clearTimeout(wsReconnectTimer);

    if(ws){
     try{
      ws.close(1000,'hidden');
     }catch(_){}
    }
   },HIDDEN_DISCONNECT);

  }else{
   clearTimeout(hiddenTimer);

   wsWanted=true;

   connectStream();
  }
 }
);

window.addEventListener(
 'pageshow',
 ()=>{
  wsWanted=true;
  connectStream();
 }
);

map.on('load',()=>{
 addSourceAndLayer();

 fitAll();

 maintainClock();

 tickSyncTime();

 connectStream();
});
