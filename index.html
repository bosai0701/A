<script>
const WS_URL =
'wss://tags-clicks-repeated-painted.trycloudflare.com/';

const NTP_URL =
'https://api.wolfx.jp/ntp.json';

const POINTS_URL =
'https://raw.githubusercontent.com/ingen084/kyoshin-monitor-observation-points/refs/heads/master/intensity-points.json';

const TIME_SYNC_INTERVAL = 60000;
const TIME_SYNC_SAMPLES = 5;
const POINTS_TIMEOUT = 8000;
const RECONNECT_BASE = 1000;
const RECONNECT_MAX = 10000;
const PING_INTERVAL = 10000;
const HIDDEN_DISCONNECT = 60000;

const IMAGE_LAG_LIMIT = 3000;

const STATION_HOLD_TIME = 3000;
const STATION_CHECK_INTERVAL = 250;

const LAST_FRAME_CACHE_KEY = 'EQ_RTS_LAST_FRAME_V1';

const INITIAL_CENTER = [138,36.5];
const INITIAL_ZOOM = 4.2;

const JAPAN_BOUNDS = [
 [122.5,24],
 [146,46]
];

const MAP_PADDING = {
 top:90,
 right:35,
 bottom:70,
 left:35
};

/* ========== 揺れ検知パラメータ ========== */

const SD = {
 MaxSearchDistance:60.0,
 PeakWeightDistance:14.0,

 /* 有効近傍観測点が少ない場合の孤立判定 */
 IsolatedThreshold:1,
 IsolatedDetectionDiff:0.6,

 ScoreThresholdRatio:0.50,
 ScoreIntensityOffset:-0.8,
 MinDetectionDiff:0.2,
 NoChangePenaltyFactor:0.35,
 MaxNearPoints:50,

 /* イベント統合距離 */
 MergeDistance:[60,90,120,160,200],

 Seconds:[20,30,40,70,80],

 WeakerConfirmPointCount:3,
 WeakConfirmPointCount:3
};

const LV_WEAKER = 0;
const LV_WEAK = 1;

/* 震度履歴 */
const SHAKE_HISTORY_LEN = 10;
const SHAKE_GAP_RESET = 15000;
const SHAKE_MIN_VALID = 5;

const SHAKE_COLD_BASELINE = -0.5;

/* 揺れ終了基準 */
const SHAKE_END_INTENSITY = -1.5;

/* 終了判定の連続フレーム数 */
const SHAKE_END_PERSIST_FRAMES = 2;

/* 揺れの色分け基準 */
const SHAKE_YELLOW_INTENSITY = 0.5;
const SHAKE_RED_INTENSITY = 2.5;

const SHAKE_COLOR_WEAK = '#16a34a';
const SHAKE_COLOR_MEDIUM = '#eab308';
const SHAKE_COLOR_STRONG = '#dc2626';

/* 空間的な検知条件 */
const SHAKE_MIN_CONTRIB = 4;

/* 連続成立条件 */
const SHAKE_PERSIST_FRAMES = 3;

/* 確定に必要な観測点数 */
const SHAKE_MIN_CONFIRM_POINTS = 3;

/* 平常時震度 */
const SHAKE_BASE_KEY = 'EQ_RTS_SHAKE_BASE_V1';
const SHAKE_BASE_ALPHA = 0.01;
const SHAKE_BASE_MARGIN = 0.3;
const SHAKE_BASE_MAX = 0.5;

/* 自動ズーム */
const SHAKE_FOCUS_INTERVAL = 3000;
const SHAKE_USER_PAUSE = 15000;

/* 検知終了後の地図復帰時間 */
const SHAKE_RETURN_DELAY = 2000;

const SHAKE_FOCUS_MAX_ZOOM = 7.5;
const SHAKE_FOCUS_MARGIN_DEG = 0.25;

/* イベント円 */
const SHAKE_CIRCLE_PAD = 8;
const SHAKE_CIRCLE_MIN = 12;

let clockBaseEpoch = null;
let clockBasePerf = null;
let clockSynced = false;
let timeSyncPromise = null;
let lastAppliedImageMs = null;
let records = null;
let recordsPromise = null;
let preparedPoints = null;
let stations = [];
let forceUpdate = true;
let firstFit = true;
let map;
let lastImageWidth = 0;
let lastImageHeight = 0;
let lastImageCompletedPerf = null;

let lastFrameCacheRestored = false;

let shakeEvents = [];
let shakeEventSeq = 0;
let lastShakeMs = null;

const $ = id => document.getElementById(id);

const HEX = Array.from(
 {length:256},
 (_,i)=>i.toString(16).padStart(2,'0')
);

const p2 = n=>String(n).padStart(2,'0');

function setText(el,text){
 if(el._t===text)return;
 el._t=text;
 el.textContent=text;
}

function getSyncedNow(){
 if(!clockSynced){
  return Date.now();
 }

 return clockBaseEpoch+
  (performance.now()-clockBasePerf);
}

function updateImageTimeColor(){
 const el=$('imgTime');

 if(lastAppliedImageMs===null){
  el.classList.remove('image-stale');
  return;
 }

 const lag=getSyncedNow()-lastAppliedImageMs;

 el.classList.toggle(
  'image-stale',
  lag>IMAGE_LAG_LIMIT
 );
}

function saveLastFrameCache(){
 if(
  lastAppliedImageMs===null||
  !stations.length
 ){
  return;
 }

 try{
  const points=[];

  for(const st of stations){
   if(!st.valid)continue;

   points.push([
    st.i,
    st.r,
    st.g,
    st.b
   ]);
  }

  const cache={
   version:1,
   ms:lastAppliedImageMs,
   width:lastImageWidth,
   height:lastImageHeight,
   total:stations.length,
   points
  };

  localStorage.setItem(
   LAST_FRAME_CACHE_KEY,
   JSON.stringify(cache)
  );

 }catch(e){
  console.warn('最後の画像を保存できません:',e);
 }
}

function restoreLastFrameCache(){
 if(lastFrameCacheRestored)return false;

 if(
  !preparedPoints||
  !map||
  !map.getSource('stations')
 ){
  return false;
 }

 lastFrameCacheRestored=true;

 try{
  const raw=localStorage.getItem(
   LAST_FRAME_CACHE_KEY
  );

  if(!raw)return false;

  const cache=JSON.parse(raw);

  if(
   !cache||
   cache.version!==1||
   !Number.isFinite(cache.ms)||
   !Number.isFinite(cache.width)||
   !Number.isFinite(cache.height)||
   !Array.isArray(cache.points)
  ){
   return false;
  }

  prepareStations(
   cache.width,
   cache.height
  );

  if(stations.length!==cache.total){
   stations=[];
   lastImageWidth=0;
   lastImageHeight=0;

   console.warn(
    '保存画像と現在の観測点データが一致しません'
   );

   return false;
  }

  for(const st of stations){
   st.valid=false;
   st.shakeValid=false;
   st.position=null;
   st.invalidSince=null;
  }

  for(const row of cache.points){
   if(!Array.isArray(row)||row.length<4){
    continue;
   }

   const index=Number(row[0]);
   const st=stations[index];

   if(!st)continue;

   const r=Number(row[1]);
   const g=Number(row[2]);
   const b=Number(row[3]);

   if(
    !Number.isInteger(r)||
    !Number.isInteger(g)||
    !Number.isInteger(b)||
    r<0||r>255||
    g<0||g>255||
    b<0||b>255
   ){
    continue;
   }

   const position=colorToPosition(
    rgbToHSV(r,g,b)
   );

   if(position===null)continue;

   st.r=r;
   st.g=g;
   st.b=b;

   st.hex='#'+HEX[r]+HEX[g]+HEX[b];
   st.position=position;
   st.valid=true;

   /* キャッシュは検知用の新鮮なデータではない */
   st.shakeValid=false;

   st.invalidSince=null;
  }

  updateStationSource();

  lastAppliedImageMs=cache.ms;

  setText(
   $('imgTime'),
   formatJST(cache.ms)
  );

  setText(
   $('imageSize'),
   `${cache.width} × ${cache.height}px`
  );

  lastImageCompletedPerf=null;
  forceUpdate=false;

  updateImageTimeColor();

  console.log('最後の画像を復元しました',{
   imageTime:formatJST(cache.ms),
   shown:stations.filter(st=>st.valid).length,
   total:stations.length
  });

  return true;

 }catch(e){
  console.warn('最後の画像を復元できません:',e);
  return false;
 }
}

function jstParts(ms){
 const d=new Date(ms+9*3600e3);

 return {
  Y:d.getUTCFullYear(),
  M:p2(d.getUTCMonth()+1),
  D:p2(d.getUTCDate()),
  h:p2(d.getUTCHours()),
  m:p2(d.getUTCMinutes()),
  s:p2(d.getUTCSeconds())
 };
}

function formatJST(ms){
 const t=jstParts(ms);

 return `${t.Y}/${t.M}/${t.D} ${t.h}:${t.m}:${t.s}`;
}

async function fetchWolfxTime(){
 const start=performance.now();

 const controller=new AbortController();

 const timeout=setTimeout(
  ()=>controller.abort(),
  8000
 );

 try{
  const response=await fetch(
   NTP_URL+'?_='+Date.now(),
   {
    cache:'no-store',
    signal:controller.signal
   }
  );

  if(!response.ok){
   throw new Error('Wolfx HTTP '+response.status);
  }

  const data=await response.json();
  const end=performance.now();

  let epoch=Number(data.timestamp);

  if(!Number.isFinite(epoch)||epoch<1000000000000){
   const value=data.JST?.int;

   if(value){
    const s=String(value);

    if(/^\d{14}$/.test(s)){
     const iso=
      `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T`+
      `${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}+09:00`;

     epoch=Date.parse(iso);
    }
   }
  }

  if(!Number.isFinite(epoch)){
   throw new Error('Wolfx時刻を解析できません');
  }

  return {
   epoch,
   perf:(start+end)/2,
   rtt:end-start
  };

 }finally{
  clearTimeout(timeout);
 }
}

async function syncClock(){
 if(timeSyncPromise){
  return timeSyncPromise;
 }

 timeSyncPromise=(async()=>{
  const samples=[];

  for(let i=0;i<TIME_SYNC_SAMPLES;i++){
   try{
    samples.push(await fetchWolfxTime());
   }catch(e){
    console.warn('Wolfx同期失敗:',e);
   }
  }

  if(!samples.length){
   throw new Error('Wolfx時刻を取得できません');
  }

  samples.sort((a,b)=>a.rtt-b.rtt);

  const best=samples[0];

  clockBaseEpoch=best.epoch;
  clockBasePerf=best.perf;
  clockSynced=true;

  updateImageTimeColor();

  console.log('Wolfx時刻同期完了',{
   RTT:Math.round(best.rtt),
   samples:samples.length,
   serverTime:new Date(best.epoch).toISOString()
  });

  return best;

 })().finally(()=>{
  timeSyncPromise=null;
 });

 return timeSyncPromise;
}

async function maintainClock(){
 try{
  await syncClock();
 }catch(e){
  console.error('時刻再同期エラー:',e);
 }

 setTimeout(maintainClock,TIME_SYNC_INTERVAL);
}

function tickSyncTime(){
 const now=getSyncedNow();

 setText($('syncTime'),formatJST(now));

 updateImageTimeColor();

 setTimeout(
  tickSyncTime,
  1000-(now%1000)+15
 );
}

const wsStats={
 state:'未接続',
 connects:0,
 frames:0,
 errors:0,
 lastRecvPerf:null,
 clients:null
};

function updateWsInfo(){
 const el=$('wsInfo');

 const connected=
  ws&&ws.readyState===WebSocket.OPEN;

 el.classList.toggle('connected',!!connected);

 const label=el.querySelector('span:last-child');

 setText(
  label,
  connected?'WSS 接続中':'WSS 未接続'
 );
}

let ws=null;
let wsPing=null;
let wsReconnectTimer=null;
let wsAttempt=0;
let wsWanted=true;
let hiddenTimer=null;

function scheduleReconnect(){
 if(!wsWanted)return;

 clearTimeout(wsReconnectTimer);

 const delay=Math.min(
  RECONNECT_BASE*2**wsAttempt,
  RECONNECT_MAX
 );

 wsAttempt++;

 wsReconnectTimer=setTimeout(connectStream,delay);
}

function handleTextMessage(text){
 let msg=null;

 try{
  msg=JSON.parse(text);
 }catch(_){
  return;
 }

 if(msg&&msg.type==='error'){
  wsStats.errors++;
 }
}

function connectStream(){
 if(!wsWanted)return;

 if(
  ws&&
  (ws.readyState===WebSocket.OPEN||
   ws.readyState===WebSocket.CONNECTING)
 ){
  return;
 }

 updateWsInfo();

 const s=new WebSocket(WS_URL);

 s.binaryType='arraybuffer';

 ws=s;

 s.onopen=()=>{
  wsAttempt=0;
  wsStats.connects++;
  wsStats.state='接続中';

  updateWsInfo();

  clearInterval(wsPing);

  wsPing=setInterval(()=>{
   try{
    if(s.readyState===WebSocket.OPEN){
     s.send('ping');
    }
   }catch(_){}
  },PING_INTERVAL);

  loadPoints().catch(()=>{});
 };

 s.onmessage=ev=>{
  if(typeof ev.data==='string'){
   handleTextMessage(ev.data);
   return;
  }

  wsStats.frames++;

  wsStats.lastRecvPerf=performance.now();

  const buf=ev.data;

  loadPoints()
   .then(()=>{
    if(ws===s){
     applyFrame(buf);
    }
   })
   .catch(e=>{
    wsStats.errors++;

    try{
     s.close();
    }catch(_){}
   });
 };

 s.onerror=()=>{};

 s.onclose=()=>{
  if(ws===s){
   ws=null;
  }

  clearInterval(wsPing);

  wsStats.state='切断';

  updateWsInfo();

  scheduleReconnect();
 };
}

function rgbToHSV(r,g,b){
 r/=255;
 g/=255;
 b/=255;

 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);
 const delta=max-min;

 let h=0;

 const v=max;
 const s=max===0?0:delta/max;

 if(delta!==0){
  if(max===r){
   h=(g-b)/delta;

   if(g<b){
    h+=6;
   }

  }else if(max===g){
   h=(b-r)/delta+2;

  }else{
   h=(r-g)/delta+4;
  }

  h/=6;
 }

 return {h,s,v};
}

function colorToPosition(hsv){
 const h=hsv.h;
 const s=hsv.s;
 const v=hsv.v;

 if(!(v>0.1&&s>0.75)){
  return null;
 }

 let p=0;

 if(h>0.1476){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;
  const h5=h4*h;
  const h6=h5*h;

  p=
   280.31*h6
   -916.05*h5
   +1142.6*h4
   -709.95*h3
   +234.65*h2
   -40.27*h
   +3.2217;

 }else if(h>0.001){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;

  p=
   151.4*h4
   -49.32*h3
   +6.753*h2
   -2.481*h
   +0.9033;

 }else{
  p=
   -0.005171*v*v
   -0.3282*v
   +1.2236;
 }

 if(p<0){
  p=0;
 }

 if(!Number.isFinite(p)){
  return null;
 }

 return p;
}

function walkRecords(value,out=[]){
 if(Array.isArray(value)){
  for(const v of value){
   walkRecords(v,out);
  }

  return out;
 }

 if(value&&typeof value==='object'){
  if(
   value.location&&
   value.point&&
   value.point.center_point
  ){
   out.push(value);
  }

  for(const v of Object.values(value)){
   if(v&&typeof v==='object'){
    walkRecords(v,out);
   }
  }
 }

 return out;
}

function preparePoints(recs){
 const result=[];

 for(const item of recs){
  const loc=item.location||{};
  const point=item.point||{};
  const center=point.center_point||{};
  const offset=point.offset||{};

  const lat=Number(loc.latitude);
  const lon=Number(loc.longitude);

  const x=
   Number(center.x)+Number(offset.x||0);

  const y=
   Number(center.y)+Number(offset.y||0);

  if(
   !Number.isFinite(lat)||
   !Number.isFinite(lon)||
   !Number.isFinite(x)||
   !Number.isFinite(y)
  ){
   continue;
  }

  if(item.is_suspended===true)continue;

  result.push({
   lat,
   lon,
   x:Math.round(x),
   y:Math.round(y),

   name:
    item.name||
    item.point_name||
    item.station_name||
    item.code||
    '観測点',

   region:
    item.region||
    item.prefecture||
    '',

   code:item.code||''
  });
 }

 return result;
}

function loadPoints(){
 if(recordsPromise){
  return recordsPromise;
 }

 recordsPromise=(async()=>{
  const controller=new AbortController();

  const timeout=setTimeout(
   ()=>controller.abort(),
   POINTS_TIMEOUT
  );

  try{
   const response=await fetch(
    POINTS_URL,
    {
     cache:'force-cache',
     signal:controller.signal
    }
   );

   if(!response.ok){
    throw new Error('観測点JSON HTTP '+response.status);
   }

   const raw=await response.text();

   const data=JSON.parse(raw.replace(/^\uFEFF/,''));

   records=walkRecords(data);

   if(!records.length){
    throw new Error('観測点データが見つかりません');
   }

   preparedPoints=preparePoints(records);

   if(!preparedPoints.length){
    throw new Error('有効な観測点がありません');
   }

   setText(
    $('total'),
    records.length.toLocaleString()
   );

   console.log('観測点準備完了',{
    total:records.length,
    prepared:preparedPoints.length
   });

   restoreLastFrameCache();

   return preparedPoints;

  }finally{
   clearTimeout(timeout);
  }

 })().catch(e=>{
  recordsPromise=null;
  records=null;
  preparedPoints=null;
  throw e;
 });

 return recordsPromise;
}

/* ========================================================================
 * 揺れ検知エンジン
 * ====================================================================== */

const DEG2RAD=Math.PI/180;

function geoDistance(lat1,lon1,lat2,lon2){
 const dLat=(lat2-lat1)*DEG2RAD;
 const dLon=(lon2-lon1)*DEG2RAD;

 const a=
  Math.sin(dLat/2)**2+
  Math.cos(lat1*DEG2RAD)*
  Math.cos(lat2*DEG2RAD)*
  Math.sin(dLon/2)**2;

 return 6371*2*Math.asin(Math.min(1,Math.sqrt(a)));
}

/* 中央値 */
function median(values){
 if(!values.length)return 0;

 const sorted=values.slice().sort((a,b)=>a-b);
 const mid=Math.floor(sorted.length/2);

 return sorted.length%2
  ?sorted[mid]
  :(sorted[mid-1]+sorted[mid])/2;
}

/* 外れ値に強いばらつき評価 */
function calculateMAD(values,center){
 if(!values.length)return 0;

 const deviations=values.map(
  v=>Math.abs(v-center)
 );

 return median(deviations);
}

/* 観測点ごとの動的検知しきい値 */
function getPointThreshold(st){
 const noise=Number.isFinite(st.noise)
  ?st.noise
  :0;

 return Math.max(
  SD.MinDetectionDiff,
  0.25+noise*2.5
 );
}

/*
 * 距離重み。
 *
 * 近い観測点ほど大きな重みを与える。
 * PeakWeightDistanceを境に緩やかに減衰させる。
 * 距離0kmでも重みが0にならないようにする。
 */
function distanceWeight(d){
 if(d<0||d>=SD.MaxSearchDistance){
  return 0;
 }

 if(d<=SD.PeakWeightDistance){
  return 1-
   0.35*(d/SD.PeakWeightDistance);
 }

 const ratio=
  (d-SD.PeakWeightDistance)/
  (SD.MaxSearchDistance-SD.PeakWeightDistance);

 return 0.65*(1-ratio);
}

/* 震度相当値によるイベントレベル */
function getLevel(intensity){
 if(intensity===null||intensity===undefined)return LV_WEAKER;

 if(intensity>=SHAKE_RED_INTENSITY)return 3;
 if(intensity>=SHAKE_YELLOW_INTENSITY)return 2;
 if(intensity>=SHAKE_END_INTENSITY)return 1;

 return 0;
}

/* グリッドによる近傍観測点の設定 */
function buildNearPoints(list){
 for(const st of list){
  st.near=[];
 }

 if(!list.length)return;

 const maxD=SD.MaxSearchDistance;

 let maxAbsLat=0;

 for(const st of list){
  const a=Math.abs(st.lat);
  if(a>maxAbsLat)maxAbsLat=a;
 }

 const latCell=maxD/110.57;

 const lonCell=
  maxD/(111.32*Math.max(0.1,Math.cos(maxAbsLat*DEG2RAD)))*1.02;

 const KEY=4096;
 const grid=new Map();

 for(const st of list){
  st.cx=Math.floor((st.lon+180)/lonCell);
  st.cy=Math.floor((st.lat+90)/latCell);

  const key=st.cx*KEY+st.cy;

  let cell=grid.get(key);

  if(!cell){
   cell=[];
   grid.set(key,cell);
  }

  cell.push(st);
 }

 for(const st of list){
  const cands=[];

  for(let dx=-1;dx<=1;dx++){
   for(let dy=-1;dy<=1;dy++){
    const cell=grid.get((st.cx+dx)*KEY+(st.cy+dy));

    if(!cell)continue;

    for(const other of cell){
     if(other===st)continue;

     const d=geoDistance(
      st.lat,st.lon,
      other.lat,other.lon
     );

     if(d<maxD){
      cands.push({p:other,d});
     }
    }
   }
  }

  cands.sort((a,b)=>a.d-b.d);

  if(cands.length>SD.MaxNearPoints){
   cands.length=SD.MaxNearPoints;
  }

  st.near=cands.map(c=>({
   p:c.p,
   distance:c.d,
   weight:distanceWeight(c.d)
  }));
 }
}

/* 平常時震度の復元 */
function loadShakeBaselines(){
 try{
  const raw=localStorage.getItem(SHAKE_BASE_KEY);

  if(!raw)return;

  const c=JSON.parse(raw);

  if(
   !c||
   c.version!==1||
   c.total!==stations.length||
   !Array.isArray(c.base)
  ){
   return;
  }

  for(let i=0;i<stations.length;i++){
   const v=c.base[i];

   if(Number.isFinite(v)){
    stations[i].base=v;
   }
  }

 }catch(e){
  console.warn('平常時震度を復元できません:',e);
 }
}

function saveShakeBaselines(){
 if(!stations.length)return;

 try{
  localStorage.setItem(
   SHAKE_BASE_KEY,
   JSON.stringify({
    version:1,
    total:stations.length,
    base:stations.map(st=>
     st.base===null
      ?null
      :Math.round(st.base*100)/100
    )
   })
  );
 }catch(e){}
}

setInterval(saveShakeBaselines,30000);

/*
 * 観測点の履歴を更新
 *
 * 過去履歴の中央値を使い、
 * 一時的な外れ値に影響されにくくする。
 */
function updateShakePoint(st,intensity){

 if(
  intensity!==null&&
  st.event===null&&
  intensity<SHAKE_BASE_MAX
 ){
  if(st.base===null){
   st.base=Math.min(intensity,SHAKE_COLD_BASELINE);
  }else{
   st.base+=(intensity-st.base)*SHAKE_BASE_ALPHA;
  }
 }

 const previous=st.hist.filter(
  v=>v!==null&&Number.isFinite(v)
 );

 st.hist.push(intensity);

 if(st.hist.length>SHAKE_HISTORY_LEN){
  st.hist.shift();
 }

 st.latest=intensity;

 const validValues=st.hist.filter(
  v=>v!==null&&Number.isFinite(v)
 );

 const n=validValues.length;

 st.avg=n?median(validValues):0;

 if(intensity===null){
  st.diff=0;
  st.noise=0;
  st.threshold=SD.MinDetectionDiff;
  st.hasValidHistory=false;
  return;
 }

 /*
  * 履歴不足時は絶対値による初期判定。
  */
 if(n<SHAKE_MIN_VALID||previous.length<4){

  const baseline=
   st.base===null
    ?SHAKE_COLD_BASELINE
    :Math.min(
      st.base+SHAKE_BASE_MARGIN,
      SHAKE_BASE_MAX
     );

  st.diff=
   intensity>=SHAKE_END_INTENSITY
    ?Math.max(0,intensity-baseline)
    :0;

  st.noise=0;
  st.threshold=SD.MinDetectionDiff;
  st.hasValidHistory=true;

  return;
 }

 /*
  * 過去サンプルの中央値とMADを計算。
  */
 const previousMedian=median(previous);

 const mad=calculateMAD(
  previous,
  previousMedian
 );

 st.noise=mad;

 /*
  * 現在値と過去の中央値の差。
  */
 st.diff=intensity-previousMedian;

 /*
  * 観測点ごとのノイズ量に応じて
  * 検知しきい値を変更する。
  */
 st.threshold=getPointThreshold(st);

 st.hasValidHistory=true;
}

/* 揺れイベント */
class ShakeEvent{
 constructor(time,point,seconds){
  this.id=++shakeEventSeq;
  this.createdAt=time;
  this.points=new Set();
  this.isConfirmed=false;
  this.level=LV_WEAKER;

  this.addPoint(point,time,seconds);

  console.log(
   '揺れ検知 イベント発生:',
   this.id,
   point.code,
   point.latest
  );
 }

 get pointCount(){
  return this.points.size;
 }

 updateLevel(){
  let lv=LV_WEAKER;

  for(const p of this.points){
   const l=getLevel(p.latest);
   if(l>lv)lv=l;
  }

  this.level=lv;
 }

 addPoint(point,time,seconds){
  this.points.add(point);

  point.event=this;
  point.eventedExpireAt=time+seconds*1000;

  this.updateLevel();
 }

 removePoint(point){
  this.points.delete(point);
  this.updateLevel();
 }

 mergeEvent(other){
  if(other===this)return;

  for(const p of other.points){
   this.points.add(p);
   p.event=this;
  }

  other.points.clear();

  if(other.isConfirmed){
   this.isConfirmed=true;
  }

  this.updateLevel();
 }

 checkNearby(other,distance){
  if(!this.points.size||!other.points.size)return false;

  const a=this.bounds();
  const b=other.bounds();

  const padLat=distance/110.57;

  const maxAbsLat=Math.max(
   Math.abs(a.minLat),Math.abs(a.maxLat),
   Math.abs(b.minLat),Math.abs(b.maxLat)
  );

  const padLon=
   distance/(111.32*Math.max(0.1,Math.cos(maxAbsLat*DEG2RAD)));

  if(
   a.maxLat+padLat<b.minLat||
   b.maxLat+padLat<a.minLat||
   a.maxLon+padLon<b.minLon||
   b.maxLon+padLon<a.minLon
  ){
   return false;
  }

  for(const p of this.points){
   for(const q of other.points){
    if(
     geoDistance(p.lat,p.lon,q.lat,q.lon)<distance
    ){
     return true;
    }
   }
  }

  return false;
 }

 bounds(){
  let minLat=90,maxLat=-90,minLon=180,maxLon=-180;

  for(const p of this.points){
   if(p.lat<minLat)minLat=p.lat;
   if(p.lat>maxLat)maxLat=p.lat;
   if(p.lon<minLon)minLon=p.lon;
   if(p.lon>maxLon)maxLon=p.lon;
  }

  return {minLat,maxLat,minLon,maxLon};
 }
}

function removeShakeEvent(evt){
 const idx=shakeEvents.indexOf(evt);

 if(idx>=0){
  shakeEvents.splice(idx,1);
 }
}

/* イベント確定判定 */
function updateEventConfirmation(evt){
 if(evt.isConfirmed)return;

 const count=evt.pointCount;

 /*
  * 弱い揺れも強い揺れも、
  * 3観測点以上で確定可能にする。
  */
 if(count>=SHAKE_MIN_CONFIRM_POINTS){
  evt.isConfirmed=true;

  console.log(
   '揺れ検知 確定:',
   evt.id,
   '観測点数:',
   count
  );
 }
}

function resetShakeHistories(){
 for(const st of stations){
  st.hist=[];
  st.latest=null;
  st.avg=0;
  st.diff=0;
  st.noise=0;
  st.threshold=SD.MinDetectionDiff;
  st.hasValidHistory=false;
  st.event=null;
  st.eventedAt=0;
  st.eventedExpireAt=0;
  st.tmpDisabled=false;
  st.hits=0;
  st.lastHitMs=null;
  st.endHits=0;
 }

 shakeEvents=[];
}

/* 連続成立判定 */
function updateCandidatePersistence(point,time,prevTime){
 if(
  prevTime!==null&&
  point.lastHitMs===prevTime
 ){
  point.hits++;
 }else{
  point.hits=1;
 }

 point.lastHitMs=time;

 return point.hits>=SHAKE_PERSIST_FRAMES;
}

/* 揺れイベント処理 */
function processShakeEvents(time,prevTime){

 for(const point of stations){

  const latest=point.latest;
  const hasNear=point.near.length>0;

  /*
   * 異常値の排除
   */
  if(
   latest!==null&&
   point.diff<1&&
   point.event===null&&
   latest>=(hasNear?3:5)&&
   Math.abs(point.avg-latest)<=1&&
   (
    point.tmpDisabled||
    point.near.every(n=>
     (latest-(n.p.latest===null?-3:n.p.latest))>=3
    )
   )
  ){
   if(!point.tmpDisabled){
    console.log(
     '異常値の判定により観測点を除外:',
     point.code,
     latest,
     point.avg
    );
   }

   point.tmpDisabled=true;
   point.hits=0;
   point.lastHitMs=null;

  }else if(latest!==null&&point.tmpDisabled){

   console.log(
    '異常値による除外を戻します:',
    point.code,
    latest,
    point.avg
   );

   point.tmpDisabled=false;
  }

  /*
   * 揺れ終了判定。
   * 終了基準を2フレーム連続で下回った場合に終了。
   */
  if(point.event){

   if(
    latest!==null&&
    latest<SHAKE_END_INTENSITY
   ){
    point.endHits=(point.endHits||0)+1;

   }else{
    point.endHits=0;
   }

   if(point.endHits>=SHAKE_END_PERSIST_FRAMES){

    const evt=point.event;

    point.event=null;
    point.eventedAt=0;
    point.eventedExpireAt=0;

    point.hits=0;
    point.lastHitMs=null;
    point.endHits=0;

    evt.removePoint(point);

    if(evt.pointCount<=0){
     removeShakeEvent(evt);
    }
   }

  }else{
   point.endHits=0;
  }

  if(point.tmpDisabled)continue;

  /*
   * 上昇量が不足する場合は候補をリセット。
   */
  if(point.diff<point.threshold){

   point.hits=0;
   point.lastHitMs=null;

   const evt=point.event;

   if(
    evt&&
    (
     point.eventedAt>time||
     point.eventedExpireAt<time
    )
   ){
    point.event=null;
    evt.removePoint(point);

    if(evt.pointCount<=0){
     removeShakeEvent(evt);
    }
   }

   continue;
  }

  if(latest===null)continue;

  /*
   * 有効な近傍観測点数と重み合計を別々に計算。
   */
  let availableTotalWeight=0;
  let availableNearCount=0;

  for(const n of point.near){
   if(
    n.p.hasValidHistory&&
    !n.p.tmpDisabled
   ){
    availableTotalWeight+=n.weight;
    availableNearCount++;
   }
  }

  /*
   * 有効な近傍観測点が少ない地域では
   * 孤立・疎な観測点用の判定を使う。
   *
   * 重み合計が小さいだけで孤立扱いしない。
   */
  if(availableNearCount<SD.IsolatedThreshold){

   if(
    point.diff>=SD.IsolatedDetectionDiff&&
    point.event===null
   ){
    const persistent=updateCandidatePersistence(
     point,
     time,
     prevTime
    );

    if(persistent){
     const level=getLevel(latest);

     const evt=new ShakeEvent(
      time,
      point,
      SD.Seconds[level]
     );

     /*
      * 孤立観測点のイベントは、
      * 周辺イベントと統合されるまで未確定。
      */
     evt.isConfirmed=false;

     point.eventedAt=time;

     shakeEvents.push(evt);
    }

   }else if(point.event===null){
    point.hits=0;
    point.lastHitMs=null;
   }

   continue;
  }

  const events=[];

  if(point.event)events.push(point.event);

  /*
   * 距離・震度上昇量・ノイズ水準を利用したスコア。
   */
  let score=0;
  let penaltyScore=0;
  let contributingPointCount=0;

  for(const n of point.near){

   const np=n.p;

   if(
    np.tmpDisabled||
    !np.hasValidHistory
   ){
    continue;
   }

   const neighborThreshold=
    np.threshold||SD.MinDetectionDiff;

   if(np.diff>=neighborThreshold){

    score+=
     n.weight*
     (np.diff-SD.ScoreIntensityOffset);

    contributingPointCount++;

    if(np.event){
     events.push(np.event);
    }

   }else{

    penaltyScore+=
     n.weight*
     SD.NoChangePenaltyFactor;
   }
  }

  const finalScore=score-penaltyScore;

  const threshold=
   availableTotalWeight*
   SD.ScoreThresholdRatio;

  /*
   * 有効近傍観測点数に応じて必要な寄与数を調整。
   * 観測点が少ない地域で4点必須にならないようにする。
   */
  const requiredContrib=Math.min(
   SHAKE_MIN_CONTRIB,
   Math.max(
    1,
    Math.ceil(availableNearCount*0.25)
   )
  );

  if(contributingPointCount<requiredContrib){
   point.hits=0;
   point.lastHitMs=null;
   continue;
  }

  /*
   * 周辺の上昇量が弱い場合は除外。
   */
  if(finalScore<threshold){
   point.hits=0;
   point.lastHitMs=null;
   continue;
  }

  /*
   * 複数フレームで条件が連続成立する必要がある。
   */
  const persistent=updateCandidatePersistence(
   point,
   time,
   prevTime
  );

  if(!persistent)continue;

  /* この時点で検知扱い */
  point.eventedAt=time;

  const uniqueEvents=[...new Set(events)];

  const seconds=SD.Seconds[getLevel(latest)];

  /*
   * 複数イベントを統合。
   */
  if(uniqueEvents.length>1){

   uniqueEvents.sort(
    (a,b)=>a.createdAt-b.createdAt
   );

   const firstEvent=uniqueEvents[0];

   for(const evt of uniqueEvents){

    if(evt===firstEvent)continue;

    firstEvent.mergeEvent(evt);
    removeShakeEvent(evt);
   }

   if(point.event===firstEvent)continue;

   firstEvent.addPoint(
    point,
    time,
    seconds
   );

   updateEventConfirmation(firstEvent);

   continue;
  }

  /*
   * 既存イベントに追加。
   */
  if(uniqueEvents.length===1){

   uniqueEvents[0].addPoint(
    point,
    time,
    seconds
   );

   updateEventConfirmation(uniqueEvents[0]);

   continue;
  }

  /*
   * 新しいイベントを作成。
   */
  if(point.event===null){

   const evt=new ShakeEvent(
    time,
    point,
    seconds
   );

   shakeEvents.push(evt);

   updateEventConfirmation(evt);
  }
 }

 /*
  * イベントレベルを最新化。
  */
 for(const evt of shakeEvents){
  evt.updateLevel();
 }

 /*
  * イベントの距離統合。
  */
 for(const evt of [...shakeEvents].sort(
  (a,b)=>a.createdAt-b.createdAt
  )){

  if(!shakeEvents.includes(evt))continue;

  const others=shakeEvents.filter(e=>
   e!==evt&&evt.createdAt<=e.createdAt
  );

  for(const evt2 of others){

   const mergeDistance=
    SD.MergeDistance[
     Math.max(evt.level,evt2.level)
    ];

   if(!evt.checkNearby(evt2,mergeDistance)){
    continue;
   }

   evt.mergeEvent(evt2);
   removeShakeEvent(evt2);
  }

  updateEventConfirmation(evt);
 }
}

/* 円ポリゴン生成 */
function circlePolygon(lat,lon,radiusKm,props){
 const steps=48;
 const ring=[];

 const dLat=radiusKm/110.57;

 const dLon=
  radiusKm/(111.32*Math.max(0.1,Math.cos(lat*DEG2RAD)));

 for(let k=0;k<=steps;k++){
  const t=k/steps*Math.PI*2;

  ring.push([
   lon+dLon*Math.cos(t),
   lat+dLat*Math.sin(t)
  ]);
 }

 return {
  type:'Feature',
  geometry:{
   type:'Polygon',
   coordinates:[ring]
  },
  properties:props
 };
}

function shakeColor(intensity){
 if(intensity===null||intensity===undefined){
  return SHAKE_COLOR_WEAK;
 }

 if(intensity>=SHAKE_RED_INTENSITY){
  return SHAKE_COLOR_STRONG;
 }

 if(intensity>=SHAKE_YELLOW_INTENSITY){
  return SHAKE_COLOR_MEDIUM;
 }

 return SHAKE_COLOR_WEAK;
}

/* 検知結果を地図とパネルに反映 */
function renderShake(){
 const areas=[];
 const pts=[];

 let confirmed=0;
 let pending=0;

 const shownEvents=[];

 for(const evt of shakeEvents){

  if(evt.pointCount<=0){
   continue;
  }

  const c=evt.isConfirmed?1:0;

  if(evt.isConfirmed){
   confirmed++;
   shownEvents.push(evt);
  }else{
   pending++;
  }

  let sLat=0;
  let sLon=0;
  let n=0;

  let maxIntensity=-Infinity;

  for(const p of evt.points){

   sLat+=p.lat;
   sLon+=p.lon;
   n++;

   pts.push({
    type:'Feature',
    geometry:p.geom,
    properties:{
     c,
     l:evt.level,
     hex:shakeColor(p.latest)
    }
   });

   if(
    p.latest!==null&&
    p.latest>maxIntensity
   ){
    maxIntensity=p.latest;
   }
  }

  if(!n)continue;

  const cLat=sLat/n;
  const cLon=sLon/n;

  let r=0;

  for(const p of evt.points){
   const d=geoDistance(
    cLat,cLon,
    p.lat,p.lon
   );

   if(d>r)r=d;
  }

  r+=SHAKE_CIRCLE_PAD;

  if(r<SHAKE_CIRCLE_MIN){
   r=SHAKE_CIRCLE_MIN;
  }

  areas.push(circlePolygon(
   cLat,
   cLon,
   r,
   {
    c,
    l:evt.level,
    hex:shakeColor(
     maxIntensity===-Infinity?null:maxIntensity
    )
   }
  ));
 }

 if(map){

  const areaSrc=map.getSource('shake-areas');
  const ptSrc=map.getSource('shake-points');

  if(areaSrc){
   areaSrc.setData({
    type:'FeatureCollection',
    features:areas
   });
  }

  if(ptSrc){
   ptSrc.setData({
    type:'FeatureCollection',
    features:pts
   });
  }
 }

 updateShakeFocus(shownEvents);

 const el=$('shakeInfo');

 el.classList.toggle('confirmed',confirmed>0);
 el.classList.toggle(
  'pending',
  pending>0&&confirmed===0
 );

 const label=el.querySelector('span:last-child');

 if(!confirmed&&!pending){
  setText(label,'揺れ検知 なし');

 }else if(confirmed>0&&pending>0){
  setText(
   label,
   `揺れ検知 ${confirmed}件確定・${pending}件未確定`
  );

 }else if(confirmed>0){
  setText(
   label,
   `揺れ検知 ${confirmed}件（確定）`
  );

 }else{
  setText(
   label,
   `揺れ検知 ${pending}件（未確定）`
  );
 }
}

/* 揺れている範囲への自動ズーム */
let shakeFocusBounds=null;
let shakeFocusIds=new Set();
let shakeFocusPerf=-1e9;
let shakeFocused=false;
let shakeClearSince=null;
let userMovedPerf=-1e9;

function updateShakeFocus(evts){
 if(!map)return;

 const now=performance.now();

 if(!evts.length){

  shakeFocusIds=new Set();
  shakeFocusBounds=null;

  if(shakeFocused){

   if(shakeClearSince===null){
    shakeClearSince=now;

   }else if(now-shakeClearSince>=SHAKE_RETURN_DELAY){

    shakeFocused=false;
    shakeClearSince=null;

    if(now-userMovedPerf>=SHAKE_USER_PAUSE){
     fitAll();
    }
   }
  }

  return;
 }

 shakeClearSince=null;

 let minLat=90,maxLat=-90,minLon=180,maxLon=-180;
 let hasNew=false;

 const ids=new Set();

 for(const evt of evts){

  ids.add(evt.id);

  if(!shakeFocusIds.has(evt.id)){
   hasNew=true;
  }

  for(const p of evt.points){

   if(p.lat<minLat)minLat=p.lat;
   if(p.lat>maxLat)maxLat=p.lat;
   if(p.lon<minLon)minLon=p.lon;
   if(p.lon>maxLon)maxLon=p.lon;
  }
 }

 shakeFocusIds=ids;

 const b=shakeFocusBounds;

 const grew=
  !b||
  minLat<b.minLat-0.01||
  maxLat>b.maxLat+0.01||
  minLon<b.minLon-0.01||
  maxLon>b.maxLon+0.01;

 if(!hasNew&&!grew)return;

 if(
  !hasNew&&
  (
   now-userMovedPerf<SHAKE_USER_PAUSE||
   now-shakeFocusPerf<SHAKE_FOCUS_INTERVAL
  )
 ){
  return;
 }

 shakeFocusBounds={
  minLat,
  maxLat,
  minLon,
  maxLon
 };

 shakeFocusPerf=now;
 shakeFocused=true;

 const box=map.getContainer();
 const w=box.clientWidth;
 const h=box.clientHeight;

 const m=SHAKE_FOCUS_MARGIN_DEG;

 map.fitBounds(
  [
   [minLon-m,minLat-m],
   [maxLon+m,maxLat+m]
  ],
  {
   padding:{
    top:Math.min(170,h*0.35),
    bottom:Math.min(90,h*0.2),
    left:Math.min(50,w*0.1),
    right:Math.min(50,w*0.1)
   },
   maxZoom:SHAKE_FOCUS_MAX_ZOOM,
   bearing:0,
   pitch:0,
   duration:1200
  }
 );
}

/* 1フレーム分の検知処理 */
function detectShake(ms){
 if(!stations.length)return;

 if(
  lastShakeMs!==null&&
  (
   ms<lastShakeMs||
   ms-lastShakeMs>SHAKE_GAP_RESET
  )
 ){
  resetShakeHistories();
 }

 const prevMs=lastShakeMs;

 lastShakeMs=ms;

 for(const st of stations){

  /*
   * 表示保持中の古い観測値は検知に使用しない。
   */
  const live=
   st.shakeValid&&
   st.position!==null;

  updateShakePoint(
   st,
   live?st.position*10-3:null
  );
 }

 processShakeEvents(ms,prevMs);

 renderShake();
}

function prepareStations(width,height){
 if(
  stations.length&&
  lastImageWidth===width&&
  lastImageHeight===height
 ){
  return;
 }

 lastImageWidth=width;
 lastImageHeight=height;

 stations=preparedPoints
  .filter(p=>
   p.x>=0&&
   p.y>=0&&
   p.x<width&&
   p.y<height
  )
  .map((p,i)=>({
   i,

   geom:{
    type:'Point',
    coordinates:[p.lon,p.lat]
   },

   lat:p.lat,
   lon:p.lon,

   name:p.name,
   region:p.region,
   code:p.code,

   x:p.x,
   y:p.y,

   r:0,
   g:0,
   b:0,

   hex:'#000000',
   position:null,
   valid:false,

   /* 表示用の保持状態 */
   invalidSince:null,

   /* 検知用の有効状態 */
   shakeValid:false,

   /* 揺れ検知用 */
   hist:[],
   latest:null,
   avg:0,
   diff:0,
   noise:0,
   threshold:SD.MinDetectionDiff,
   hasValidHistory:false,

   near:[],
   base:null,

   hits:0,
   lastHitMs:null,
   endHits:0,

   cx:0,
   cy:0,

   event:null,
   eventedAt:0,
   eventedExpireAt:0,

   tmpDisabled:false
  }));

 buildNearPoints(stations);

 loadShakeBaselines();

 shakeEvents=[];
 lastShakeMs=null;

 forceUpdate=true;
}

/* 観測点のGeoJSONを更新 */
function updateStationSource(){
 if(!map)return;

 const source=map.getSource('stations');

 if(!source)return;

 const features=[];
 let shown=0;

 for(const st of stations){

  if(!st.valid)continue;

  shown++;

  features.push({
   type:'Feature',
   geometry:st.geom,
   properties:{
    i:st.i,
    hex:st.hex
   }
  });
 }

 source.setData({
  type:'FeatureCollection',
  features
 });

 setText(
  $('shown'),
  shown.toLocaleString()
 );
}

/* 3秒間の表示保持処理 */
function expireHeldStations(){
 if(!stations.length)return;

 const now=performance.now();

 let changed=false;

 for(const st of stations){

  if(
   !st.valid||
   st.invalidSince===null
  ){
   continue;
  }

  if(
   now-st.invalidSince>=STATION_HOLD_TIME
  ){
   st.valid=false;
   st.position=null;
   st.invalidSince=null;

   changed=true;
  }
 }

 if(changed){

  updateStationSource();

  saveLastFrameCache();

  console.log('未検出観測点を非表示にしました');
 }
}

setInterval(
 expireHeldStations,
 STATION_CHECK_INTERVAL
);

/* フレーム処理 */
function applyFrame(buf){
 if(buf.byteLength<22)return;

 const dv=new DataView(buf);

 if(dv.getUint8(0)!==1)return;

 const ms=dv.getFloat64(1,true);

 if(
  lastAppliedImageMs!==null&&
  ms<=lastAppliedImageMs
 ){
  return;
 }

 const w=dv.getUint16(9,true);
 const h=dv.getUint16(11,true);
 const flags=dv.getUint8(13);
 const total=dv.getUint16(14,true);
 const count=dv.getUint16(16,true);
 const serverMs=dv.getUint16(18,true);
 const clients=dv.getUint16(20,true);

 if(buf.byteLength!==22+count*6){
  console.error(
   'フレーム長が不正です',
   buf.byteLength,
   count
  );

  return;
 }

 wsStats.clients=clients;

 prepareStations(w,h);

 if(stations.length!==total){
  console.error(
   '観測点数がサーバーと一致しません',
   total,
   stations.length
  );

  return;
 }

 setText(
  $('imageSize'),
  `${w} × ${h}px`
 );

 let changed=forceUpdate;

 if(flags&1){
  changed=true;
 }

 let o=22;

 for(let k=0;k<count;k++,o+=6){

  const i=dv.getUint16(o,true);
  const st=stations[i];

  if(!st)continue;

  const valid=dv.getUint8(o+2);

  /*
   * 未検出の場合。
   * 表示は保持するが、揺れ検知では無効にする。
   */
  if(!valid){

   st.shakeValid=false;

   if(
    st.valid&&
    st.invalidSince===null
   ){
    st.invalidSince=performance.now();
   }

   continue;
  }

  const r=dv.getUint8(o+3);
  const g=dv.getUint8(o+4);
  const b=dv.getUint8(o+5);

  const position=colorToPosition(
   rgbToHSV(r,g,b)
  );

  if(position===null){

   st.shakeValid=false;

   if(
    st.valid&&
    st.invalidSince===null
   ){
    st.invalidSince=performance.now();
   }

   continue;
  }

  st.r=r;
  st.g=g;
  st.b=b;

  st.hex='#'+HEX[r]+HEX[g]+HEX[b];
  st.position=position;

  st.valid=true;
  st.shakeValid=true;

  st.invalidSince=null;

  changed=true;
 }

 expireHeldStations();

 if(changed&&map){
  updateStationSource();
  forceUpdate=false;
 }

 const shown=stations.filter(st=>st.valid).length;

 if(firstFit&&shown){
  firstFit=false;
  fitAll();
 }

 /*
  * 揺れ検知
  */
 try{
  detectShake(ms);
 }catch(e){
  console.error('揺れ検知エラー:',e);
 }

 setText(
  $('imgTime'),
  formatJST(ms)
 );

 lastAppliedImageMs=ms;

 lastImageCompletedPerf=performance.now();

 updateImageTimeColor();

 saveLastFrameCache();
}

function addSourceAndLayer(){
 if(!map.getSource('stations')){
  map.addSource('stations',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('station-points')){
  map.addLayer({
   id:'station-points',
   type:'circle',
   source:'stations',

   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,1.55,
     5,3.0,
     8,4.0,
     11,4.85
    ],

    'circle-color':['get','hex'],

    'circle-stroke-color':'#ffffff',
    'circle-stroke-width':0.25,

    'circle-opacity':1
   }
  });
 }

 if(!map.getSource('shake-areas')){
  map.addSource('shake-areas',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getSource('shake-points')){
  map.addSource('shake-points',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('shake-area-fill')){
  map.addLayer({
   id:'shake-area-fill',
   type:'fill',
   source:'shake-areas',
   paint:{
    'fill-color':['get','hex'],
    'fill-opacity':[
     'case',
     ['==',['get','c'],1],
     0.12,
     0.05
    ]
   }
  },'station-points');
 }

 if(!map.getLayer('shake-area-line-pending')){
  map.addLayer({
   id:'shake-area-line-pending',
   type:'line',
   source:'shake-areas',
   filter:['==',['get','c'],0],
   paint:{
    'line-color':['get','hex'],
    'line-width':1.6,
    'line-dasharray':[2,2]
   }
  },'station-points');
 }

 if(!map.getLayer('shake-area-line-confirmed')){
  map.addLayer({
   id:'shake-area-line-confirmed',
   type:'line',
   source:'shake-areas',
   filter:['==',['get','c'],1],
   paint:{
    'line-color':['get','hex'],
    'line-width':2.2
   }
  },'station-points');
 }

 if(!map.getLayer('shake-point-ring')){
  map.addLayer({
   id:'shake-point-ring',
   type:'circle',
   source:'shake-points',
   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,3.2,
     5,5.6,
     8,7.0,
     11,8.2
    ],
    'circle-color':'rgba(0,0,0,0)',
    'circle-stroke-color':['get','hex'],
    'circle-stroke-width':1.4,
    'circle-opacity':1
   }
  });
 }
}

function fitAll(){
 if(!map)return;

 const bounds=new maplibregl.LngLatBounds();

 let hasValidPoint=false;

 for(const st of stations){

  if(
   !st.geom||
   !Array.isArray(st.geom.coordinates)
  ){
   continue;
  }

  const [lon,lat]=st.geom.coordinates;

  if(
   !Number.isFinite(lon)||
   !Number.isFinite(lat)
  ){
   continue;
  }

  bounds.extend([lon,lat]);
  hasValidPoint=true;
 }

 const options={
  padding:MAP_PADDING,
  maxZoom:5.2,
  bearing:0,
  pitch:0,
  duration:700
 };

 if(hasValidPoint){
  map.fitBounds(bounds,options);
 }else{
  map.fitBounds(JAPAN_BOUNDS,options);
 }
}

$('resetMapButton').addEventListener('click',()=>{
 userMovedPerf=performance.now();
 fitAll();
});

map=new maplibregl.Map({
 container:'map',

 style:'https://tiles.openfreemap.org/styles/positron',

 center:INITIAL_CENTER,
 zoom:INITIAL_ZOOM,
 bearing:0,
 pitch:0,

 attributionControl:{
  customAttribution:
   '<a href="https://www.kyoshin.bosai.go.jp/ja/about_kmoni/" target="_blank" rel="noopener noreferrer">防災科学技術研究所（NIED）</a>'
 }
});

map.on('error',e=>{
 console.error('MapLibre:',e.error||e);
});

/* 手動操作を検知 */
for(const t of [
 'dragstart',
 'zoomstart',
 'rotatestart',
 'pitchstart'
]){
 map.on(t,e=>{
  if(e&&e.originalEvent){
   userMovedPerf=performance.now();
  }
 }
 );
}

    clearTimeout(wsReconnectTimer);

    if(ws){
     try{
      ws.close(1000,'hidden');
     }catch(_){}
    }
   },HIDDEN_DISCONNECT);

  }else{

   clearTimeout(hiddenTimer);

   wsWanted=true;

   connectStream();
  }
 }
);

  connectStream();
 }
);

});
