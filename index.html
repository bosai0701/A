<script>
const WS_URL =
'wss://tags-clicks-repeated-painted.trycloudflare.com/';

const NTP_URL =
'https://api.wolfx.jp/ntp.json';

const POINTS_URL =
'https://raw.githubusercontent.com/ingen084/kyoshin-monitor-observation-points/refs/heads/master/intensity-points.json';

const TIME_SYNC_INTERVAL=60000;
const TIME_SYNC_SAMPLES=5;
const POINTS_TIMEOUT=8000;
const RECONNECT_BASE=1000;
const RECONNECT_MAX=10000;
const PING_INTERVAL=10000;
const HIDDEN_DISCONNECT=60000;

const INITIAL_CENTER=[138,36.5];
const INITIAL_ZOOM=4.2;

const JAPAN_BOUNDS=[
 [122.5,24],
 [146,46]
];

const MAP_PADDING={
 top:90,
 right:35,
 bottom:70,
 left:35
};

/* 揺れ検知設定：元のC#初期値 */

const SHAKE={
 MAX_DISTANCE:60,
 PEAK_DISTANCE:14,
 MAX_NEAR_POINTS:50,

 MIN_DIFF:0.2,
 ISOLATED_THRESHOLD:1,
 ISOLATED_DIFF:1.4,

 SCORE_RATIO:0.333333,
 SCORE_OFFSET:-0.8,
 NO_CHANGE_PENALTY:0.25,

 WEAKER_CONFIRM:4,
 WEAK_CONFIRM:3,

 MERGE_DISTANCE:[90,130,180,250,250],

 EXPIRE_SECONDS:[20,30,40,70,80],

 GRID_SIZE:150
};

const SHAKE_COLORS=[
 '#16A34A',
 '#16A34A',
 '#EAB308',
 '#DC2626',
 '#DC2626'
];

let clockBaseEpoch=null;
let clockBasePerf=null;
let clockSynced=false;
let timeSyncPromise=null;

let lastAppliedImageMs=null;
let records=null;
let recordsPromise=null;
let preparedPoints=null;
let stations=[];

let forceUpdate=true;
let firstFit=true;
let map;

let lastImageWidth=0;
let lastImageHeight=0;

let ws=null;
let wsPing=null;
let wsReconnectTimer=null;
let wsAttempt=0;
let wsWanted=true;
let hiddenTimer=null;

const $=id=>document.getElementById(id);

const HEX=Array.from(
 {length:256},
 (_,i)=>i.toString(16).padStart(2,'0')
);

const p2=n=>String(n).padStart(2,'0');

function setText(el,text){
 if(el._t===text)return;
 el._t=text;
 el.textContent=text;
}

/* 時刻同期 */

function getSyncedNow(){
 if(!clockSynced)return Date.now();

 return clockBaseEpoch+
  (performance.now()-clockBasePerf);
}

function jstParts(ms){
 const d=new Date(ms+9*3600e3);

 return {
  Y:d.getUTCFullYear(),
  M:p2(d.getUTCMonth()+1),
  D:p2(d.getUTCDate()),
  h:p2(d.getUTCHours()),
  m:p2(d.getUTCMinutes()),
  s:p2(d.getUTCSeconds())
 };
}

function formatJST(ms){
 const t=jstParts(ms);

 return `${t.Y}/${t.M}/${t.D} ${t.h}:${t.m}:${t.s}`;
}

async function fetchWolfxTime(){
 const start=performance.now();
 const controller=new AbortController();

 const timeout=setTimeout(
  ()=>controller.abort(),
  8000
 );

 try{
  const response=await fetch(
   NTP_URL+'?_='+Date.now(),
   {
    cache:'no-store',
    signal:controller.signal
   }
  );

  if(!response.ok){
   throw new Error('Wolfx HTTP '+response.status);
  }

  const data=await response.json();
  const end=performance.now();

  let epoch=Number(data.timestamp);

  if(!Number.isFinite(epoch)||epoch<1000000000000){
   const value=data.JST?.int;

   if(value){
    const s=String(value);

    if(/^\d{14}$/.test(s)){
     const iso=
      `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T`+
      `${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}+09:00`;

     epoch=Date.parse(iso);
    }
   }
  }

  if(!Number.isFinite(epoch)){
   throw new Error('Wolfx時刻を解析できません');
  }

  return {
   epoch,
   perf:(start+end)/2,
   rtt:end-start
  };

 }finally{
  clearTimeout(timeout);
 }
}

async function syncClock(){
 if(timeSyncPromise)return timeSyncPromise;

 timeSyncPromise=(async()=>{
  const samples=[];

  for(let i=0;i<TIME_SYNC_SAMPLES;i++){
   try{
    samples.push(await fetchWolfxTime());
   }catch(e){
    console.warn('Wolfx同期失敗:',e);
   }
  }

  if(!samples.length){
   throw new Error('Wolfx時刻を取得できません');
  }

  samples.sort((a,b)=>a.rtt-b.rtt);

  const best=samples[0];

  clockBaseEpoch=best.epoch;
  clockBasePerf=best.perf;
  clockSynced=true;

  return best;

 })().finally(()=>{
  timeSyncPromise=null;
 });

 return timeSyncPromise;
}

async function maintainClock(){
 try{
  await syncClock();
 }catch(e){
  console.error('時刻再同期エラー:',e);
 }

 setTimeout(maintainClock,TIME_SYNC_INTERVAL);
}

function tickSyncTime(){
 const now=getSyncedNow();

 setText($('syncTime'),formatJST(now));

 setTimeout(
  tickSyncTime,
  1000-(now%1000)+15
 );
}

/* WSS */

const wsStats={
 state:'未接続',
 connects:0,
 frames:0,
 errors:0,
 lastRecvPerf:null,
 clients:null
};

function updateWsInfo(){
 const el=$('wsInfo');

 const connected=
  ws&&ws.readyState===WebSocket.OPEN;

 el.classList.toggle('connected',!!connected);

 setText(
  el.querySelector('span:last-child'),
  connected?'WSS 接続中':'WSS 未接続'
 );
}

function scheduleReconnect(){
 if(!wsWanted)return;

 clearTimeout(wsReconnectTimer);

 const delay=Math.min(
  RECONNECT_BASE*2**wsAttempt,
  RECONNECT_MAX
 );

 wsAttempt++;

 wsReconnectTimer=setTimeout(connectStream,delay);
}

function handleTextMessage(text){
 let msg=null;

 try{
  msg=JSON.parse(text);
 }catch(_){
  return;
 }

 if(msg&&msg.type==='error'){
  wsStats.errors++;
 }
}

function connectStream(){
 if(!wsWanted)return;

 if(
  ws&&
  (ws.readyState===WebSocket.OPEN||
   ws.readyState===WebSocket.CONNECTING)
 ){
  return;
 }

 updateWsInfo();

 const s=new WebSocket(WS_URL);
 s.binaryType='arraybuffer';
 ws=s;

 s.onopen=()=>{
  wsAttempt=0;
  wsStats.connects++;
  wsStats.state='接続中';

  updateWsInfo();

  clearInterval(wsPing);

  wsPing=setInterval(()=>{
   try{
    if(s.readyState===WebSocket.OPEN){
     s.send('ping');
    }
   }catch(_){}
  },PING_INTERVAL);

  loadPoints().catch(()=>{});
 };

 s.onmessage=ev=>{
  if(typeof ev.data==='string'){
   handleTextMessage(ev.data);
   return;
  }

  wsStats.frames++;
  wsStats.lastRecvPerf=performance.now();

  loadPoints()
   .then(()=>{
    if(ws===s){
     applyFrame(ev.data);
    }
   })
   .catch(e=>{
    wsStats.errors++;

    console.error('フレーム処理エラー:',e);

    try{s.close();}catch(_){}
   });
 };

 s.onerror=()=>{};

 s.onclose=()=>{
  if(ws===s)ws=null;

  clearInterval(wsPing);

  wsStats.state='切断';
  updateWsInfo();

  scheduleReconnect();
 };
}

/* 画像色解析 */

function rgbToHSV(r,g,b){
 r/=255;
 g/=255;
 b/=255;

 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);
 const delta=max-min;

 let h=0;

 const v=max;
 const s=max===0?0:delta/max;

 if(delta!==0){
  if(max===r){
   h=(g-b)/delta;
   if(g<b)h+=6;
  }else if(max===g){
   h=(b-r)/delta+2;
  }else{
   h=(r-g)/delta+4;
  }

  h/=6;
 }

 return {h,s,v};
}

function colorToPosition(hsv){
 const h=hsv.h;
 const s=hsv.s;
 const v=hsv.v;

 if(!(v>0.1&&s>0.75)){
  return null;
 }

 let p=0;

 if(h>0.1476){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;
  const h5=h4*h;
  const h6=h5*h;

  p=
   280.31*h6
   -916.05*h5
   +1142.6*h4
   -709.95*h3
   +234.65*h2
   -40.27*h
   +3.2217;

 }else if(h>0.001){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;

  p=
   151.4*h4
   -49.32*h3
   +6.753*h2
   -2.481*h
   +0.9033;

 }else{
  p=
   -0.005171*v*v
   -0.3282*v
   +1.2236;
 }

 if(p<0)p=0;

 if(!Number.isFinite(p))return null;

 return p;
}

/* 観測点データ */

function walkRecords(value,out=[]){
 if(Array.isArray(value)){
  for(const v of value)walkRecords(v,out);
  return out;
 }

 if(value&&typeof value==='object'){
  if(
   value.location&&
   value.point&&
   value.point.center_point
  ){
   out.push(value);
  }

  for(const v of Object.values(value)){
   if(v&&typeof v==='object'){
    walkRecords(v,out);
   }
  }
 }

 return out;
}

function preparePoints(recs){
 const result=[];

 for(const item of recs){
  const loc=item.location||{};
  const point=item.point||{};
  const center=point.center_point||{};
  const offset=point.offset||{};

  const lat=Number(loc.latitude);
  const lon=Number(loc.longitude);

  const x=
   Number(center.x)+Number(offset.x||0);

  const y=
   Number(center.y)+Number(offset.y||0);

  if(
   !Number.isFinite(lat)||
   !Number.isFinite(lon)||
   !Number.isFinite(x)||
   !Number.isFinite(y)
  )continue;

  if(item.is_suspended===true)continue;

  result.push({
   lat,lon,
   x:Math.round(x),
   y:Math.round(y),

   name:
    item.name||
    item.point_name||
    item.station_name||
    item.code||
    '観測点',

   region:
    item.region||
    item.prefecture||
    '',

   code:item.code||''
  });
 }

 return result;
}

function loadPoints(){
 if(recordsPromise)return recordsPromise;

 recordsPromise=(async()=>{
  const controller=new AbortController();

  const timeout=setTimeout(
   ()=>controller.abort(),
   POINTS_TIMEOUT
  );

  try{
   const response=await fetch(
    POINTS_URL,
    {
     cache:'force-cache',
     signal:controller.signal
    }
   );

   if(!response.ok){
    throw new Error('観測点JSON HTTP '+response.status);
   }

   const raw=await response.text();

   const data=JSON.parse(raw.replace(/^\uFEFF/,''));

   records=walkRecords(data);

   if(!records.length){
    throw new Error('観測点データが見つかりません');
   }

   preparedPoints=preparePoints(records);

   if(!preparedPoints.length){
    throw new Error('有効な観測点がありません');
   }

   setText(
    $('total'),
    records.length.toLocaleString()
   );

   console.log('観測点準備完了',{
    total:records.length,
    prepared:preparedPoints.length
   });

   return preparedPoints;

  }finally{
   clearTimeout(timeout);
  }

 })().catch(e=>{
  recordsPromise=null;
  records=null;
  preparedPoints=null;
  throw e;
 });

 return recordsPromise;
}

/* 観測点の初期化 */

function prepareStations(width,height){
 if(
  stations.length&&
  lastImageWidth===width&&
  lastImageHeight===height
 ){
  return;
 }

 lastImageWidth=width;
 lastImageHeight=height;

 stations=preparedPoints
  .filter(p=>
   p.x>=0&&
   p.y>=0&&
   p.x<width&&
   p.y<height
  )
  .map((p,i)=>({
   i,

   geom:{
    type:'Point',
    coordinates:[p.lon,p.lat]
   },

   name:p.name,
   region:p.region,
   code:p.code,

   x:p.x,
   y:p.y,

   r:0,
   g:0,
   b:0,

   hex:'#000000',
   position:null,
   valid:false,

   /* 揺れ検知用 */
   history:new Array(10).fill(null),
   historyPosition:0,

   intensityDiff:0,
   intensityAverage:0,

   hasValidHistory:false,
   tmpDisabled:false,

   event:null,
   eventedAt:0,
   eventedExpireAt:0,

   nearPoints:null
  }));

 initializeShakeDetection();

 forceUpdate=true;
}

/* =========================================
   揺れ検知エンジン
   ShakeDetectionEngine.cs のブラウザ移植
========================================= */

let shakeEvents=[];
let shakeGridOrigin=null;
let shakeInitialized=false;

function haversine(a,b){
 const R=6371;

 const rad=Math.PI/180;

 const dLat=(b.lat-a.lat)*rad;
 const dLon=(b.lon-a.lon)*rad;

 const lat1=a.lat*rad;
 const lat2=b.lat*rad;

 const x=
  Math.sin(dLat/2)**2+
  Math.cos(lat1)*Math.cos(lat2)*
  Math.sin(dLon/2)**2;

 return 2*R*Math.asin(Math.sqrt(x));
}

function calculateDistanceWeight(distance){
 if(distance<=SHAKE.PEAK_DISTANCE){
  return distance/SHAKE.PEAK_DISTANCE;
 }

 return (
  SHAKE.MAX_DISTANCE-distance
 )/(
  SHAKE.MAX_DISTANCE-SHAKE.PEAK_DISTANCE
 );
}

function initializeShakeDetection(){
 if(shakeInitialized)return;

 if(!stations.length)return;

 console.log('揺れ検知：近傍観測点計算開始');

 for(const point of stations){
  const near=[];

  for(const other of stations){
   if(point===other)continue;

   const distance=haversine(point,other);

   if(distance>=SHAKE.MAX_DISTANCE)continue;

   near.push({
    point:other,
    distance,
    weight:calculateDistanceWeight(distance)
   });
  }

  near.sort((a,b)=>a.distance-b.distance);

  point.nearPoints=near.slice(
   0,
   SHAKE.MAX_NEAR_POINTS
  );
 }

 shakeInitialized=true;

 console.log('揺れ検知：初期化完了',{
  stations:stations.length
 });
}

/* 震度履歴 */

function updateIntensityHistory(point,intensity){
 const h=point.history;

 point.historyPosition=
  (point.historyPosition+1)%10;

 h[point.historyPosition]=intensity;

 let before=null;
 let diff=0;
 let total=0;

 for(let i=point.historyPosition;i>=0;i--){
  if(h[i]!==null){
   if(before!==null){
    diff+=before-h[i];
   }

   before=h[i];
   total+=h[i];
  }
 }

 for(let i=9;i>point.historyPosition;i--){
  if(h[i]!==null){
   if(before!==null){
    diff+=before-h[i];
   }

   before=h[i];
   total+=h[i];
  }
 }

 point.intensityDiff=diff;
 point.intensityAverage=total/10;

 if(intensity!==null){
  point.hasValidHistory=true;
 }
}

/* イベントレベル */

function getShakeLevel(intensity){
 if(intensity>4.5)return 4;
 if(intensity>2.5)return 3;
 if(intensity>0.5)return 2;
 if(intensity>-1)return 1;

 return 0;
}

function getExpireSeconds(level){
 return SHAKE.EXPIRE_SECONDS[level]||20;
}

function getMergeDistance(level){
 return SHAKE.MERGE_DISTANCE[level]||90;
}

/* イベント管理 */

let shakeEventSequence=0;

function createShakeEvent(point,time){
 const level=getShakeLevel(point.position);

 const evt={
  id:++shakeEventSequence,

  createdAt:time,
  level,

  points:[],
  confirmed:false
 };

 evt.points.push(point);

 point.event=evt;
 point.eventedAt=time;

 point.eventedExpireAt=
  time+getExpireSeconds(level)*1000;

 shakeEvents.push(evt);

 updateEventConfirmation(evt);

 return evt;
}

function updateEventConfirmation(evt){
 if(evt.confirmed)return;

 if(
  (evt.level<=0&&evt.points.length>SHAKE.WEAKER_CONFIRM)||
  (evt.level===1&&evt.points.length>SHAKE.WEAK_CONFIRM)||
  evt.level>1
 ){
  evt.confirmed=true;
 }
}

function addEventPoint(evt,point,time){
 const level=getShakeLevel(point.position);

 if(
  evt.level<level&&
  evt.points.some(p=>getShakeLevel(p.position)>=level)
 ){
  evt.level=level;
 }

 if(!evt.points.includes(point)){
  evt.points.push(point);
 }

 point.event=evt;
 point.eventedAt=time;

 const expire=
  time+getExpireSeconds(level)*1000;

 if(point.eventedExpireAt<expire){
  point.eventedExpireAt=expire;
 }

 updateEventConfirmation(evt);
}

function removeEventPoint(point){
 const evt=point.event;

 if(!evt)return;

 point.event=null;
 point.eventedExpireAt=0;

 const index=evt.points.indexOf(point);

 if(index!==-1){
  evt.points.splice(index,1);
 }

 if(evt.points.length===0){
  const i=shakeEvents.indexOf(evt);

  if(i!==-1){
   shakeEvents.splice(i,1);
  }
 }
}

function mergeEvents(target,source){
 for(const point of source.points){
  if(!target.points.includes(point)){
   target.points.push(point);
  }

  point.event=target;
 }

 if(source.level>target.level){
  target.level=source.level;
 }

 const i=shakeEvents.indexOf(source);

 if(i!==-1){
  shakeEvents.splice(i,1);
 }
}

function checkNearbyEvents(a,b,distance){
 for(const p1 of a.points){
  for(const p2 of b.points){
   if(haversine(p1,p2)<=distance){
    return true;
   }
  }
 }

 return false;
}

/* 異常値の除外 */

function checkAbnormalPoint(point){
 const latest=point.position;

 if(latest===null)return;

 const near=point.nearPoints;

 const condition=
  point.intensityDiff<1&&
  point.event===null&&
  latest>=(near&&near.length?3:5)&&
  Math.abs(
   point.intensityAverage-latest
  )<=1&&
  (
   point.tmpDisabled||
   (
    near?.every(np=>
     latest-(np.point.position??-3)>=3
    )??true
   )
  );

 if(condition){
  point.tmpDisabled=true;
 }else if(point.tmpDisabled){
  point.tmpDisabled=false;
 }
}

/* 検知スコア */

function calculateDetection(point,time){
 const latest=point.position;

 if(latest===null)return;

 const near=point.nearPoints;

 if(!near)return;

 checkAbnormalPoint(point);

 if(point.tmpDisabled)return;

 if(point.intensityDiff<SHAKE.MIN_DIFF){

  if(
   point.event&&
   (
    point.eventedAt>time||
    point.eventedExpireAt<time
   )
  ){
   removeEventPoint(point);
  }

  return;
 }

 const available=near
  .filter(np=>np.point.hasValidHistory)
  .reduce((sum,np)=>sum+np.weight,0);

 /* 離島判定 */

 if(available<SHAKE.ISOLATED_THRESHOLD){

  if(
   point.intensityDiff>=SHAKE.ISOLATED_DIFF&&
   point.event===null
  ){
   createShakeEvent(point,time);
  }

  return;
 }

 let score=0;
 let penalty=0;
 let contributing=0;

 const events=[];

 if(point.event){
  events.push(point.event);
 }

 for(const np of near){
  const p=np.point;

  if(
   p.tmpDisabled||
   !p.hasValidHistory
  ){
   continue;
  }

  if(p.intensityDiff>=SHAKE.MIN_DIFF){

   score+=np.weight*(
    p.intensityDiff-SHAKE.SCORE_OFFSET
   );

   contributing++;

   if(p.event){
    events.push(p.event);
   }

  }else{

   penalty+=np.weight*
    SHAKE.NO_CHANGE_PENALTY;
  }
 }

 const finalScore=score-penalty;
 const threshold=available*SHAKE.SCORE_RATIO;

 if(contributing<=1)return;

 if(finalScore<threshold)return;

 point.eventedAt=time;

 const unique=[...new Set(events)];

 /* 複数イベントを統合 */

 if(unique.length>1){

  unique.sort((a,b)=>a.createdAt-b.createdAt);

  const first=unique[0];

  for(const evt of unique){
   if(evt===first)continue;

   mergeEvents(first,evt);
  }

  if(point.event!==first){
   addEventPoint(
    first,
    point,
    time
   );
  }

  return;
 }

 /* 既存イベントに追加 */

 if(unique.length===1){

  addEventPoint(
   unique[0],
   point,
   time
  );

  return;
 }

 /* 新規イベント */

 if(point.event===null){
  createShakeEvent(point,time);
 }
}

/* イベント全体の処理 */

function processShakeEvents(time){
 if(!shakeInitialized)return;

 for(const point of stations){
  calculateDetection(point,time);
 }

 /* イベント同士の距離による統合 */

 for(const evt of [...shakeEvents].sort(
  (a,b)=>a.createdAt-b.createdAt
 )){
  if(!shakeEvents.includes(evt))continue;

  for(const other of [...shakeEvents]){
   if(
    other===evt||
    !shakeEvents.includes(other)||
    evt.createdAt>other.createdAt
   ){
    continue;
   }

   const level=Math.max(evt.level,other.level);
   const distance=getMergeDistance(level);

   if(checkNearbyEvents(evt,other,distance)){
    mergeEvents(evt,other);
   }
  }
 }
}

/* 画像1フレームごとの履歴更新 */

function updateShakeFrame(time){
 if(!shakeInitialized)return;

 /*
  元のC#は画像1枚ごとに
  全観測点の履歴を更新する。

  差分データで変化していない観測点も
  現在の値を履歴に追加する。
 */

 for(const point of stations){
  updateIntensityHistory(
   point,
   point.valid?point.position:null
  );
 }

 processShakeEvents(time);

 drawShakeGrid();
}

/* =========================================
   正方形グリッド表示
   ShakeDetectionAreaLayer.cs のGrid方式
========================================= */

const shakeCanvas=$('shakeCanvas');
const shakeCtx=shakeCanvas.getContext('2d',{
 alpha:true
});

let canvasWidth=0;
let canvasHeight=0;

function resizeShakeCanvas(){
 const rect=map.getContainer().getBoundingClientRect();
 const dpr=Math.min(window.devicePixelRatio||1,2);

 const width=Math.round(rect.width*dpr);
 const height=Math.round(rect.height*dpr);

 if(
  shakeCanvas.width===width&&
  shakeCanvas.height===height
 ){
  return;
 }

 shakeCanvas.width=width;
 shakeCanvas.height=height;

 shakeCanvas.style.width=rect.width+'px';
 shakeCanvas.style.height=rect.height+'px';

 canvasWidth=rect.width;
 canvasHeight=rect.height;

 drawShakeGrid();
}

function drawShakeGrid(){
 if(!map||!map.loaded())return;

 if(!shakeCtx)return;

 const rect=map.getContainer().getBoundingClientRect();

 const dpr=Math.min(window.devicePixelRatio||1,2);

 const width=rect.width;
 const height=rect.height;

 if(
  shakeCanvas.width!==Math.round(width*dpr)||
  shakeCanvas.height!==Math.round(height*dpr)
 ){
  shakeCanvas.width=Math.round(width*dpr);
  shakeCanvas.height=Math.round(height*dpr);
 }

 shakeCtx.setTransform(
  dpr,0,0,dpr,0,0
 );

 shakeCtx.clearRect(0,0,width,height);

 const confirmedPoints=[];

 for(const evt of shakeEvents){
  if(!evt.confirmed)continue;

  for(const point of evt.points){
   if(
    point.position===null||
    !point.valid
   )continue;

   confirmedPoints.push(point);
  }
 }

 if(!confirmedPoints.length){
  shakeGridOrigin=null;
  return;
 }

 /*
  最初の確定観測点をグリッド原点にする。
  イベントが継続している間は原点を維持する。
 */

 if(!shakeGridOrigin){
  shakeGridOrigin=confirmedPoints[0].geom.coordinates;
 }

 const origin=map.project(shakeGridOrigin);

 const gridCells=new Map();

 for(const point of confirmedPoints){
  const pixel=map.project(
   point.geom.coordinates
  );

  const relX=pixel.x-origin.x;
  const relY=pixel.y-origin.y;

  const cellX=Math.floor(
   (relX+SHAKE.GRID_SIZE/2)/
   SHAKE.GRID_SIZE
  );

  const cellY=Math.floor(
   (relY+SHAKE.GRID_SIZE/2)/
   SHAKE.GRID_SIZE
  );

  const key=cellX+','+cellY;

  const level=getShakeLevel(point.position);

  const current=gridCells.get(key);

  if(!current||point.position>current.intensity){
   gridCells.set(key,{
    cellX,
    cellY,
    level,
    intensity:point.position
   });
  }
 }

 /*
  低いレベルから描画し、
  強いレベルを上に表示する。
 */

 const cells=[...gridCells.values()].sort(
  (a,b)=>a.level-b.level
 );

 for(const cell of cells){
  const x=
   origin.x+
   (cell.cellX-0.5)*SHAKE.GRID_SIZE;

  const y=
   origin.y+
   (cell.cellY-0.5)*SHAKE.GRID_SIZE;

  const color=SHAKE_COLORS[cell.level];

  shakeCtx.save();

  shakeCtx.strokeStyle=color;
  shakeCtx.globalAlpha=0.82;
  shakeCtx.lineWidth=1.6;

  shakeCtx.strokeRect(
   x,
   y,
   SHAKE.GRID_SIZE,
   SHAKE.GRID_SIZE
  );

  shakeCtx.restore();
 }
}

/* 地図移動時も枠を再描画 */

function setupShakeCanvas(){
 map.on('move',drawShakeGrid);
 map.on('zoom',drawShakeGrid);
 map.on('rotate',drawShakeGrid);
 map.on('resize',resizeShakeCanvas);
 map.on('moveend',drawShakeGrid);
 map.on('zoomend',drawShakeGrid);

 resizeShakeCanvas();
}

/* =========================================
   WebSocket画像フレーム処理
========================================= */

function applyFrame(buf){
 if(buf.byteLength<22)return;

 const dv=new DataView(buf);

 if(dv.getUint8(0)!==1)return;

 const ms=dv.getFloat64(1,true);

 if(
  lastAppliedImageMs!==null&&
  ms<=lastAppliedImageMs
 ){
  return;
 }

 const w=dv.getUint16(9,true);
 const h=dv.getUint16(11,true);
 const flags=dv.getUint8(13);
 const total=dv.getUint16(14,true);
 const count=dv.getUint16(16,true);
 const serverMs=dv.getUint16(18,true);
 const clients=dv.getUint16(20,true);

 if(buf.byteLength!==22+count*6){
  console.error(
   'フレーム長が不正です',
   buf.byteLength,
   count
  );
  return;
 }

 wsStats.clients=clients;

 prepareStations(w,h);

 if(stations.length!==total){
  console.error(
   '観測点数がサーバーと一致しません',
   total,
   stations.length
  );
  return;
 }

 setText($('imageSize'),`${w} × ${h}px`);

 let changed=forceUpdate;

 if(flags&1){
  for(const st of stations){
   st.valid=false;
   st.position=null;
  }

  changed=true;
 }

 let o=22;

 for(let k=0;k<count;k++,o+=6){
  const i=dv.getUint16(o,true);
  const st=stations[i];

  if(!st)continue;

  changed=true;

  if(!dv.getUint8(o+2)){
   st.valid=false;
   st.position=null;
   continue;
  }

  const r=dv.getUint8(o+3);
  const g=dv.getUint8(o+4);
  const b=dv.getUint8(o+5);

  st.r=r;
  st.g=g;
  st.b=b;

  const position=colorToPosition(
   rgbToHSV(r,g,b)
  );

  if(position===null){
   st.valid=false;
   st.position=null;
   continue;
  }

  st.hex='#'+HEX[r]+HEX[g]+HEX[b];
  st.position=position;
  st.valid=true;
 }

 let shown=0;

 for(const st of stations){
  if(st.valid)shown++;
 }

 setText(
  $('shown'),
  shown.toLocaleString()
 );

 /* 地図上の観測点 */

 if(changed&&map){
  const source=map.getSource('stations');

  if(source){
   const features=[];

   for(const st of stations){
    if(!st.valid)continue;

    features.push({
     type:'Feature',
     geometry:st.geom,
     properties:{
      i:st.i,
      hex:st.hex
     }
    });
   }

   source.setData({
    type:'FeatureCollection',
    features
   });

   forceUpdate=false;
  }
 }

 /* 揺れ検知 */
 updateShakeFrame(ms);

 if(firstFit&&shown){
  firstFit=false;
  fitAll();
 }

 setText($('imgTime'),formatJST(ms));

 lastAppliedImageMs=ms;
}

/* =========================================
   MapLibre
========================================= */

function addSourceAndLayer(){
 if(!map.getSource('stations')){
  map.addSource('stations',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('station-points')){
  map.addLayer({
   id:'station-points',
   type:'circle',
   source:'stations',

   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,1.55,
     5,3.0,
     8,4.0,
     11,4.85
    ],

    'circle-color':['get','hex'],

    'circle-stroke-color':'#ffffff',
    'circle-stroke-width':0.25,

    'circle-opacity':1
   }
  });
 }
}

function fitAll(){
 if(!map)return;

 const bounds=new maplibregl.LngLatBounds();

 let hasValidPoint=false;

 for(const st of stations){
  if(
   !st.geom||
   !Array.isArray(st.geom.coordinates)
  )continue;

  const [lon,lat]=st.geom.coordinates;

  if(
   !Number.isFinite(lon)||
   !Number.isFinite(lat)
  )continue;

  bounds.extend([lon,lat]);
  hasValidPoint=true;
 }

 const options={
  padding:MAP_PADDING,
  maxZoom:5.2,
  bearing:0,
  pitch:0,
  duration:700
 };

 if(hasValidPoint){
  map.fitBounds(bounds,options);
 }else{
  map.fitBounds(JAPAN_BOUNDS,options);
 }
}

$('resetMapButton').addEventListener('click',()=>{
 fitAll();
});

map=new maplibregl.Map({
 container:'map',

 style:'https://tiles.openfreemap.org/styles/positron',

 center:INITIAL_CENTER,
 zoom:INITIAL_ZOOM,
 bearing:0,
 pitch:0,

 attributionControl:{
  customAttribution:
   '<a href="https://www.kyoshin.bosai.go.jp/ja/about_kmoni/" target="_blank" rel="noopener noreferrer">防災科学技術研究所（NIED）</a>'
 }
});

map.on('error',e=>{
 console.error('MapLibre:',e.error||e);
});

document.addEventListener(
 'visibilitychange',
 ()=>{
  if(document.hidden){
   clearTimeout(hiddenTimer);

   hiddenTimer=setTimeout(()=>{
    wsWanted=false;

    clearTimeout(wsReconnectTimer);

    if(ws){
     try{
      ws.close(1000,'hidden');
     }catch(_){}
    }
   },HIDDEN_DISCONNECT);

  }else{
   clearTimeout(hiddenTimer);

   wsWanted=true;

   connectStream();
  }
 }
);

window.addEventListener(
 'pageshow',
 ()=>{
  wsWanted=true;
  connectStream();
 }
);

map.on('load',()=>{
 addSourceAndLayer();

 setupShakeCanvas();

 fitAll();

 maintainClock();
 tickSyncTime();

 connectStream();
});

</script>
