<script>
const WS_URL =
'wss://tags-clicks-repeated-painted.trycloudflare.com/';

const NTP_URL =
'https://api.wolfx.jp/ntp.json';

const POINTS_URL =
'https://raw.githubusercontent.com/ingen084/kyoshin-monitor-observation-points/refs/heads/master/intensity-points.json';

const TIME_SYNC_INTERVAL = 60000;
const TIME_SYNC_SAMPLES = 5;
const POINTS_TIMEOUT = 8000;
const RECONNECT_BASE = 1000;
const RECONNECT_MAX = 10000;
const PING_INTERVAL = 10000;
const HIDDEN_DISCONNECT = 60000;

const INITIAL_CENTER = [138,36.5];
const INITIAL_ZOOM = 4.2;

const JAPAN_BOUNDS = [
 [122.5,24],
 [146,46]
];

const MAP_PADDING = {
 top:90,
 right:35,
 bottom:70,
 left:35
};

/* =========================================================
   グリッド検知パラメータ
========================================================= */

const GRID_PARAMS = Object.freeze({

 /* 0.1度単位。日本付近ではおよそ10km前後 */
 SIZE:0.1,

 /* 10フレーム分の履歴 */
 HISTORY_COUNT:10,

 /* 履歴が途切れたとみなす時間 */
 HISTORY_RESET_GAP:5000,

 /* 検知に必要な震度変化 */
 MIN_RISE:0.2,

 /* グリッドの検知状態を保持する時間 */
 HOLD_TIME:5000,

 /* カメラ枠の余白 */
 CAMERA_PADDING:0.1,

 /* 隣接セルの探索範囲 */
 NEIGHBOR_RANGE:1

});

/*
 * 3段階の色分け。
 * intensityは既存のRGB変換結果を使用する。
 */
function getGridLevel(intensity){
 if(intensity>=2.5)return 2;
 if(intensity>=0.5)return 1;
 return 0;
}

const GRID_LEVELS=[
 {
  name:'弱い揺れ検知',
  color:'#22c55e',
  className:'shake-level-0'
 },
 {
  name:'揺れ検知',
  color:'#eab308',
  className:'shake-level-1'
 },
 {
  name:'強い揺れ検知',
  color:'#ef4444',
  className:'shake-level-2'
 }
];

let clockBaseEpoch = null;
let clockBasePerf = null;
let clockSynced = false;
let timeSyncPromise = null;
let lastAppliedImageMs = null;
let records = null;
let recordsPromise = null;
let preparedPoints = null;
let stations = [];
let gridCells = new Map();
let gridEvents = [];
let forceUpdate = true;
let firstFit = true;
let map;
let lastImageWidth = 0;
let lastImageHeight = 0;
let cameraFrameEnabled = true;

const $ = id => document.getElementById(id);

const HEX = Array.from(
 {length:256},
 (_,i)=>i.toString(16).padStart(2,'0')
);

const p2 = n=>String(n).padStart(2,'0');

function setText(el,text){
 if(el._t===text)return;
 el._t=text;
 el.textContent=text;
}

function getSyncedNow(){
 if(!clockSynced){
  return Date.now();
 }

 return clockBaseEpoch+
  (performance.now()-clockBasePerf);
}

function jstParts(ms){
 const d=new Date(ms+9*3600e3);

 return {
  Y:d.getUTCFullYear(),
  M:p2(d.getUTCMonth()+1),
  D:p2(d.getUTCDate()),
  h:p2(d.getUTCHours()),
  m:p2(d.getUTCMinutes()),
  s:p2(d.getUTCSeconds())
 };
}

function formatJST(ms){
 const t=jstParts(ms);

 return `${t.Y}/${t.M}/${t.D} ${t.h}:${t.m}:${t.s}`;
}

/* =========================================================
   Wolfx時刻同期
========================================================= */

async function fetchWolfxTime(){
 const start=performance.now();

 const controller=new AbortController();

 const timeout=setTimeout(
  ()=>controller.abort(),
  8000
 );

 try{
  const response=await fetch(
   NTP_URL+'?_='+Date.now(),
   {
    cache:'no-store',
    signal:controller.signal
   }
  );

  if(!response.ok){
   throw new Error('Wolfx HTTP '+response.status);
  }

  const data=await response.json();
  const end=performance.now();

  let epoch=Number(data.timestamp);

  if(!Number.isFinite(epoch)||epoch<1000000000000){
   const value=data.JST?.int;

   if(value){
    const s=String(value);

    if(/^\d{14}$/.test(s)){
     const iso=
      `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T`+
      `${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}+09:00`;

     epoch=Date.parse(iso);
    }
   }
  }

  if(!Number.isFinite(epoch)){
   throw new Error('Wolfx時刻を解析できません');
  }

  return {
   epoch,
   perf:(start+end)/2,
   rtt:end-start
  };

 }finally{
  clearTimeout(timeout);
 }
}

async function syncClock(){
 if(timeSyncPromise){
  return timeSyncPromise;
 }

 timeSyncPromise=(async()=>{
  const samples=[];

  for(let i=0;i<TIME_SYNC_SAMPLES;i++){
   try{
    samples.push(await fetchWolfxTime());
   }catch(e){
    console.warn('Wolfx同期失敗:',e);
   }
  }

  if(!samples.length){
   throw new Error('Wolfx時刻を取得できません');
  }

  samples.sort((a,b)=>a.rtt-b.rtt);

  const best=samples[0];

  clockBaseEpoch=best.epoch;
  clockBasePerf=best.perf;
  clockSynced=true;

  console.log('Wolfx時刻同期完了',{
   RTT:Math.round(best.rtt),
   samples:samples.length,
   serverTime:new Date(best.epoch).toISOString()
  });

  return best;

 })().finally(()=>{
  timeSyncPromise=null;
 });

 return timeSyncPromise;
}

async function maintainClock(){
 try{
  await syncClock();
 }catch(e){
  console.error('時刻再同期エラー:',e);
 }

 setTimeout(maintainClock,TIME_SYNC_INTERVAL);
}

function tickSyncTime(){
 const now=getSyncedNow();

 setText($('syncTime'),formatJST(now));

 setTimeout(
  tickSyncTime,
  1000-(now%1000)+15
 );
}

/* =========================================================
   WebSocket
========================================================= */

const wsStats={
 state:'未接続',
 connects:0,
 frames:0,
 errors:0,
 lastRecvPerf:null,
 clients:null
};

let ws=null;
let wsPing=null;
let wsReconnectTimer=null;
let wsAttempt=0;
let wsWanted=true;
let hiddenTimer=null;

function updateWsInfo(){
 const el=$('wsInfo');

 const connected=
  ws&&ws.readyState===WebSocket.OPEN;

 el.classList.toggle('connected',!!connected);

 const label=el.querySelector('span:last-child');

 setText(
  label,
  connected?'WSS 接続中':'WSS 未接続'
 );
}

function scheduleReconnect(){
 if(!wsWanted)return;

 clearTimeout(wsReconnectTimer);

 const delay=Math.min(
  RECONNECT_BASE*2**wsAttempt,
  RECONNECT_MAX
 );

 wsAttempt++;

 wsReconnectTimer=setTimeout(connectStream,delay);
}

function handleTextMessage(text){
 let msg=null;

 try{
  msg=JSON.parse(text);
 }catch(_){
  return;
 }

 if(msg&&msg.type==='error'){
  wsStats.errors++;
 }
}

function connectStream(){
 if(!wsWanted)return;

 if(
  ws&&
  (ws.readyState===WebSocket.OPEN||
   ws.readyState===WebSocket.CONNECTING)
 ){
  return;
 }

 updateWsInfo();

 const s=new WebSocket(WS_URL);

 s.binaryType='arraybuffer';

 ws=s;

 s.onopen=()=>{
  wsAttempt=0;
  wsStats.connects++;
  wsStats.state='接続中';

  updateWsInfo();

  clearInterval(wsPing);

  wsPing=setInterval(()=>{
   try{
    if(s.readyState===WebSocket.OPEN){
     s.send('ping');
    }
   }catch(_){}
  },PING_INTERVAL);

  loadPoints().catch(()=>{});
 };

 s.onmessage=ev=>{
  if(typeof ev.data==='string'){
   handleTextMessage(ev.data);
   return;
  }

  wsStats.frames++;

  wsStats.lastRecvPerf=performance.now();

  const buf=ev.data;

  loadPoints()
   .then(()=>{
    if(ws===s){
     applyFrame(buf);
    }
   })
   .catch(e=>{
    wsStats.errors++;

    console.error('観測点データ処理エラー:',e);

    try{
     s.close();
    }catch(_){}
   });
 };

 s.onerror=()=>{};

 s.onclose=()=>{
  if(ws===s){
   ws=null;
  }

  clearInterval(wsPing);

  wsStats.state='切断';

  updateWsInfo();

  scheduleReconnect();
 };
}

/* =========================================================
   RGB → HSV → 強震モニタスケール
========================================================= */

function rgbToHSV(r,g,b){
 r/=255;
 g/=255;
 b/=255;

 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);
 const delta=max-min;

 let h=0;

 const v=max;
 const s=max===0?0:delta/max;

 if(delta!==0){
  if(max===r){
   h=(g-b)/delta;

   if(g<b){
    h+=6;
   }

  }else if(max===g){
   h=(b-r)/delta+2;

  }else{
   h=(r-g)/delta+4;
  }

  h/=6;
 }

 return {h,s,v};
}

function colorToPosition(hsv){
 const h=hsv.h;
 const s=hsv.s;
 const v=hsv.v;

 if(!(v>0.1&&s>0.75)){
  return null;
 }

 let p=0;

 if(h>0.1476){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;
  const h5=h4*h;
  const h6=h5*h;

  p=
   280.31*h6
   -916.05*h5
   +1142.6*h4
   -709.95*h3
   +234.65*h2
   -40.27*h
   +3.2217;

 }else if(h>0.001){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;

  p=
   151.4*h4
   -49.32*h3
   +6.753*h2
   -2.481*h
   +0.9033;

 }else{
  p=
   -0.005171*v*v
   -0.3282*v
   +1.2236;
 }

 if(p<0){
  p=0;
 }

 if(!Number.isFinite(p)){
  return null;
 }

 return p;
}

/*
 * 元コードの変換処理を維持。
 */
function scaleToIntensity(scale){
 return scale*10-3;
}

/* =========================================================
   観測点JSON
========================================================= */

function walkRecords(value,out=[]){
 if(Array.isArray(value)){
  for(const v of value){
   walkRecords(v,out);
  }

  return out;
 }

 if(value&&typeof value==='object'){
  if(
   value.location&&
   value.point&&
   value.point.center_point
  ){
   out.push(value);
  }

  for(const v of Object.values(value)){
   if(v&&typeof v==='object'){
    walkRecords(v,out);
   }
  }
 }

 return out;
}

function preparePoints(recs){
 const result=[];

 for(const item of recs){
  const loc=item.location||{};
  const point=item.point||{};
  const center=point.center_point||{};
  const offset=point.offset||{};

  const lat=Number(loc.latitude);
  const lon=Number(loc.longitude);

  const x=
   Number(center.x)+Number(offset.x||0);

  const y=
   Number(center.y)+Number(offset.y||0);

  if(
   !Number.isFinite(lat)||
   !Number.isFinite(lon)||
   !Number.isFinite(x)||
   !Number.isFinite(y)
  ){
   continue;
  }

  if(item.is_suspended===true)continue;

  result.push({
   lat,
   lon,
   x:Math.round(x),
   y:Math.round(y),

   name:
    item.name||
    item.point_name||
    item.station_name||
    item.code||
    '観測点',

   region:
    item.region||
    item.prefecture||
    '',

   code:item.code||''
  });
 }

 return result;
}

function loadPoints(){
 if(recordsPromise){
  return recordsPromise;
 }

 recordsPromise=(async()=>{
  const controller=new AbortController();

  const timeout=setTimeout(
   ()=>controller.abort(),
   POINTS_TIMEOUT
  );

  try{
   const response=await fetch(
    POINTS_URL,
    {
     cache:'force-cache',
     signal:controller.signal
    }
   );

   if(!response.ok){
    throw new Error('観測点JSON HTTP '+response.status);
   }

   const raw=await response.text();

   const data=JSON.parse(raw.replace(/^\uFEFF/,''));

   records=walkRecords(data);

   if(!records.length){
    throw new Error('観測点データが見つかりません');
   }

   preparedPoints=preparePoints(records);

   if(!preparedPoints.length){
    throw new Error('有効な観測点がありません');
   }

   setText(
    $('total'),
    records.length.toLocaleString()
   );

   console.log('観測点準備完了',{
    total:records.length,
    prepared:preparedPoints.length
   });

   return preparedPoints;

  }finally{
   clearTimeout(timeout);
  }

 })().catch(e=>{
  recordsPromise=null;
  records=null;
  preparedPoints=null;
  throw e;
 });

 return recordsPromise;
}

/* =========================================================
   グリッド生成
========================================================= */

function getGridCoordinates(lat,lon){
 const size=GRID_PARAMS.SIZE;

 const gx=Math.floor((lon+180)/size);
 const gy=Math.floor((lat+90)/size);

 return {
  gx,
  gy,
  key:`${gx}:${gy}`
 };
}

function createGridCell(gx,gy){
 const size=GRID_PARAMS.SIZE;

 const west=gx*size-180;
 const south=gy*size-90;
 const east=west+size;
 const north=south+size;

 return {
  key:`${gx}:${gy}`,
  gx,
  gy,

  west,
  south,
  east,
  north,

  stations:[],

  history:[],
  currentIntensity:null,
  rise:0,

  detectedUntil:0,
  level:0,

  lastUpdated:0
 };
}

function setupGridCells(){
 gridCells=new Map();

 for(const st of stations){
  const pos=getGridCoordinates(st.lat,st.lon);

  let cell=gridCells.get(pos.key);

  if(!cell){
   cell=createGridCell(pos.gx,pos.gy);
   gridCells.set(pos.key,cell);
  }

  cell.stations.push(st);
  st.gridKey=pos.key;
 }

 console.log('グリッド生成完了',{
  cells:gridCells.size,
  size:GRID_PARAMS.SIZE
 });
}

function getNeighborCells(cell){
 const result=[];
 const range=GRID_PARAMS.NEIGHBOR_RANGE;

 for(let dy=-range;dy<=range;dy++){
  for(let dx=-range;dx<=range;dx++){
   if(dx===0&&dy===0)continue;

   const key=
    `${cell.gx+dx}:${cell.gy+dy}`;

   const neighbor=gridCells.get(key);

   if(neighbor){
    result.push(neighbor);
   }
  }
 }

 return result;
}

/* =========================================================
   グリッド履歴更新
========================================================= */

function updateGridHistory(cell){
 let maxIntensity=null;

 for(const st of cell.stations){
  if(!st.valid||st.intensity===null)continue;

  if(
   maxIntensity===null||
   st.intensity>maxIntensity
  ){
   maxIntensity=st.intensity;
  }
 }

 cell.currentIntensity=maxIntensity;

 cell.history.push({
  time:cell.lastUpdated,
  value:maxIntensity
 });

 while(
  cell.history.length>
  GRID_PARAMS.HISTORY_COUNT
 ){
  cell.history.shift();
 }

 if(maxIntensity===null){
  cell.rise=0;
  return;
 }

 const firstValid=cell.history.find(
  h=>h.value!==null
 );

 if(!firstValid){
  cell.rise=0;
  return;
 }

 cell.rise=maxIntensity-firstValid.value;
}

/* =========================================================
   グリッド検知処理
========================================================= */

function resetGridHistories(){
 for(const cell of gridCells.values()){
  cell.history=[];
  cell.currentIntensity=null;
  cell.rise=0;
  cell.detectedUntil=0;
  cell.level=0;
 }

 gridEvents=[];

 updateShakeUI();
 updateShakeMap();
}

function processGridFrame(time){
 if(!gridCells.size)return;

 /*
  * 全グリッドの現在値を更新。
  * 差分フレームに含まれない観測点も
  * 現在の有効値を使って集約する。
  */
 for(const cell of gridCells.values()){
  cell.lastUpdated=time;
  updateGridHistory(cell);
 }

 const candidates=[];

 for(const cell of gridCells.values()){
  if(cell.currentIntensity===null)continue;

  if(
   cell.history.length<
   GRID_PARAMS.HISTORY_COUNT
  ){
   continue;
  }

  if(cell.rise<GRID_PARAMS.MIN_RISE){
   continue;
  }

  candidates.push(cell);
 }

 const candidateSet=new Set(
  candidates.map(c=>c.key)
 );

 /*
  * 隣接グリッドも反応している場合のみ検知。
  * 単独セルの反応はイベント化しない。
  */
 for(const cell of candidates){
  const neighbors=getNeighborCells(cell);

  const activeNeighbors=neighbors.filter(
   n=>candidateSet.has(n.key)
  );

  if(activeNeighbors.length<1){
   continue;
  }

  cell.detectedUntil=
   time+GRID_PARAMS.HOLD_TIME;

  cell.level=getGridLevel(
   cell.currentIntensity
  );
 }

 /*
  * 検知継続中のセルを集める。
  */
 const activeCells=[
  ...gridCells.values()
 ].filter(
  cell=>cell.detectedUntil>=time
 );

 /*
  * 隣接セルを連結して1つのイベントにする。
  */
 const activeMap=new Map(
  activeCells.map(cell=>[cell.key,cell])
 );

 const visited=new Set();
 const events=[];

 for(const start of activeCells){
  if(visited.has(start.key))continue;

  const stack=[start];
  const component=[];

  visited.add(start.key);

  while(stack.length){
   const current=stack.pop();

   component.push(current);

   for(const neighbor of getNeighborCells(current)){
    if(
     !activeMap.has(neighbor.key)||
     visited.has(neighbor.key)
    ){
     continue;
    }

    visited.add(neighbor.key);
    stack.push(neighbor);
   }
  }

  if(component.length<2)continue;

  const maxLevel=Math.max(
   ...component.map(c=>c.level)
  );

  events.push({
   cells:component,
   level:maxLevel,
   createdAt:Math.min(
    ...component.map(c=>c.lastUpdated)
   )
  });
 }

 gridEvents=events;

 updateShakeUI();
 updateShakeMap();
}

/* =========================================================
   検知UI
========================================================= */

function updateShakeUI(){
 const events=gridEvents
  .slice()
  .sort((a,b)=>b.createdAt-a.createdAt);

 setText(
  $('shakeCount'),
  String(events.length)
 );

 const state=$('shakeState');

 state.classList.toggle(
  'active',
  events.length>0
 );

 setText(
  $('shakeStateText'),
  events.length>0?'グリッド地震検知中':'現在検知なし'
 );

 const list=$('shakeList');

 while(list.firstChild){
  list.removeChild(list.firstChild);
 }

 for(const event of events.slice(0,5)){
  const item=document.createElement('div');
  item.className='shake-item';

  const name=document.createElement('span');
  name.className='shake-item-name';

  name.textContent=
   `検知エリア / ${event.cells.length}グリッド`;

  const level=document.createElement('span');
  level.className=
   'shake-level '+
   GRID_LEVELS[event.level].className;

  level.textContent=
   GRID_LEVELS[event.level].name;

  item.appendChild(name);
  item.appendChild(level);

  list.appendChild(item);
 }
}

/* =========================================================
   グリッドGeoJSON
========================================================= */

function cellToFeature(cell){
 return {
  type:'Feature',

  geometry:{
   type:'Polygon',
   coordinates:[[
    [cell.west,cell.south],
    [cell.east,cell.south],
    [cell.east,cell.north],
    [cell.west,cell.north],
    [cell.west,cell.south]
   ]]
  },

  properties:{
   level:cell.level,
   key:cell.key
  }
 };
}

function createCameraFeature(event,index){
 const cells=event.cells;

 const west=Math.min(
  ...cells.map(c=>c.west)
 )-GRID_PARAMS.CAMERA_PADDING;

 const east=Math.max(
  ...cells.map(c=>c.east)
 )+GRID_PARAMS.CAMERA_PADDING;

 const south=Math.min(
  ...cells.map(c=>c.south)
 )-GRID_PARAMS.CAMERA_PADDING;

 const north=Math.max(
  ...cells.map(c=>c.north)
 )+GRID_PARAMS.CAMERA_PADDING;

 return {
  type:'Feature',

  geometry:{
   type:'Polygon',
   coordinates:[[
    [west,south],
    [east,south],
    [east,north],
    [west,north],
    [west,south]
   ]]
  },

  properties:{
   event:index
  }
 };
}

function updateShakeMap(){
 if(!map)return;

 const gridSource=map.getSource('shake-grid');
 const cameraSource=map.getSource('camera-frame');

 if(!gridSource||!cameraSource)return;

 const gridFeatures=[];
 const cameraFeatures=[];

 gridEvents.forEach((event,index)=>{
  for(const cell of event.cells){
   gridFeatures.push(
    cellToFeature(cell)
   );
  }

  if(cameraFrameEnabled){
   cameraFeatures.push(
    createCameraFeature(event,index)
   );
  }
 });

 gridSource.setData({
  type:'FeatureCollection',
  features:gridFeatures
 });

 cameraSource.setData({
  type:'FeatureCollection',
  features:cameraFeatures
 });
}

/* =========================================================
   検知フレーム
========================================================= */

let lastGridFrameTime=null;

function processDetectionFrame(time){
 if(lastGridFrameTime!==null){
  const gap=Math.abs(
   time-lastGridFrameTime
  );

  if(
   gap>=GRID_PARAMS.HISTORY_RESET_GAP
  ){
   console.warn(
    'グリッド履歴リセット: 時刻間隔',
    gap
   );

   resetGridHistories();
  }
 }

 lastGridFrameTime=time;

 processGridFrame(time);
}

/* =========================================================
   観測点準備
========================================================= */

function prepareStations(width,height){
 if(
  stations.length&&
  lastImageWidth===width&&
  lastImageHeight===height
 ){
  return;
 }

 lastImageWidth=width;
 lastImageHeight=height;

 stations=preparedPoints
  .filter(p=>
   p.x>=0&&
   p.y>=0&&
   p.x<width&&
   p.y<height
  )
  .map((p,i)=>({
   i,

   geom:{
    type:'Point',
    coordinates:[p.lon,p.lat]
   },

   name:p.name,
   region:p.region,
   code:p.code,

   x:p.x,
   y:p.y,

   lat:p.lat,
   lon:p.lon,

   r:0,
   g:0,
   b:0,

   hex:'#000000',

   position:null,
   intensity:null,
   valid:false,

   gridKey:null
  }));

 setupGridCells();

 gridEvents=[];
 lastGridFrameTime=null;

 forceUpdate=true;
}

/* =========================================================
   バイナリフレーム処理
========================================================= */

function applyFrame(buf){
 if(buf.byteLength<22)return;

 const dv=new DataView(buf);

 if(dv.getUint8(0)!==1)return;

 const ms=dv.getFloat64(1,true);

 if(
  lastAppliedImageMs!==null&&
  ms<=lastAppliedImageMs
 ){
  return;
 }

 const w=dv.getUint16(9,true);
 const h=dv.getUint16(11,true);
 const flags=dv.getUint8(13);
 const total=dv.getUint16(14,true);
 const count=dv.getUint16(16,true);
 const serverMs=dv.getUint16(18,true);
 const clients=dv.getUint16(20,true);

 if(buf.byteLength!==22+count*6){
  console.error(
   'フレーム長が不正です',
   buf.byteLength,
   count
  );

  return;
 }

 wsStats.clients=clients;

 prepareStations(w,h);

 if(stations.length!==total){
  console.error(
   '観測点数がサーバーと一致しません',
   total,
   stations.length
  );

  return;
 }

 setText($('imageSize'),`${w} × ${h}px`);

 let changed=forceUpdate;

 /*
  * フルフレームの場合は全観測点を一度無効化する。
  */
 if(flags&1){
  for(const st of stations){
   st.valid=false;
   st.position=null;
   st.intensity=null;
  }

  changed=true;
 }

 let o=22;

 for(let k=0;k<count;k++,o+=6){
  const i=dv.getUint16(o,true);
  const st=stations[i];

  if(!st)continue;

  changed=true;

  if(!dv.getUint8(o+2)){
   st.valid=false;
   st.position=null;
   st.intensity=null;

   continue;
  }

  const r=dv.getUint8(o+3);
  const g=dv.getUint8(o+4);
  const b=dv.getUint8(o+5);

  st.r=r;
  st.g=g;
  st.b=b;

  const position=colorToPosition(
   rgbToHSV(r,g,b)
  );

  if(position===null){
   st.valid=false;
   st.position=null;
   st.intensity=null;

   continue;
  }

  st.hex='#'+HEX[r]+HEX[g]+HEX[b];

  st.position=position;

  st.intensity=scaleToIntensity(position);

  st.valid=true;
 }

 /*
  * グリッド単位で検知処理。
  */
 processDetectionFrame(ms);

 let shown=0;

 for(const st of stations){
  if(st.valid)shown++;
 }

 setText(
  $('shown'),
  shown.toLocaleString()
 );

 if(changed&&map){
  const source=map.getSource('stations');

  if(source){
   const features=[];

   for(const st of stations){
    if(!st.valid)continue;

    features.push({
     type:'Feature',

     geometry:st.geom,

     properties:{
      i:st.i,
      hex:st.hex
     }
    });
   }

   source.setData({
    type:'FeatureCollection',
    features
   });

   forceUpdate=false;
  }
 }

 if(firstFit&&shown){
  firstFit=false;
  fitAll();
 }

 setText($('imgTime'),formatJST(ms));

 lastAppliedImageMs=ms;
}

/* =========================================================
   MapLibre
========================================================= */

function addSourceAndLayer(){

 if(!map.getSource('stations')){
  map.addSource('stations',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('station-points')){
  map.addLayer({
   id:'station-points',
   type:'circle',
   source:'stations',

   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,1.55,
     5,3.0,
     8,4.0,
     11,4.85
    ],

    'circle-color':['get','hex'],

    'circle-stroke-color':'#ffffff',
    'circle-stroke-width':0.25,

    'circle-opacity':1
   }
  });
 }

 /* グリッド検知セル */
 if(!map.getSource('shake-grid')){
  map.addSource('shake-grid',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('shake-grid-fill')){
  map.addLayer({
   id:'shake-grid-fill',
   type:'fill',
   source:'shake-grid',

   paint:{
    'fill-color':[
     'match',
     ['get','level'],
     0,'#22c55e',
     1,'#eab308',
     2,'#ef4444',
     '#22c55e'
    ],

    'fill-opacity':0.55
   }
  });
 }

 if(!map.getLayer('shake-grid-outline')){
  map.addLayer({
   id:'shake-grid-outline',
   type:'line',
   source:'shake-grid',

   paint:{
    'line-color':[
     'match',
     ['get','level'],
     0,'#16a34a',
     1,'#ca8a04',
     2,'#dc2626',
     '#16a34a'
    ],

    'line-width':1.5,
    'line-opacity':0.95
   }
  });
 }

 /* カメラ枠 */
 if(!map.getSource('camera-frame')){
  map.addSource('camera-frame',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('camera-frame-outline')){
  map.addLayer({
   id:'camera-frame-outline',
   type:'line',
   source:'camera-frame',

   paint:{
    'line-color':'#ef1111',
    'line-width':[
     'interpolate',
     ['linear'],
     ['zoom'],
     3,2,
     6,3,
     10,4
    ],
    'line-opacity':1
   }
  });
 }

 updateShakeMap();
}

function fitAll(){
 if(!map)return;

 const bounds=new maplibregl.LngLatBounds();

 let hasValidPoint=false;

 for(const st of stations){
  if(
   !st.geom||
   !Array.isArray(st.geom.coordinates)
  ){
   continue;
  }

  const [lon,lat]=st.geom.coordinates;

  if(
   !Number.isFinite(lon)||
   !Number.isFinite(lat)
  ){
   continue;
  }

  bounds.extend([lon,lat]);

  hasValidPoint=true;
 }

 const options={
  padding:MAP_PADDING,
  maxZoom:5.2,
  bearing:0,
  pitch:0,
  duration:700
 };

 if(hasValidPoint){
  map.fitBounds(bounds,options);
 }else{
  map.fitBounds(JAPAN_BOUNDS,options);
 }
}
