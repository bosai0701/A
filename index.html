<script>
const WS_URL =
'wss://tags-clicks-repeated-painted.trycloudflare.com/';

const NTP_URL =
'https://api.wolfx.jp/ntp.json';

const POINTS_URL =
'https://raw.githubusercontent.com/ingen084/kyoshin-monitor-observation-points/refs/heads/master/intensity-points.json';

const TIME_SYNC_INTERVAL = 60000;
const TIME_SYNC_SAMPLES = 5;
const POINTS_TIMEOUT = 8000;
const RECONNECT_BASE = 1000;
const RECONNECT_MAX = 10000;
const PING_INTERVAL = 10000;
const HIDDEN_DISCONNECT = 60000;

const INITIAL_CENTER = [138,36.5];
const INITIAL_ZOOM = 4.2;

const JAPAN_BOUNDS = [
 [122.5,24],
 [146,46]
];

const MAP_PADDING = {
 top:90,
 right:35,
 bottom:70,
 left:35
};

/* =========================================================
   地震検知パラメータ
   元記事および参照先のShakeDetectionParametersを基準
========================================================= */

const SHAKE_PARAMS = Object.freeze({

 MAX_SEARCH_DISTANCE:60,

 PEAK_WEIGHT_DISTANCE:14,

 ISOLATED_THRESHOLD:1,

 ISOLATED_DETECTION_DIFF:1.4,

 SCORE_THRESHOLD_RATIO:0.333333,

 SCORE_INTENSITY_OFFSET:-0.8,

 MIN_DETECTION_DIFF:0.2,

 NO_CHANGE_PENALTY_FACTOR:0.25,

 MAX_NEAR_POINTS:50,

 MERGE_DISTANCE:[
  90,
  130,
  180,
  250,
  250
 ],

 EXPIRE_SECONDS:[
  20,
  30,
  40,
  70,
  80
 ],

 WEAKER_CONFIRM_POINT_COUNT:4,

 WEAK_CONFIRM_POINT_COUNT:3,

 HISTORY_COUNT:10,

 HISTORY_RESET_GAP:5

});

let clockBaseEpoch = null;
let clockBasePerf = null;
let clockSynced = false;
let timeSyncPromise = null;
let lastAppliedImageMs = null;
let records = null;
let recordsPromise = null;
let preparedPoints = null;
let stations = [];
let forceUpdate = true;
let firstFit = true;
let map;
let lastImageWidth = 0;
let lastImageHeight = 0;
let lastImageCompletedPerf = null;

const $ = id => document.getElementById(id);

const HEX = Array.from(
 {length:256},
 (_,i)=>i.toString(16).padStart(2,'0')
);

const p2 = n=>String(n).padStart(2,'0');

function setText(el,text){
 if(el._t===text)return;
 el._t=text;
 el.textContent=text;
}

function getSyncedNow(){
 if(!clockSynced){
  return Date.now();
 }

 return clockBaseEpoch+
  (performance.now()-clockBasePerf);
}

function jstParts(ms){
 const d=new Date(ms+9*3600e3);

 return {
  Y:d.getUTCFullYear(),
  M:p2(d.getUTCMonth()+1),
  D:p2(d.getUTCDate()),
  h:p2(d.getUTCHours()),
  m:p2(d.getUTCMinutes()),
  s:p2(d.getUTCSeconds())
 };
}

function formatJST(ms){
 const t=jstParts(ms);

 return `${t.Y}/${t.M}/${t.D} ${t.h}:${t.m}:${t.s}`;
}

async function fetchWolfxTime(){
 const start=performance.now();

 const controller=new AbortController();

 const timeout=setTimeout(
  ()=>controller.abort(),
  8000
 );

 try{
  const response=await fetch(
   NTP_URL+'?_='+Date.now(),
   {
    cache:'no-store',
    signal:controller.signal
   }
  );

  if(!response.ok){
   throw new Error('Wolfx HTTP '+response.status);
  }

  const data=await response.json();
  const end=performance.now();

  let epoch=Number(data.timestamp);

  if(!Number.isFinite(epoch)||epoch<1000000000000){
   const value=data.JST?.int;

   if(value){
    const s=String(value);

    if(/^\d{14}$/.test(s)){
     const iso=
      `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T`+
      `${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}+09:00`;

     epoch=Date.parse(iso);
    }
   }
  }

  if(!Number.isFinite(epoch)){
   throw new Error('Wolfx時刻を解析できません');
  }

  return {
   epoch,
   perf:(start+end)/2,
   rtt:end-start
  };

 }finally{
  clearTimeout(timeout);
 }
}

async function syncClock(){
 if(timeSyncPromise){
  return timeSyncPromise;
 }

 timeSyncPromise=(async()=>{
  const samples=[];

  for(let i=0;i<TIME_SYNC_SAMPLES;i++){
   try{
    samples.push(await fetchWolfxTime());
   }catch(e){
    console.warn('Wolfx同期失敗:',e);
   }
  }

  if(!samples.length){
   throw new Error('Wolfx時刻を取得できません');
  }

  samples.sort((a,b)=>a.rtt-b.rtt);

  const best=samples[0];

  clockBaseEpoch=best.epoch;
  clockBasePerf=best.perf;
  clockSynced=true;

  console.log('Wolfx時刻同期完了',{
   RTT:Math.round(best.rtt),
   samples:samples.length,
   serverTime:new Date(best.epoch).toISOString()
  });

  return best;

 })().finally(()=>{
  timeSyncPromise=null;
 });

 return timeSyncPromise;
}

async function maintainClock(){
 try{
  await syncClock();
 }catch(e){
  console.error('時刻再同期エラー:',e);
 }

 setTimeout(maintainClock,TIME_SYNC_INTERVAL);
}

function tickSyncTime(){
 const now=getSyncedNow();

 setText($('syncTime'),formatJST(now));

 setTimeout(
  tickSyncTime,
  1000-(now%1000)+15
 );
}

/* =========================================================
   WebSocket
========================================================= */

const wsStats={
 state:'未接続',
 connects:0,
 frames:0,
 errors:0,
 lastRecvPerf:null,
 clients:null
};

let ws=null;
let wsPing=null;
let wsReconnectTimer=null;
let wsAttempt=0;
let wsWanted=true;
let hiddenTimer=null;

function updateWsInfo(){
 const el=$('wsInfo');

 const connected=
  ws&&ws.readyState===WebSocket.OPEN;

 el.classList.toggle('connected',!!connected);

 const label=el.querySelector('span:last-child');

 setText(
  label,
  connected?'WSS 接続中':'WSS 未接続'
 );
}

function scheduleReconnect(){
 if(!wsWanted)return;

 clearTimeout(wsReconnectTimer);

 const delay=Math.min(
  RECONNECT_BASE*2**wsAttempt,
  RECONNECT_MAX
 );

 wsAttempt++;

 wsReconnectTimer=setTimeout(connectStream,delay);
}

function handleTextMessage(text){
 let msg=null;

 try{
  msg=JSON.parse(text);
 }catch(_){
  return;
 }

 if(msg&&msg.type==='error'){
  wsStats.errors++;
 }
}

function connectStream(){
 if(!wsWanted)return;

 if(
  ws&&
  (ws.readyState===WebSocket.OPEN||
   ws.readyState===WebSocket.CONNECTING)
 ){
  return;
 }

 updateWsInfo();

 const s=new WebSocket(WS_URL);

 s.binaryType='arraybuffer';

 ws=s;

 s.onopen=()=>{
  wsAttempt=0;
  wsStats.connects++;
  wsStats.state='接続中';

  updateWsInfo();

  clearInterval(wsPing);

  wsPing=setInterval(()=>{
   try{
    if(s.readyState===WebSocket.OPEN){
     s.send('ping');
    }
   }catch(_){}
  },PING_INTERVAL);

  loadPoints().catch(()=>{});
 };

 s.onmessage=ev=>{
  if(typeof ev.data==='string'){
   handleTextMessage(ev.data);
   return;
  }

  wsStats.frames++;

  wsStats.lastRecvPerf=performance.now();

  const buf=ev.data;

  loadPoints()
   .then(()=>{
    if(ws===s){
     applyFrame(buf);
    }
   })
   .catch(e=>{
    wsStats.errors++;

    console.error('観測点データ処理エラー:',e);

    try{
     s.close();
    }catch(_){}
   });
 };

 s.onerror=()=>{};

 s.onclose=()=>{
  if(ws===s){
   ws=null;
  }

  clearInterval(wsPing);

  wsStats.state='切断';

  updateWsInfo();

  scheduleReconnect();
 };
}

/* =========================================================
   RGB → HSV → 強震モニタスケール
========================================================= */

function rgbToHSV(r,g,b){
 r/=255;
 g/=255;
 b/=255;

 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);
 const delta=max-min;

 let h=0;

 const v=max;
 const s=max===0?0:delta/max;

 if(delta!==0){
  if(max===r){
   h=(g-b)/delta;

   if(g<b){
    h+=6;
   }

  }else if(max===g){
   h=(b-r)/delta+2;

  }else{
   h=(r-g)/delta+4;
  }

  h/=6;
 }

 return {h,s,v};
}

function colorToPosition(hsv){
 const h=hsv.h;
 const s=hsv.s;
 const v=hsv.v;

 if(!(v>0.1&&s>0.75)){
  return null;
 }

 let p=0;

 if(h>0.1476){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;
  const h5=h4*h;
  const h6=h5*h;

  p=
   280.31*h6
   -916.05*h5
   +1142.6*h4
   -709.95*h3
   +234.65*h2
   -40.27*h
   +3.2217;

 }else if(h>0.001){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;

  p=
   151.4*h4
   -49.32*h3
   +6.753*h2
   -2.481*h
   +0.9033;

 }else{
  p=
   -0.005171*v*v
   -0.3282*v
   +1.2236;
 }

 if(p<0){
  p=0;
 }

 if(!Number.isFinite(p)){
  return null;
 }

 return p;
}

/*
 * KyoshinMonitorLibの変換式に合わせる。
 * scale 0.0～1.0 → リアルタイム震度
 */
function scaleToIntensity(scale){
 return scale*10-3;
}

/* =========================================================
   観測点JSON
========================================================= */

function walkRecords(value,out=[]){
 if(Array.isArray(value)){
  for(const v of value){
   walkRecords(v,out);
  }

  return out;
 }

 if(value&&typeof value==='object'){
  if(
   value.location&&
   value.point&&
   value.point.center_point
  ){
   out.push(value);
  }

  for(const v of Object.values(value)){
   if(v&&typeof v==='object'){
    walkRecords(v,out);
   }
  }
 }

 return out;
}

function preparePoints(recs){
 const result=[];

 for(const item of recs){
  const loc=item.location||{};
  const point=item.point||{};
  const center=point.center_point||{};
  const offset=point.offset||{};

  const lat=Number(loc.latitude);
  const lon=Number(loc.longitude);

  const x=
   Number(center.x)+Number(offset.x||0);

  const y=
   Number(center.y)+Number(offset.y||0);

  if(
   !Number.isFinite(lat)||
   !Number.isFinite(lon)||
   !Number.isFinite(x)||
   !Number.isFinite(y)
  ){
   continue;
  }

  if(item.is_suspended===true)continue;

  result.push({
   lat,
   lon,
   x:Math.round(x),
   y:Math.round(y),

   name:
    item.name||
    item.point_name||
    item.station_name||
    item.code||
    '観測点',

   region:
    item.region||
    item.prefecture||
    '',

   code:item.code||''
  });
 }

 return result;
}

function loadPoints(){
 if(recordsPromise){
  return recordsPromise;
 }

 recordsPromise=(async()=>{
  const controller=new AbortController();

  const timeout=setTimeout(
   ()=>controller.abort(),
   POINTS_TIMEOUT
  );

  try{
   const response=await fetch(
    POINTS_URL,
    {
     cache:'force-cache',
     signal:controller.signal
    }
   );

   if(!response.ok){
    throw new Error('観測点JSON HTTP '+response.status);
   }

   const raw=await response.text();

   const data=JSON.parse(raw.replace(/^\uFEFF/,''));

   records=walkRecords(data);

   if(!records.length){
    throw new Error('観測点データが見つかりません');
   }

   preparedPoints=preparePoints(records);

   if(!preparedPoints.length){
    throw new Error('有効な観測点がありません');
   }

   setText(
    $('total'),
    records.length.toLocaleString()
   );

   console.log('観測点準備完了',{
    total:records.length,
    prepared:preparedPoints.length
   });

   return preparedPoints;

  }finally{
   clearTimeout(timeout);
  }

 })().catch(e=>{
  recordsPromise=null;
  records=null;
  preparedPoints=null;
  throw e;
 });

 return recordsPromise;
}

/* =========================================================
   地震検知エンジン
========================================================= */

const shakeEngine={
 events:[],
 lastFrameTime:null,
 initialized:false,
 nextEventId:1,
 processedFrames:0
};

/* 地球上の2地点間の距離(km) */
function distanceKm(a,b){
 const rad=Math.PI/180;

 const lat1=a.lat*rad;
 const lat2=b.lat*rad;

 const dLat=(b.lat-a.lat)*rad;
 const dLon=(b.lon-a.lon)*rad;

 const sinLat=Math.sin(dLat/2);
 const sinLon=Math.sin(dLon/2);

 const h=
  sinLat*sinLat+
  Math.cos(lat1)*Math.cos(lat2)*sinLon*sinLon;

 return 6371*2*Math.atan2(
  Math.sqrt(h),
  Math.sqrt(Math.max(0,1-h))
 );
}

/* 距離に応じた重み */
function calculateDistanceWeight(distance){
 if(distance<=SHAKE_PARAMS.PEAK_WEIGHT_DISTANCE){
  return distance/SHAKE_PARAMS.PEAK_WEIGHT_DISTANCE;
 }

 return (
  SHAKE_PARAMS.MAX_SEARCH_DISTANCE-distance
 )/(
  SHAKE_PARAMS.MAX_SEARCH_DISTANCE-
  SHAKE_PARAMS.PEAK_WEIGHT_DISTANCE
 );
}

/*
 * 近傍観測点を事前計算する。
 * 0.5度グリッドで候補を絞り、実距離で正確に判定する。
 */
function setupNearPoints(){
 const cellSize=0.5;
 const buckets=new Map();

 const cellKey=(x,y)=>`${x}:${y}`;

 for(const st of stations){
  const gx=Math.floor(st.lon/cellSize);
  const gy=Math.floor(st.lat/cellSize);
  const key=cellKey(gx,gy);

  if(!buckets.has(key)){
   buckets.set(key,[]);
  }

  buckets.get(key).push(st);
 }

 for(const st of stations){
  const gx=Math.floor(st.lon/cellSize);
  const gy=Math.floor(st.lat/cellSize);

  const candidates=[];

  for(let dy=-2;dy<=2;dy++){
   for(let dx=-2;dx<=2;dx++){
    const bucket=buckets.get(cellKey(gx+dx,gy+dy));

    if(!bucket)continue;

    for(const other of bucket){
     if(other===st)continue;

     const distance=distanceKm(st,other);

     if(distance>=SHAKE_PARAMS.MAX_SEARCH_DISTANCE){
      continue;
     }

     candidates.push({
      point:other,
      distance,
      weight:calculateDistanceWeight(distance)
     });
    }
   }
  }

  candidates.sort((a,b)=>a.distance-b.distance);

  st.nearPoints=candidates.slice(
   0,
   SHAKE_PARAMS.MAX_NEAR_POINTS
  );

  st.hasNearPoints=st.nearPoints.length>0;

  st.totalNearPointWeight=st.nearPoints.reduce(
   (sum,p)=>sum+p.weight,
   0
  );

  st.history=new Array(
   SHAKE_PARAMS.HISTORY_COUNT
  ).fill(null);

  st.historyPosition=0;
  st.latestIntensity=null;
  st.intensityDiff=0;
  st.intensityAverage=0;
  st.hasValidHistory=false;
  st.isTmpDisabled=false;

  st.event=null;
  st.eventedAt=0;
  st.eventedExpireAt=0;
 }

 shakeEngine.initialized=true;

 console.log('地震検知エンジン初期化完了',{
  stations:stations.length,
  maxDistance:SHAKE_PARAMS.MAX_SEARCH_DISTANCE,
  maxNearPoints:SHAKE_PARAMS.MAX_NEAR_POINTS
 });
}

/*
 * 観測点ごとの10回分の震度履歴を更新する。
 *
 * 差分 = 最新値 - 10回分の最古値
 * 平均 = 10回分の合計 / 10
 */
function updateStationHistory(st,intensity){
 const count=SHAKE_PARAMS.HISTORY_COUNT;

 st.historyPosition=
  (st.historyPosition+1)%count;

 st.history[st.historyPosition]=intensity;

 st.latestIntensity=intensity;

 if(intensity!==null){
  st.hasValidHistory=true;
 }

 let before=null;
 let diff=0;
 let total=0;

 for(let i=st.historyPosition;i>=0;i--){
  const value=st.history[i];

  if(value!==null){
   if(before!==null){
    diff+=before-value;
   }

   before=value;
   total+=value;
  }
 }

 for(let i=count-1;i>st.historyPosition;i--){
  const value=st.history[i];

  if(value!==null){
   if(before!==null){
    diff+=before-value;
   }

   before=value;
   total+=value;
  }
 }

 st.intensityDiff=diff;
 st.intensityAverage=total/count;
}

function getShakeLevel(intensity){
 if(intensity>4.5)return 4;
 if(intensity>2.5)return 3;
 if(intensity>0.5)return 2;
 if(intensity>-1)return 1;
 return 0;
}

function getShakeLevelName(level){
 return [
  '弱い揺れ',
  '弱い揺れ',
  '中程度',
  '強い揺れ',
  '非常に強い揺れ'
 ][level]||'不明';
}

function getShakeLevelClass(level){
 return 'shake-level-'+level;
}

function getExpireSeconds(level){
 return SHAKE_PARAMS.EXPIRE_SECONDS[level]??20;
}

function getMergeDistance(level){
 return SHAKE_PARAMS.MERGE_DISTANCE[level]??90;
}

/* イベント生成 */
function createShakeEvent(time,st,expireSeconds){
 const event={
  id:shakeEngine.nextEventId++,
  createdAt:time,
  level:getShakeLevel(st.latestIntensity),
  confirmed:false,
  points:new Set()
 };

 event.points.add(st);

 st.event=event;
 st.eventedAt=time;

 st.eventedExpireAt=Math.max(
  st.eventedExpireAt,
  time+expireSeconds*1000
 );

 shakeEngine.events.push(event);

 return event;
}

/* イベントに観測点を追加 */
function addEventPoint(event,st,time,expireSeconds){
 const level=getShakeLevel(st.latestIntensity);

 /*
  * 1点だけでレベルを引き上げない。
  * 同レベル以上の観測点が既に存在する場合に限る。
  */
 if(
  event.level<level&&
  [...event.points].some(
   p=>getShakeLevel(p.latestIntensity)>=level
  )
 ){
  event.level=level;
 }

 st.eventedAt=time;

 st.eventedExpireAt=Math.max(
  st.eventedExpireAt,
  time+expireSeconds*1000
 );

 if(event.points.has(st)){
  return;
 }

 st.event=event;
 event.points.add(st);
}

/* イベント統合 */
function mergeShakeEvents(target,source){
 if(target===source)return;

 for(const st of source.points){
  st.event=target;
  target.points.add(st);
 }

 if(source.level>target.level){
  target.level=source.level;
 }

 shakeEngine.events=shakeEngine.events.filter(
  e=>e!==source
 );
}

/* イベント終了 */
function removeEventPoint(event,st){
 if(!event)return;

 if(!event.points.has(st))return;

 event.points.delete(st);

 st.event=null;
 st.eventedExpireAt=0;

 if(event.points.size===0){
  shakeEngine.events=shakeEngine.events.filter(
   e=>e!==event
  );
 }
}

/* イベントの確定判定 */
function updateEventConfirmation(event){
 if(event.confirmed)return;

 if(
  (
   event.level<=0&&
   event.points.size>
    SHAKE_PARAMS.WEAKER_CONFIRM_POINT_COUNT
  )||
  (
   event.level===1&&
   event.points.size>
    SHAKE_PARAMS.WEAK_CONFIRM_POINT_COUNT
  )||
  event.level>1
 ){
  event.confirmed=true;
 }
}

/* 2つのイベントが一定距離以内にあるか */
function checkEventsNearby(event1,event2,distance){
 for(const p1 of event1.points){
  for(const p2 of event2.points){
   if(distanceKm(p1,p2)<=distance){
    return true;
   }
  }
 }

 return false;
}

/* =========================================================
   メイン検知処理
========================================================= */

function processShakeEvents(time){
 if(!shakeEngine.initialized)return;

 /*
  * 異常値の排除と各観測点の検知
  */
 for(const point of stations){

  const latest=point.latestIntensity;

  /* ---------------------------------------------
     異常値の除外
  --------------------------------------------- */

  if(
   latest!==null&&
   point.intensityDiff<1&&
   point.event===null&&
   latest>=(point.hasNearPoints?3:5)&&
   Math.abs(point.intensityAverage-latest)<=1&&
   (
    point.isTmpDisabled||
    (
     point.nearPoints?.every(np=>
      latest-(np.point.latestIntensity??-3)>=3
     )??true
    )
   )
  ){
   point.isTmpDisabled=true;

  }else if(
   latest!==null&&
   point.isTmpDisabled
  ){
   point.isTmpDisabled=false;
  }

  if(point.isTmpDisabled){
   continue;
  }

  /* ---------------------------------------------
     検知終了判定
  --------------------------------------------- */

  if(
   point.intensityDiff<
   SHAKE_PARAMS.MIN_DETECTION_DIFF
  ){
   if(
    point.event&&
    (
     point.eventedAt>time||
     point.eventedExpireAt<time
    )
   ){
    const oldEvent=point.event;

    removeEventPoint(oldEvent,point);
   }

   continue;
  }

  if(
   point.nearPoints===null||
   latest===null
  ){
   continue;
  }

  /* ---------------------------------------------
     近傍観測点の有効重み
  --------------------------------------------- */

  let availableTotalWeight=0;

  for(const np of point.nearPoints){
   if(np.point.hasValidHistory){
    availableTotalWeight+=np.weight;
   }
  }

  /* ---------------------------------------------
     離島・孤立観測点
  --------------------------------------------- */

  if(
   availableTotalWeight<
   SHAKE_PARAMS.ISOLATED_THRESHOLD
  ){
   if(
    point.intensityDiff>=
     SHAKE_PARAMS.ISOLATED_DETECTION_DIFF&&
    point.event===null
   ){
    const level=getShakeLevel(latest);

    const event=createShakeEvent(
     time,
     point,
     getExpireSeconds(level)
    );

    event.confirmed=level>1;
   }

   continue;
  }

  /* ---------------------------------------------
     近傍観測点の検知スコア
  --------------------------------------------- */

  const events=[];

  if(point.event!==null){
   events.push(point.event);
  }

  let score=0;
  let penaltyScore=0;
  let contributingPointCount=0;

  for(const np of point.nearPoints){
   const neighbor=np.point;

   if(
    neighbor.isTmpDisabled||
    !neighbor.hasValidHistory
   ){
    continue;
   }

   if(
    neighbor.intensityDiff>=
    SHAKE_PARAMS.MIN_DETECTION_DIFF
   ){
    score+=
     np.weight*
     (
      neighbor.intensityDiff-
      SHAKE_PARAMS.SCORE_INTENSITY_OFFSET
     );

    contributingPointCount++;

    if(neighbor.event!==null){
     events.push(neighbor.event);
    }

   }else{
    penaltyScore+=
     np.weight*
     SHAKE_PARAMS.NO_CHANGE_PENALTY_FACTOR;
   }
  }

  const finalScore=score-penaltyScore;

  const threshold=
   availableTotalWeight*
   SHAKE_PARAMS.SCORE_THRESHOLD_RATIO;

  /*
   * 反応が1観測点だけなら単独ノイズとして扱う
   */
  if(contributingPointCount<=1){
   continue;
  }

  if(finalScore<threshold){
   continue;
  }

  /* ---------------------------------------------
     イベント作成・統合
  --------------------------------------------- */

  point.eventedAt=time;

  const uniqueEvents=[...new Set(events)];

  if(uniqueEvents.length>1){

   uniqueEvents.sort(
    (a,b)=>a.createdAt-b.createdAt
   );

   const firstEvent=uniqueEvents[0];

   for(let i=1;i<uniqueEvents.length;i++){
    mergeShakeEvents(
     firstEvent,
     uniqueEvents[i]
    );
   }

   if(point.event===firstEvent){
    continue;
   }

   if(point.event===null){
    addEventPoint(
     firstEvent,
     point,
     time,
     getExpireSeconds(
      getShakeLevel(point.latestIntensity)
     )
    );
   }

   updateEventConfirmation(firstEvent);

   continue;
  }

  if(uniqueEvents.length===1){
   const event=uniqueEvents[0];

   addEventPoint(
    event,
    point,
    time,
    getExpireSeconds(
     getShakeLevel(point.latestIntensity)
    )
   );

   updateEventConfirmation(event);

   continue;
  }

  if(point.event===null){
   const level=getShakeLevel(latest);

   const event=createShakeEvent(
    time,
    point,
    getExpireSeconds(level)
   );

   updateEventConfirmation(event);
  }
 }

 /* =====================================================
    イベント間の距離による統合
 ===================================================== */

 const orderedEvents=[
  ...shakeEngine.events
 ].sort(
  (a,b)=>a.createdAt-b.createdAt
 );

 for(const event of orderedEvents){

  if(!shakeEngine.events.includes(event)){
   continue;
  }

  const others=shakeEngine.events.filter(
   e=>e!==event&&event.createdAt<=e.createdAt
  );

  for(const other of others){

   if(!shakeEngine.events.includes(other)){
    continue;
   }

   const level=Math.max(
    event.level,
    other.level
   );

   const mergeDistance=getMergeDistance(level);

   if(
    checkEventsNearby(
     event,
     other,
     mergeDistance
    )
   ){
    mergeShakeEvents(event,other);
   }
  }
 }
}

/* =========================================================
   履歴リセット
========================================================= */

function resetShakeHistories(){
 for(const st of stations){
  st.history.fill(null);

  st.historyPosition=0;
  st.latestIntensity=null;
  st.intensityDiff=0;
  st.intensityAverage=0;

  st.event=null;
  st.eventedExpireAt=0;
 }

 shakeEngine.events=[];

 updateShakeUI();
 updateShakeMap();
}

/*
 * 画像の時刻が大きく飛んだ場合は履歴をリセット。
 * 古い履歴を使って誤検知することを防ぐ。
 */
function processShakeFrame(time){
 if(!shakeEngine.initialized)return;

 if(shakeEngine.lastFrameTime!==null){

  const gap=Math.abs(
   time-shakeEngine.lastFrameTime
  );

  if(
   gap>=SHAKE_PARAMS.HISTORY_RESET_GAP*1000
  ){
   console.warn(
    '地震検知履歴リセット: 時刻ジャンプ',
    gap
   );

   resetShakeHistories();
  }
 }

 shakeEngine.lastFrameTime=time;
 shakeEngine.processedFrames++;

 /*
  * 重要：
  * サーバーは差分フレームを送るため、
  * 変化がない観測点も含めて全観測点の履歴を更新する。
  */
 for(const st of stations){
  updateStationHistory(
   st,
   st.valid?st.intensity:null
  );
 }

 processShakeEvents(time);

 updateShakeUI();
 updateShakeMap();
}

/* =========================================================
   検知UI
========================================================= */

function updateShakeUI(){
 const confirmed=shakeEngine.events
  .filter(e=>e.confirmed)
  .sort((a,b)=>b.createdAt-a.createdAt);

 const count=confirmed.length;

 setText(
  $('shakeCount'),
  String(count)
 );

 const state=$('shakeState');

 state.classList.toggle(
  'active',
  count>0
 );

 setText(
  $('shakeStateText'),
  count>0?'地震検知中':'現在検知なし'
 );

 const list=$('shakeList');

 while(list.firstChild){
  list.removeChild(list.firstChild);
 }

 for(const event of confirmed.slice(0,5)){
  const item=document.createElement('div');
  item.className='shake-item';

  const name=document.createElement('span');
  name.className='shake-item-name';

  const region=event.points.size
   ?[...event.points][0].region
   :'';

  name.textContent=
   `${region||'観測点'} / ${event.points.size}地点`;

  const level=document.createElement('span');
  level.className=
   'shake-level '+
   getShakeLevelClass(event.level);

  level.textContent=getShakeLevelName(
   event.level
  );

  item.appendChild(name);
  item.appendChild(level);

  list.appendChild(item);
 }
}

/* =========================================================
   地震検知マーカー
========================================================= */

function updateShakeMap(){
 if(!map)return;

 const source=map.getSource('shake-events');

 if(!source)return;

 const features=[];

 for(const event of shakeEngine.events){
  if(!event.confirmed)continue;

  for(const st of event.points){
   features.push({
    type:'Feature',

    geometry:{
     type:'Point',
     coordinates:[st.lon,st.lat]
    },

    properties:{
     level:event.level,
     eventId:event.id
    }
   });
  }
 }

 source.setData({
  type:'FeatureCollection',
  features
 });
}

/* =========================================================
   観測点準備
========================================================= */

function prepareStations(width,height){
 if(
  stations.length&&
  lastImageWidth===width&&
  lastImageHeight===height
 ){
  return;
 }

 lastImageWidth=width;
 lastImageHeight=height;

 stations=preparedPoints
  .filter(p=>
   p.x>=0&&
   p.y>=0&&
   p.x<width&&
   p.y<height
  )
  .map((p,i)=>({
   i,

   geom:{
    type:'Point',
    coordinates:[p.lon,p.lat]
   },

   name:p.name,
   region:p.region,
   code:p.code,

   x:p.x,
   y:p.y,

   lat:p.lat,
   lon:p.lon,

   r:0,
   g:0,
   b:0,

   hex:'#000000',

   position:null,
   intensity:null,
   valid:false,

   history:null,
   historyPosition:0,
   latestIntensity:null,
   intensityDiff:0,
   intensityAverage:0,

   hasValidHistory:false,
   hasNearPoints:false,
   nearPoints:null,
   totalNearPointWeight:0,

   isTmpDisabled:false,

   event:null,
   eventedAt:0,
   eventedExpireAt:0
  }));

 setupNearPoints();

 forceUpdate=true;
}

/* =========================================================
   バイナリフレーム処理
========================================================= */

function applyFrame(buf){
 const started=performance.now();

 if(buf.byteLength<22)return;

 const dv=new DataView(buf);

 if(dv.getUint8(0)!==1)return;

 const ms=dv.getFloat64(1,true);

 if(
  lastAppliedImageMs!==null&&
  ms<=lastAppliedImageMs
 ){
  return;
 }

 const w=dv.getUint16(9,true);
 const h=dv.getUint16(11,true);
 const flags=dv.getUint8(13);
 const total=dv.getUint16(14,true);
 const count=dv.getUint16(16,true);
 const serverMs=dv.getUint16(18,true);
 const clients=dv.getUint16(20,true);

 if(buf.byteLength!==22+count*6){
  console.error(
   'フレーム長が不正です',
   buf.byteLength,
   count
  );

  return;
 }

 wsStats.clients=clients;

 prepareStations(w,h);

 if(stations.length!==total){
  console.error(
   '観測点数がサーバーと一致しません',
   total,
   stations.length
  );

  return;
 }

 setText($('imageSize'),`${w} × ${h}px`);

 let changed=forceUpdate;

 /*
  * フルフレームの場合は全観測点を一度無効化する。
  */
 if(flags&1){
  for(const st of stations){
   st.valid=false;
   st.position=null;
   st.intensity=null;
  }

  changed=true;
 }

 let o=22;

 for(let k=0;k<count;k++,o+=6){
  const i=dv.getUint16(o,true);
  const st=stations[i];

  if(!st)continue;

  changed=true;

  if(!dv.getUint8(o+2)){
   st.valid=false;
   st.position=null;
   st.intensity=null;

   continue;
  }

  const r=dv.getUint8(o+3);
  const g=dv.getUint8(o+4);
  const b=dv.getUint8(o+5);

  st.r=r;
  st.g=g;
  st.b=b;

  const position=colorToPosition(
   rgbToHSV(r,g,b)
  );

  if(position===null){
   st.valid=false;
   st.position=null;
   st.intensity=null;

   continue;
  }

  st.hex='#'+HEX[r]+HEX[g]+HEX[b];

  st.position=position;

  st.intensity=scaleToIntensity(position);

  st.valid=true;
 }

 /*
  * 差分がない観測点も含めて検知処理を行う。
  */
 processShakeFrame(ms);

 let shown=0;

 for(const st of stations){
  if(st.valid)shown++;
 }

 setText(
  $('shown'),
  shown.toLocaleString()
 );

 if(changed&&map){
  const source=map.getSource('stations');

  if(source){
   const features=[];

   for(const st of stations){
    if(!st.valid)continue;

    features.push({
     type:'Feature',

     geometry:st.geom,

     properties:{
      i:st.i,
      hex:st.hex
     }
    });
   }

   source.setData({
    type:'FeatureCollection',
    features
   });

   forceUpdate=false;
  }
 }

 if(firstFit&&shown){
  firstFit=false;
  fitAll();
 }

 setText($('imgTime'),formatJST(ms));

 lastAppliedImageMs=ms;

 lastImageCompletedPerf=performance.now();
}

/* =========================================================
   MapLibre
========================================================= */

function addSourceAndLayer(){
 if(!map.getSource('stations')){
  map.addSource('stations',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('station-points')){
  map.addLayer({
   id:'station-points',
   type:'circle',
   source:'stations',

   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,1.55,
     5,3.0,
     8,4.0,
     11,4.85
    ],

    'circle-color':['get','hex'],

    'circle-stroke-color':'#ffffff',
    'circle-stroke-width':0.25,

    'circle-opacity':1
   }
  });
 }

 /*
  * 地震検知観測点用レイヤー
  */
 if(!map.getSource('shake-events')){
  map.addSource('shake-events',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('shake-event-points')){
  map.addLayer({
   id:'shake-event-points',
   type:'circle',
   source:'shake-events',

   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,4,
     5,6,
     8,8,
     11,10
    ],

    'circle-color':[
     'match',
     ['get','level'],
     0,'#94a3b8',
     1,'#3b82f6',
     2,'#eab308',
     3,'#f97316',
     4,'#dc2626',
     '#64748b'
    ],

    'circle-stroke-color':'#ffffff',
    'circle-stroke-width':1.5,

    'circle-opacity':0.95
   }
  });
 }

 updateShakeMap();
}

function fitAll(){
 if(!map)return;

 const bounds=new maplibregl.LngLatBounds();

 let hasValidPoint=false;

 for(const st of stations){
  if(
   !st.geom||
   !Array.isArray(st.geom.coordinates)
  ){
   continue;
  }

  const [lon,lat]=st.geom.coordinates;

  if(
   !Number.isFinite(lon)||
   !Number.isFinite(lat)
  ){
   continue;
  }

  bounds.extend([lon,lat]);

  hasValidPoint=true;
 }

 const options={
  padding:MAP_PADDING,
  maxZoom:5.2,
  bearing:0,
  pitch:0,
  duration:700
 };

 if(hasValidPoint){
  map.fitBounds(bounds,options);
 }else{
  map.fitBounds(JAPAN_BOUNDS,options);
 }
}

$('resetMapButton').addEventListener('click',()=>{
 fitAll();
});

map=new maplibregl.Map({
 container:'map',

 style:'https://tiles.openfreemap.org/styles/positron',

 center:INITIAL_CENTER,
 zoom:INITIAL_ZOOM,
 bearing:0,
 pitch:0,

 attributionControl:{
  customAttribution:
   '<a href="https://www.kyoshin.bosai.go.jp/ja/about_kmoni/" target="_blank" rel="noopener noreferrer">防災科学技術研究所（NIED）</a>'
 }
});

map.on('error',e=>{
 console.error('MapLibre:',e.error||e);
});

/* =========================================================
   ページ状態管理
========================================================= */

document.addEventListener(
 'visibilitychange',
 ()=>{
  if(document.hidden){
   clearTimeout(hiddenTimer);

   hiddenTimer=setTimeout(()=>{
    wsWanted=false;

    clearTimeout(wsReconnectTimer);

    if(ws){
     try{
      ws.close(1000,'hidden');
     }catch(_){}
    }
   },HIDDEN_DISCONNECT);

  }else{
   clearTimeout(hiddenTimer);

   wsWanted=true;

   connectStream();
  }
 }
);

window.addEventListener(
 'pageshow',
 ()=>{
  wsWanted=true;
  connectStream();
 }
);

map.on('load',()=>{
 addSourceAndLayer();

 fitAll();

 maintainClock();

 tickSyncTime();

 connectStream();
});
