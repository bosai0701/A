<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>LAN Chat</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f5f7;
    color:#111;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:min(760px,100%);
    height:min(900px,100%);
    background:white;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

header{
    padding:18px 20px;
    border-bottom:1px solid #ddd;
    background:white;
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:21px;
    font-weight:700;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:#777;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#aaa;
}

.status-dot.online{
    background:#34c759;
}

.setup{
    padding:16px;
    border-bottom:1px solid #ddd;
    background:#fafafa;
}

.setup h2{
    font-size:15px;
    margin:0 0 10px;
}

textarea{
    width:100%;
    min-height:80px;
    resize:vertical;
    border:1px solid #ccc;
    border-radius:10px;
    padding:10px;
    font-family:monospace;
    font-size:12px;
    background:white;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:8px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    background:#007aff;
    color:white;
}

button.secondary{
    background:#e9e9ee;
    color:#222;
}

button.danger{
    background:#ff3b30;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:9px;
    background:#f5f5f7;
}

.empty{
    margin:auto;
    color:#999;
    text-align:center;
    font-size:14px;
}

.message{
    max-width:78%;
    padding:10px 13px;
    border-radius:17px;
    line-height:1.45;
    word-break:break-word;
    white-space:pre-wrap;
}

.message.me{
    align-self:flex-end;
    background:#007aff;
    color:white;
    border-bottom-right-radius:5px;
}

.message.other{
    align-self:flex-start;
    background:white;
    color:#111;
    border-bottom-left-radius:5px;
}

.message-time{
    display:block;
    font-size:10px;
    opacity:.55;
    margin-top:3px;
}

.input-area{
    padding:12px;
    border-top:1px solid #ddd;
    background:white;
    display:flex;
    gap:8px;
}

#messageInput{
    flex:1;
    min-height:44px;
    max-height:120px;
    resize:none;
    border:1px solid #ccc;
    border-radius:22px;
    padding:11px 16px;
    outline:none;
    font-size:15px;
}

#sendButton{
    width:72px;
    border-radius:22px;
}

@media(max-width:600px){
    .app{
        height:100%;
    }

    .setup{
        padding:12px;
    }

    .chat{
        padding:12px;
    }
}
</style>

</head>

<body>

<div class="app">

<header>
    <div class="header-row">
        <div class="title">LAN Chat</div>

```
    <div class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">未接続</span>
    </div>
</div>
```

</header>

<section class="setup">

```
<h2>接続</h2>

<textarea
    id="signalBox"
    placeholder="ここに接続コードを貼り付けます"></textarea>

<div class="buttons">

    <button id="createButton">
        接続コードを作成
    </button>

    <button id="applyButton" class="secondary">
        相手のコードを適用
    </button>

    <button id="copyButton" class="secondary">
        コピー
    </button>

    <button id="clearButton" class="danger">
        切断
    </button>

</div>
```

</section>

<main id="chat" class="chat">

```
<div id="empty" class="empty">
    相手と接続すると、ここでトークできます
</div>
```

</main>

<div class="input-area">

```
<textarea
    id="messageInput"
    placeholder="メッセージを入力..."
    disabled></textarea>

<button id="sendButton" disabled>
    送信
</button>
```

</div>

</div>

<script>

"use strict";

/*
    ==========================================
    LAN Chat
    WebRTC DataChannel
    ==========================================

    このHTMLはサーバーを必要としません。

    A:
      1. 「接続コードを作成」
      2. 表示されたコードをBへ渡す

    B:
      1. Aのコードを貼り付け
      2. 「相手のコードを適用」
      3. B側に表示された返答コードをAへ渡す

    A:
      1. Bの返答コードを貼り付け
      2. 「相手のコードを適用」

    接続完了。
*/

const signalBox =
    document.getElementById("signalBox");

const createButton =
    document.getElementById("createButton");

const applyButton =
    document.getElementById("applyButton");

const copyButton =
    document.getElementById("copyButton");

const clearButton =
    document.getElementById("clearButton");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const chat =
    document.getElementById("chat");

const empty =
    document.getElementById("empty");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

let peer = null;
let channel = null;


/* =========================
   状態表示
========================= */

function setStatus(text, online=false){

    statusText.textContent = text;

    if(online){
        statusDot.classList.add("online");
    }else{
        statusDot.classList.remove("online");
    }
}


/* =========================
   メッセージ表示
========================= */

function addMessage(text, mine){

    if(empty){
        empty.remove();
    }

    const div =
        document.createElement("div");

    div.className =
        "message " + (mine ? "me" : "other");

    const content =
        document.createElement("div");

    content.textContent = text;

    const time =
        document.createElement("span");

    time.className = "message-time";

    time.textContent =
        new Date().toLocaleTimeString(
            "ja-JP",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    div.appendChild(content);
    div.appendChild(time);

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   DataChannel
========================= */

function setupChannel(dc){

    channel = dc;

    channel.onopen = () => {

        setStatus("接続済み", true);

        messageInput.disabled = false;
        sendButton.disabled = false;

        addMessage(
            "接続しました。",
            false
        );
    };

    channel.onclose = () => {

        setStatus("切断");

        messageInput.disabled = true;
        sendButton.disabled = true;
    };

    channel.onerror = () => {

        setStatus("通信エラー");
    };

    channel.onmessage = event => {

        addMessage(
            event.data,
            false
        );
    };
}


/* =========================
   PeerConnection
========================= */

function createPeer(){

    peer =
        new RTCPeerConnection({
            iceServers: []
        });

    peer.onconnectionstatechange = () => {

        const state =
            peer.connectionState;

        if(state === "connected"){

            setStatus(
                "接続済み",
                true
            );

        }else if(
            state === "disconnected" ||
            state === "failed" ||
            state === "closed"
        ){

            setStatus("未接続");

            messageInput.disabled = true;
            sendButton.disabled = true;
        }
    };

    return peer;
}


/* =========================
   ICE待機
========================= */

function waitForICE(){

    return new Promise(resolve => {

        if(!peer){
            resolve();
            return;
        }

        if(
            peer.iceGatheringState ===
            "complete"
        ){

            resolve();
            return;
        }

        const check = () => {

            if(
                peer.iceGatheringState ===
                "complete"
            ){

                peer.removeEventListener(
                    "icegatheringstatechange",
                    check
                );

                resolve();
            }
        };

        peer.addEventListener(
            "icegatheringstatechange",
            check
        );

        setTimeout(
            resolve,
            5000
        );
    });
}


/* =========================
   接続コード作成
========================= */

createButton.onclick =
async () => {

    try{

        createButton.disabled = true;

        peer = createPeer();

        const dc =
            peer.createDataChannel(
                "chat",
                {
                    ordered:true
                }
            );

        setupChannel(dc);

        const offer =
            await peer.createOffer();

        await peer.setLocalDescription(
            offer
        );

        await waitForICE();

        const data = {
            type:"offer",
            sdp:peer.localDescription
        };

        signalBox.value =
            JSON.stringify(data);

        setStatus(
            "相手の返答待ち"
        );

    }catch(error){

        console.error(error);

        alert(
            "接続コードの作成に失敗しました。\n" +
            error.message
        );

        reset();

    }finally{

        createButton.disabled = false;
    }
};


/* =========================
   相手コード適用
========================= */

applyButton.onclick =
async () => {

    try{

        const text =
            signalBox.value.trim();

        if(!text){

            alert(
                "接続コードを貼り付けてください。"
            );

            return;
        }

        const data =
            JSON.parse(text);

        /*
            相手からOfferを受け取った
        */

        if(data.type === "offer"){

            reset(false);

            peer = createPeer();

            peer.ondatachannel = event => {

                setupChannel(
                    event.channel
                );
            };

            await peer.setRemoteDescription(
                data.sdp
            );

            const answer =
                await peer.createAnswer();

            await peer.setLocalDescription(
                answer
            );

            await waitForICE();

            const response = {
                type:"answer",
                sdp:peer.localDescription
            };

            signalBox.value =
                JSON.stringify(response);

            setStatus(
                "返答コードを相手へ送信"
            );

            alert(
                "返答コードを相手に渡してください。"
            );

            return;
        }

        /*
            相手からAnswerを受け取った
        */

        if(data.type === "answer"){

            if(!peer){

                alert(
                    "先に「接続コードを作成」してください。"
                );

                return;
            }

            await peer.setRemoteDescription(
                data.sdp
            );

            setStatus(
                "接続中..."
            );

            return;
        }

        alert(
            "正しい接続コードではありません。"
        );

    }catch(error){

        console.error(error);

        alert(
            "接続に失敗しました。\n" +
            error.message
        );
    }
};


/* =========================
   コピー
========================= */

copyButton.onclick =
async () => {

    const text =
        signalBox.value;

    if(!text){

        alert(
            "コピーするコードがありません。"
        );

        return;
    }

    try{

        await navigator.clipboard.writeText(
            text
        );

        copyButton.textContent =
            "コピーしました";

        setTimeout(() => {

            copyButton.textContent =
                "コピー";

        },1500);

    }catch{

        signalBox.select();

        document.execCommand(
            "copy"
        );
    }
};


/* =========================
   送信
========================= */

function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text){
        return;
    }

    if(
        !channel ||
        channel.readyState !== "open"
    ){

        alert(
            "まだ相手と接続されていません。"
        );

        return;
    }

    channel.send(text);

    addMessage(
        text,
        true
    );

    messageInput.value = "";

    messageInput.focus();
}


sendButton.onclick =
sendMessage;


/* =========================
   Enter送信
========================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================
   リセット
========================= */

function reset(clear=true){

    try{

        if(channel){
            channel.close();
        }

        if(peer){
            peer.close();
        }

    }catch{}

    channel = null;
    peer = null;

    messageInput.disabled = true;
    sendButton.disabled = true;

    setStatus("未接続");

    if(clear){
        signalBox.value = "";
    }
}


/* =========================
   切断
========================= */

clearButton.onclick = () => {

    reset(true);

    alert(
        "接続を切断しました。"
    );
};


/* 初期状態 */

setStatus("未接続");

</script>

</body>
</html>
