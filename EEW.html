<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f0f0f">
<title>JMA EEW | Earthquake Monitor</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js" defer></script>
<style>
:root{color-scheme:dark;--red:#c4121a;--ink:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f0f0f;color:var(--ink);font:14px "Noto Sans JP",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
#earthquakeMap{position:fixed;inset:0;background:#0f0f0f}
#mapMain{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9px!important;background:#000a!important;color:#aaa!important}
.maplibregl-ctrl-attrib a{color:#8ab4f8!important}
.box{position:absolute;background:#000;z-index:5;pointer-events:none}
.box:before,.box:after{content:"";position:absolute;inset:0;pointer-events:none;
 background:
 linear-gradient(#fff,#fff) 0 0/5px 5px no-repeat,
 linear-gradient(#fff,#fff) 100% 0/5px 5px no-repeat,
 linear-gradient(#fff,#fff) 0 100%/5px 5px no-repeat,
 linear-gradient(#fff,#fff) 100% 100%/5px 5px no-repeat}
.box{border:1px solid #fff5}
#title{left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));padding:8px 18px 8px 14px;max-width:calc(100% - 20px)}
#title h1{margin:0;font-size:clamp(20px,3.4vw,44px);font-weight:900;letter-spacing:.02em;line-height:1.2}
#title p{margin:2px 0 0;font-size:clamp(13px,1.7vw,24px);letter-spacing:.04em}
#info{right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:clamp(210px,24vw,330px);padding:12px 14px 14px}
#info .hd{display:flex;gap:8px;align-items:center;padding:0 4px 8px;border-bottom:1px solid #fff4;margin-bottom:10px}
#info .hd b{font-size:clamp(14px,1.5vw,20px);font-weight:500}
.tg{font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;background:#e0a100;color:#000}
.tg.f{background:#2f9e6e;color:#fff}
.hidden{display:none!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:5px solid var(--red);padding:2px 0 2px 10px;margin-bottom:10px;min-height:44px}
.row .l{line-height:1.15;font-size:clamp(14px,1.5vw,20px);font-weight:700}
.row .l small{display:block;font-size:clamp(10px,1.1vw,15px);font-weight:400;opacity:.9}
.row .v{font-size:clamp(26px,3.3vw,46px);font-weight:800;line-height:1;text-align:right}
.row .v small{font-size:clamp(11px,1.2vw,17px);font-weight:500;margin-left:3px}
.row.hy{display:block}
.row.hy .v{font-size:clamp(15px,1.7vw,24px);font-weight:700;margin-top:4px}
#legend{right:max(10px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));display:flex;gap:14px;padding:6px 12px;font-size:clamp(11px,1.3vw,18px);font-weight:700;white-space:nowrap}
#legend i{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:5px;vertical-align:-1px}
#status{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:60vw}
.chip{display:flex;align-items:center;gap:8px;background:#000c;border:1px solid #fff3;border-radius:99px;padding:6px 11px;font-size:11px;color:#ddd}
.dot{width:8px;height:8px;border-radius:50%;background:#777}
.dot.online{background:#2fd49a}.dot.error{background:#ff4058}
.chip button{background:#fff2;color:#fff;border:0;border-radius:6px;padding:3px 8px;font-size:11px}
#eventTabs{display:flex;flex-wrap:wrap;gap:6px}
.event-tab{background:#000c;color:#ddd;border:1px solid #fff3;border-radius:6px;padding:5px 9px;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-tab.active{border-color:#ff4058;color:#fff;background:#c4121a66}
.event-tab.done{opacity:.65}
.map-loading{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0f0f0f;color:#ddd;font-size:12px}
.map-loading .sp{width:34px;height:34px;border:3px solid #333;border-top-color:#4aa3ff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.epicenter-icon{color:#ffd43b;-webkit-text-stroke:1.6px #d4202a;font:900 38px/34px Arial,sans-serif;width:38px;height:34px;display:flex;align-items:center;justify-content:center;user-select:none}
.epicenter-icon.plum{font-size:0;-webkit-text-stroke:0}
.epicenter-icon.plum:before{content:"";width:22px;height:22px;border:2.5px solid #ffd43b;border-radius:50%;box-shadow:0 0 0 2px #d4202a}
.maplibregl-popup-content{background:#111;color:#eee;font-size:12px;border:1px solid #444}
.maplibregl-popup-tip{border-top-color:#111!important;border-bottom-color:#111!important}
@media(max-width:600px){#legend{gap:8px;padding:5px 8px}#status{bottom:calc(max(24px,env(safe-area-inset-bottom)) + 34px)}}
</style>
</head>
<body>
<div id="earthquakeMap" aria-label="P波・S波到達予想マップ">
 <div id="mapMain"></div>
 <div id="title" class="box"><h1 id="ttl">緊急地震速報 待機中</h1><p id="ttlSub">--</p></div>
 <div id="info" class="box">
  <div class="hd"><b id="serial">--</b><span id="trainingTag" class="tg hidden">訓練報</span><span id="finalTag" class="tg f hidden">最終報</span></div>
  <div class="row hy"><div class="l">震源地 <small style="display:inline;margin-left:4px">Epicenter</small></div><div class="v" id="hypocenter">--</div></div>
  <div class="row"><div class="l">予想最大震度<small>Max Intensity</small></div><div class="v" id="maxIntensity">--</div></div>
  <div class="row"><div class="l">規模<small>Magnitude</small></div><div class="v" id="magnitude">--</div></div>
  <div class="row" style="margin-bottom:0"><div class="l">深さ<small>Depth</small></div><div class="v" id="depth">--</div></div>
 </div>
 <div id="legend" class="box"><span><i style="background:#6fa8dc"></i>震度1</span><span><i style="background:#4caf7d"></i>震度2</span><span><i style="background:#e6c12b"></i>震度3</span><span><i style="background:#d9814a"></i>震度4</span><span><i style="background:#c4121a"></i>警報</span></div>
 <div id="status">
  <div id="eventTabs" class="hidden"></div>
  <div class="chip"><span id="dot" class="dot"></span><span id="connectionText">接続準備中</span><span id="latency">未測定</span><button id="reconnectBtn" type="button">再接続</button></div>
 </div>
 <div id="mapLoading" class="map-loading" role="status"><div class="sp"></div><div id="mapLoadingStatus">地図データと走時表を読み込んでいます…</div></div>
</div>
<script>
document.addEventListener("DOMContentLoaded",()=>{
"use strict";
const WS_URL="wss://ws-api.wolfx.jp/jma_eew",COMMAND="query_jmaeew";
const TRAVEL_TABLE_URL="./tjma2001.csv";
const MAP_STYLE="https://tiles.openfreemap.org/styles/positron";
const PING_INTERVAL=5000,PING_TIMEOUT=10000,SILENCE_LIMIT=20000;
const RECONNECT_MIN=500,RECONNECT_MAX=10000,ROTATE_MS=4000;
const EVENT_TTL=10*60000,EVENT_KEEP=60*60000,FINAL_HIDE_MS=3*60000,CANCEL_HIDE_MS=20000;
const EARTH_RADIUS_KM=6371.0088,USER_HOLD_MS=5000,WAVE_MAX_KM=2000,MAX_ZOOM=7,FINAL_VIEW_ZOOM=5;
const WAVE_FRAME_MS=1000/20,WAVE_CIRCLE_POINTS=96,CLOCK_SYNC_INTERVAL=30*60000;
const JAPAN_BOUNDS=[[122.8,23.8],[146.0,45.8]];
const JAPAN_EDGE_POINTS=[[45.5228,141.9367],[24.0456,123.7767],[24.4494,122.9333],[41.5575,140.9078],[34.7054,135.49],[31,130],[26.2125,127.6811]];
const $=id=>document.getElementById(id);

let clockOffset=0;
function nowMs(){return Date.now()+clockOffset;}
async function syncClock(){
 if(location.protocol!=="http:"&&location.protocol!=="https:")return;
 const samples=[];
 for(let i=0;i<5;i++){
  try{
   const t0=Date.now();
   const r=await fetch(location.pathname+"?_t="+t0+"_"+i,{method:"HEAD",cache:"no-store"});
   const t1=Date.now(),header=r.headers.get("Date");
   let d=header?Date.parse(header):NaN;
   if(Number.isFinite(d)&&t1-t0<2000){d+=(Number(r.headers.get("Age"))||0)*1000;samples.push(d+500-(t0+t1)/2);}
  }catch{}
  await new Promise(res=>setTimeout(res,230+Math.random()*340));
 }
 if(samples.length<3)return;
 samples.sort((a,b)=>a-b);
 const median=samples[samples.length>>1];
 clockOffset=Math.abs(median)<1000?0:Math.round(median);
}

let socket=null,reconnectTimer=null,reconnectDelay=RECONNECT_MIN,stopped=false;
let lastMessageAt=0,pingTimer=null,pingSentAt=0,pingPending=false,watchdogTimer=null,pingMissed=0;
const events=new Map();
let currentKey=null,rotateTimer=null,shownAt=0;

const map=new maplibregl.Map({
 container:"mapMain",style:MAP_STYLE,center:[135,35.5],zoom:4.2,minZoom:1,maxZoom:18,
 pixelRatio:Math.min(window.devicePixelRatio||1,window.innerWidth>850?1.5:2),
 canvasContextAttributes:{antialias:false},attributionControl:true,fadeDuration:0,
 maxTileCacheSize:128,maxTileCacheZoomLevels:2,refreshExpiredTiles:false,
 localIdeographFontFamily:"sans-serif",renderWorldCopies:false
});
map.addControl(new maplibregl.NavigationControl(),"top-right");
/* 右上の情報パネルと重ならない位置にズーム操作を置く */
const navEl=document.querySelector(".maplibregl-ctrl-top-right");
if(navEl){navEl.style.top="auto";navEl.style.bottom="90px";}

let mapReady=false,tableLoaded=false,tableSettled=false,startupComplete=false;
let travelTable=[],depthList=[],currentOrigin=null,currentOriginTime=null,lastMapEventKey=null;
let mapUpdateRaf=null,lastWaveFrameAt=0;
let epicenterMarker=null,epicenterPopup=null;
let finalAnnouncedTime=null,finalAnnouncedEventId=null,pWavePassedJapan=false,sWavePassedJapan=false;
let waveDisplayFinished=false,finalMapViewApplied=false,currentIsPlum=false;
let lastPRadius=null,lastSRadius=null,lastFitR=null,lastFitAt=0,lastWaveSig="",wavesEmpty=false;
let userUntil=0,userTimer=null,autoTarget=null,pendingCam=false,japanDistanceKey="",japanDistanceValue=0;
const waveCache=new Map();
const tablePromise=loadTravelTable();

const emptyFC=()=>({type:"FeatureCollection",features:[]});
const userBusy=()=>Date.now()<userUntil;

/* 手動操作中は自動カメラを止め、5秒後に自動表示へ戻す */
function touchUser(e){
 if(!e||!e.originalEvent)return;
 userUntil=Date.now()+USER_HOLD_MS;
 clearTimeout(userTimer);
 userTimer=setTimeout(()=>{
  userUntil=0;
  if(autoTarget)map.easeTo({...autoTarget,duration:800,essential:true});
  pendingCam=false;lastFitR=null;applyCamera(false,true);
 },USER_HOLD_MS);
}
map.on("movestart",touchUser);map.on("moveend",touchUser);

function mercatorY(lat){
 const l=Math.max(-85.05,Math.min(85.05,lat))*Math.PI/180;
 return Math.log(Math.tan(l/2+Math.PI/4));
}
/* 震源が画面中央に来るよう、震源を中心に対称な範囲へ広げる */
function symmetricBounds(b,c){
 const cy=mercatorY(c[1]);
 const dLon=Math.min(179,Math.max(b.getEast()-c[0],c[0]-b.getWest()));
 const dy=Math.max(mercatorY(b.getNorth())-cy,cy-mercatorY(b.getSouth()));
 const toLat=y=>(2*Math.atan(Math.exp(y))-Math.PI/2)*180/Math.PI;
 return new maplibregl.LngLatBounds([c[0]-dLon,toLat(cy-dy)],[c[0]+dLon,toLat(cy+dy)]);
}
function fitBounds(bounds,pad,immediate,center){
 if(!mapReady)return false;
 if(userBusy()){pendingCam=true;return false;}
 if(center)bounds=symmetricBounds(bounds,center);
 const cam=map.cameraForBounds(bounds,{padding:pad,maxZoom:MAX_ZOOM});
 if(!cam)return false;
 const c=cam.center.toArray?cam.center.toArray():cam.center;
 const view={center:c,zoom:Math.min(MAX_ZOOM,cam.zoom),bearing:0,pitch:0};
 autoTarget=view;map.stop();
 if(immediate)map.jumpTo(view);else map.easeTo({...view,duration:550,essential:true});
 pendingCam=false;lastFitAt=Date.now();return true;
}
function padFor(){
 const c=map.getContainer();
 return Math.max(30,Math.min(70,Math.round(Math.min(c.clientWidth,c.clientHeight)*.11)));
}
function fitJapan(immediate){
 const b=new maplibregl.LngLatBounds(JAPAN_BOUNDS[0],JAPAN_BOUNDS[1]);
 if(currentOrigin)b.extend([currentOrigin.lon,currentOrigin.lat]);
 return fitBounds(b,35,immediate,currentOrigin?[currentOrigin.lon,currentOrigin.lat]:null);
}
function fitWave(radiusKm,immediate){
 if(!currentOrigin||!(radiusKm>0)||sWavePassedJapan||waveDisplayFinished)return false;
 const b=new maplibregl.LngLatBounds(),r=Math.max(radiusKm*1.4+40,60);
 for(let i=0;i<360;i+=5)b.extend(destinationPoint(currentOrigin.lat,currentOrigin.lon,r,i));
 b.extend([currentOrigin.lon,currentOrigin.lat]);
 const ok=fitBounds(b,padFor(),immediate,[currentOrigin.lon,currentOrigin.lat]);
 if(ok)lastFitR=r;
 return ok;
}
function applyFinalView(immediate){
 if(!mapReady||!currentOrigin||finalMapViewApplied)return false;
 if(userBusy()){pendingCam=true;return false;}
 const view={center:[currentOrigin.lon,currentOrigin.lat],zoom:FINAL_VIEW_ZOOM,bearing:0,pitch:0};
 autoTarget=view;map.stop();
 if(immediate)map.jumpTo(view);else map.easeTo({...view,duration:650,essential:true});
 finalMapViewApplied=true;pendingCam=false;return true;
}
function applyCamera(immediate,force){
 if(!mapReady||userBusy())return false;
 if(waveDisplayFinished&&currentOrigin)return applyFinalView(immediate);
 if(currentOrigin&&currentOriginTime!==null){
  const radii=[pWavePassedJapan?null:lastPRadius,lastSRadius].filter(v=>Number.isFinite(v)&&v>0&&v<=WAVE_MAX_KM);
  return radii.length?fitWave(Math.max(...radii),immediate):fitJapan(immediate);
 }
 return fitJapan(immediate);
}

/* 暗色の地図にする（OpenFreeMap positron を塗り替え） */
function darkenStyle(){
 for(const l of map.getStyle().layers){
  try{
   const water=/water|ocean|sea/i.test(l.id);
   if(l.type==="background")map.setPaintProperty(l.id,"background-color","#0f0f0f");
   else if(l.type==="fill")map.setPaintProperty(l.id,"fill-color",water?"#0f0f0f":"#262626");
   else if(l.type==="line")map.setPaintProperty(l.id,"line-color",water?"#0f0f0f":"#3a3a3a");
   else if(l.type==="symbol"){map.setPaintProperty(l.id,"text-color","#e8e8e8");map.setPaintProperty(l.id,"text-halo-color","#000");}
  }catch{}
 }
}
function addWaveLayers(){
 const o={type:"geojson",data:emptyFC(),buffer:64,tolerance:0.5,maxzoom:10};
 if(!map.getSource("wave-p"))map.addSource("wave-p",o);
 if(!map.getSource("wave-s"))map.addSource("wave-s",{...o,data:emptyFC()});
 if(!map.getLayer("wave-s-fill"))map.addLayer({id:"wave-s-fill",type:"fill",source:"wave-s",paint:{"fill-color":"#ff5a5a","fill-opacity":.14}});
 if(!map.getLayer("wave-s-line"))map.addLayer({id:"wave-s-line",type:"line",source:"wave-s",paint:{"line-color":"#ff6f6f","line-width":2.5,"line-opacity":.95}});
 if(!map.getLayer("wave-p-line"))map.addLayer({id:"wave-p-line",type:"line",source:"wave-p",paint:{"line-color":"#6fb1f0","line-width":2.5,"line-opacity":.95}});
}
function ensureWaveLayers(){
 if(!mapReady)return false;
 try{if(!(map.getSource("wave-p")&&map.getSource("wave-s")&&map.getLayer("wave-p-line")&&map.getLayer("wave-s-line")))addWaveLayers();return true;}catch{return false;}
}
function finishMapStartup(){
 if(startupComplete||!mapReady||!tableSettled)return;
 startupComplete=true;
 requestAnimationFrame(()=>{
  map.resize();
  if(currentOrigin){
   updateEpicenterMarker();updateWaveMap();
   if(waveDisplayFinished)applyFinalView(true);else applyCamera(true);
  }else fitJapan(true);
  requestAnimationFrame(()=>{map.resize();$("mapLoading").classList.add("hidden");});
 });
}
map.on("style.load",()=>{
 darkenStyle();
 if(!mapReady){
  mapReady=true;addWaveLayers();
  $("mapLoadingStatus").textContent="地図タイルを取得しています…";
  tablePromise.finally(()=>{tableSettled=true;finishMapStartup();});
 }else{ensureWaveLayers();lastWaveSig="";updateWaveMap();}
});
map.getCanvas().addEventListener("webglcontextrestored",()=>{ensureWaveLayers();lastWaveSig="";updateWaveMap();map.triggerRepaint();});
map.on("error",e=>{if(e&&e.error)console.warn("MapLibre:",e.error);});
if(typeof ResizeObserver!=="undefined")new ResizeObserver(()=>{if(mapReady)map.resize();}).observe($("earthquakeMap"));

function text(id,value){const el=$(id);if(!el)return;el.textContent=value===null||value===undefined||value===""?"--":String(value);}
function connState(label,state){text("connectionText",label);$("dot").className="dot "+state;}
function formatMagnitude(v){if(v===null||v===undefined||v==="")return "--";const n=Number(v);return Number.isFinite(n)?n.toFixed(1):String(v);}
function isValidCoordinate(lat,lon){return Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180;}
/* 気象庁・WolfxはJST。タイムゾーン表記が無ければ +09:00 を付ける */
function parseOriginTime(value){
 if(!value||typeof value!=="string")return null;
 let s=value.trim().replace(/\//g,"-").replace(" ","T");
 if(!/(Z|[+-]\d{2}:?\d{2})$/i.test(s))s+="+09:00";
 const ms=Date.parse(s);return Number.isFinite(ms)?ms:null;
}
function getEventOrigin(d){
 if(d.Latitude==null||d.Latitude===""||d.Longitude==null||d.Longitude==="")return null;
 const lat=Number(d.Latitude),lon=Number(d.Longitude);
 if(!isValidCoordinate(lat,lon))return null;
 const dep=Number(d.Depth);
 return {lat,lon,depth:Number.isFinite(dep)?Math.max(0,dep):0};
}
function haversineKm(a1,o1,a2,o2){
 const r=v=>v*Math.PI/180,dA=r(a2-a1),dO=r(o2-o1);
 const a=Math.sin(dA/2)**2+Math.cos(r(a1))*Math.cos(r(a2))*Math.sin(dO/2)**2;
 return 2*EARTH_RADIUS_KM*Math.asin(Math.sqrt(Math.min(1,a)));
}
function distanceToCoverJapan(o){
 const key=o.lat+","+o.lon;
 if(key===japanDistanceKey)return japanDistanceValue;
 japanDistanceKey=key;
 japanDistanceValue=Math.max(...JAPAN_EDGE_POINTS.map(([a,b])=>haversineKm(o.lat,o.lon,a,b)));
 return japanDistanceValue;
}
function destinationPoint(lat,lon,km,brg){
 const ang=km/EARTH_RADIUS_KM,b=brg*Math.PI/180,l1=lat*Math.PI/180,o1=lon*Math.PI/180;
 const l2=Math.asin(Math.sin(l1)*Math.cos(ang)+Math.cos(l1)*Math.sin(ang)*Math.cos(b));
 const o2=o1+Math.atan2(Math.sin(b)*Math.sin(ang)*Math.cos(l1),Math.cos(ang)-Math.sin(l1)*Math.sin(l2));
 return [((o2*180/Math.PI+540)%360)-180,l2*180/Math.PI];
}
function circleFeature(lat,lon,km){
 const ring=[];
 for(let i=0;i<=WAVE_CIRCLE_POINTS;i++)ring.push(destinationPoint(lat,lon,km,i/WAVE_CIRCLE_POINTS*360));
 return {type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:[ring]}};
}
function setGeoJSON(id,data){
 if(!mapReady)return;
 let s=map.getSource(id);
 if(!s){ensureWaveLayers();s=map.getSource(id);}
 if(s)s.setData(data);
}
function clearWaveLayers(){
 lastWaveSig="";if(wavesEmpty)return;wavesEmpty=true;
 setGeoJSON("wave-p",emptyFC());setGeoJSON("wave-s",emptyFC());
}
function serialNumber(v){
 if(v==null||v==="")return null;
 if(typeof v==="number"&&Number.isFinite(v))return v;
 const m=String(v).match(/\d+/);return m?Number(m[0]):null;
}
function isOlderSerial(inc,ex){
 if(!ex)return false;
 const a=serialNumber(inc.Serial),b=serialNumber(ex.data?.Serial);
 if(a!==null&&b!==null)return a<b;
 const at=Date.parse(inc.AnnouncedTime||""),bt=Date.parse(ex.data?.AnnouncedTime||"");
 return Number.isFinite(at)&&Number.isFinite(bt)&&at<bt;
}
async function loadTravelTable(){
 try{
  const res=await fetch(TRAVEL_TABLE_URL);
  if(!res.ok)throw new Error("HTTP "+res.status);
  const parsed=[];
  for(const line of (await res.text()).split(/\r?\n/)){
   const s=line.trim();if(!s)continue;
   const cols=s.split(",");if(cols.length<4)continue;
   const [pTime,sTime,depth,distance]=cols.slice(0,4).map(v=>Number(v.trim()));
   if(![pTime,sTime,depth,distance].every(Number.isFinite)||pTime<0||sTime<0||depth<0||distance<0)continue;
   parsed.push({pTime,sTime,depth,distance});
  }
  if(!parsed.length)throw new Error("有効な走時データがありません");
  travelTable=parsed;buildWaveCache();tableLoaded=true;
 }catch(error){tableLoaded=false;console.error("走時表読み込みエラー:",error);}
}
function buildWaveCache(){
 waveCache.clear();
 const by=new Map();
 for(const r of travelTable){
  let g=by.get(r.depth);if(!g){g={P:[],S:[]};by.set(r.depth,g);}
  g.P.push([r.pTime,r.distance]);g.S.push([r.sTime,r.distance]);
 }
 for(const [d,g] of by){g.P.sort((a,b)=>a[0]-b[0]);g.S.sort((a,b)=>a[0]-b[0]);waveCache.set(d,g);}
 depthList=[...waveCache.keys()].sort((a,b)=>a-b);
}
function getWaveTables(depthKm){
 if(!depthList.length)return null;
 let best=depthList[0],diff=Math.abs(best-depthKm);
 for(const d of depthList){const v=Math.abs(d-depthKm);if(v<diff){diff=v;best=d;}}
 return waveCache.get(best)||null;
}
function interpolateDistance(pts,t){
 if(!pts||!pts.length||!Number.isFinite(t)||t<0||t<pts[0][0])return null;
 if(pts.length===1)return pts[0][1];
 const last=pts.length-1;
 if(t>pts[last][0])return pts[last][1];
 let lo=0,hi=last;
 while(lo<hi){const mid=(lo+hi)>>1;if(pts[mid][0]>=t)hi=mid;else lo=mid+1;}
 if(lo===0)return pts[0][1];
 const a=pts[lo-1],b=pts[lo],dt=b[0]-a[0];
 if(dt<=0)return b[1];
 return a[1]+(b[1]-a[1])*(t-a[0])/dt;
}
function finalWaveDisplayExpired(){return finalAnnouncedTime!==null&&nowMs()-finalAnnouncedTime>=FINAL_HIDE_MS;}
function finishWaveDisplay(){
 if(waveDisplayFinished)return;
 waveDisplayFinished=true;pWavePassedJapan=true;sWavePassedJapan=true;
 clearWaveLayers();
 if(!startupComplete)return;
 if(userBusy()){pendingCam=true;return;}
 applyFinalView(false);
}
function updateWaveMap(){
 if(!currentOrigin||currentOriginTime===null||!mapReady)return;
 if(waveDisplayFinished){clearWaveLayers();return;}
 if(finalWaveDisplayExpired()){finishWaveDisplay();return;}
 ensureWaveLayers();
 if(!tableLoaded)return;
 const elapsed=Math.max(0,(nowMs()-currentOriginTime)/1000);
 const tables=getWaveTables(currentOrigin.depth);
 if(!tables){clearWaveLayers();return;}
 const pR=interpolateDistance(tables.P,elapsed),sR=interpolateDistance(tables.S,elapsed);
 lastPRadius=pR;lastSRadius=sR;
 /* P波・S波のどちらかが2,000kmに到達したら両方消す */
 if((pR!==null&&pR>=WAVE_MAX_KM)||(sR!==null&&sR>=WAVE_MAX_KM)){finishWaveDisplay();return;}
 const jd=distanceToCoverJapan(currentOrigin);
 if(!pWavePassedJapan&&pR!==null&&pR>=jd)pWavePassedJapan=true;
 if(!sWavePassedJapan&&sR!==null&&sR>=jd){finishWaveDisplay();return;}
 const showP=!pWavePassedJapan&&pR!==null&&pR>0,showS=sR!==null&&sR>0;
 const sig=(showP?pR.toFixed(1):"-")+"|"+(showS?sR.toFixed(1):"-")+"|"+currentOrigin.lat+","+currentOrigin.lon;
 if(sig!==lastWaveSig){
  lastWaveSig=sig;wavesEmpty=false;
  setGeoJSON("wave-p",{type:"FeatureCollection",features:showP?[circleFeature(currentOrigin.lat,currentOrigin.lon,pR)]:[]});
  setGeoJSON("wave-s",{type:"FeatureCollection",features:showS?[circleFeature(currentOrigin.lat,currentOrigin.lon,sR)]:[]});
 }
 const vis=[pWavePassedJapan?null:pR,sR].filter(v=>Number.isFinite(v)&&v>0&&v<=WAVE_MAX_KM);
 if(startupComplete&&vis.length){
  if(userBusy())pendingCam=true;
  else{
   const radius=Math.max(...vis);
   if((lastFitR===null||radius>lastFitR*0.8)&&(Date.now()-lastFitAt>=1000||lastFitR===null))fitWave(radius,true);
  }
 }
}
function startMapUpdater(){
 if(mapUpdateRaf!==null)return;
 const tick=ts=>{
  mapUpdateRaf=requestAnimationFrame(tick);
  if(document.visibilityState==="hidden"||ts-lastWaveFrameAt<WAVE_FRAME_MS-1)return;
  lastWaveFrameAt=ts;updateWaveMap();
 };
 mapUpdateRaf=requestAnimationFrame(tick);
}
function setMapEvent(data,eventKey){
 const origin=getEventOrigin(data);
 if(!origin)return;
 const id=String(data.EventID||eventKey),isNew=lastMapEventKey!==id,ot=parseOriginTime(data.OriginTime);
 if(isNew){
  lastMapEventKey=id;currentOriginTime=ot;
  finalAnnouncedTime=null;finalAnnouncedEventId=null;pWavePassedJapan=false;sWavePassedJapan=false;
  waveDisplayFinished=false;finalMapViewApplied=false;lastPRadius=null;lastSRadius=null;lastFitR=null;
  userUntil=0;clearTimeout(userTimer);pendingCam=false;autoTarget=null;clearWaveLayers();
 }else if(currentOriginTime===null&&ot!==null)currentOriginTime=ot;
 if(data.isFinal===true&&finalAnnouncedEventId!==id){
  const at=parseOriginTime(data.AnnouncedTime);
  finalAnnouncedTime=at!==null?at:nowMs();finalAnnouncedEventId=id;
 }
 currentOrigin=origin;currentIsPlum=data.isAssumption===true;
 if(currentOriginTime===null){clearWaveLayers();updateEpicenterMarker();return;}
 updateEpicenterMarker();updateWaveMap();
 if(startupComplete&&isNew&&!waveDisplayFinished){
  if(userBusy())pendingCam=true;
  else{
   const radii=[lastPRadius,lastSRadius].filter(v=>Number.isFinite(v)&&v>0&&v<=WAVE_MAX_KM);
   if(radii.length)fitWave(Math.max(...radii),true);else fitJapan(true);
  }
 }
}
function applyEpicenterStyle(el){
 el.classList.toggle("plum",currentIsPlum);
 el.textContent=currentIsPlum?"":"×";
 el.title=currentIsPlum?"震源地・PLUM法（クリックで詳細）":"震源地（クリックで詳細）";
}
function updateEpicenterMarker(){
 if(!mapReady||!currentOrigin)return;
 const c=[currentOrigin.lon,currentOrigin.lat];
 const html="<strong>震源地"+(currentIsPlum?"（PLUM法）":"")+"</strong><br>緯度: "+currentOrigin.lat.toFixed(3)+"°<br>経度: "+currentOrigin.lon.toFixed(3)+"°<br>深さ: "+currentOrigin.depth+" km";
 if(epicenterMarker){
  epicenterMarker.setLngLat(c);applyEpicenterStyle(epicenterMarker.getElement());
  if(epicenterPopup)epicenterPopup.setHTML(html);
  return;
 }
 const el=document.createElement("div");
 el.className="epicenter-icon";el.setAttribute("role","button");el.setAttribute("tabindex","0");
 applyEpicenterStyle(el);
 epicenterPopup=new maplibregl.Popup({offset:18}).setHTML(html);
 epicenterMarker=new maplibregl.Marker({element:el,anchor:"center"}).setLngLat(c).setPopup(epicenterPopup).addTo(map);
}

function stopPing(){if(pingTimer!==null)clearInterval(pingTimer);pingTimer=null;pingPending=false;}
function sendPing(){
 if(!socket||socket.readyState!==WebSocket.OPEN)return;
 if(pingPending){
  if(performance.now()-pingSentAt<PING_TIMEOUT)return;
  pingPending=false;pingMissed++;if(pingMissed>=2)text("latency","応答なし");
 }
 pingSentAt=performance.now();pingPending=true;
 try{socket.send("ping");}catch{pingPending=false;text("latency","計測失敗");}
}
function startPing(){stopPing();pingMissed=0;text("latency","計測中");sendPing();pingTimer=setInterval(sendPing,PING_INTERVAL);}
function handlePong(data){
 const pong=data==="pong"||(data&&typeof data==="object"&&String(data.type||"").toLowerCase()==="pong");
 if(!pong||!pingPending)return false;
 text("latency",Math.round(performance.now()-pingSentAt)+" ms");pingMissed=0;pingPending=false;return true;
}

function fmtAnnounced(s){
 const m=String(s||"").match(/(\d+)[-\/](\d+)[-\/](\d+)[ T](\d+):(\d+)/);
 return m?m[1]+"年"+Number(m[2])+"月"+Number(m[3])+"日 "+m[4]+":"+m[5]+" 発表":"--";
}
function render(data,raw,eventKey){
 const canceled=data.isCancel===true,warned=data.isWarn===true,training=data.isTraining===true,fin=data.isFinal===true;
 text("ttl",(training?"【訓練】":"")+"緊急地震速報（"+(canceled?"取消":warned?"警報":"予報")+"）");
 text("ttlSub",fmtAnnounced(data.AnnouncedTime));
 const sn=serialNumber(data.Serial);
 text("serial",sn!==null?"第"+sn+"報":"--");
 $("trainingTag").classList.toggle("hidden",!training);
 $("finalTag").classList.toggle("hidden",!fin);
 text("hypocenter",data.Hypocenter);
 text("maxIntensity",data.MaxIntensity||"--");
 const mag=$("magnitude");mag.textContent=formatMagnitude(data.Magnitude??data.Magunitude);
 const depth=$("depth");depth.textContent=data.Depth==null||data.Depth===""?"--":String(data.Depth);
 const u=document.createElement("small");u.textContent="km";if(depth.textContent!=="--")depth.appendChild(u);
 setMapEvent(data,eventKey);
}
function isDone(d){return d.isFinal===true||d.isCancel===true;}
function hideDelay(e){return e.data?.isCancel===true?CANCEL_HIDE_MS:FINAL_HIDE_MS;}
function isExpired(e,now=Date.now()){return !!e.done&&Number.isFinite(e.receivedAt)&&now-e.receivedAt>=hideDelay(e);}
function activeList(){
 const now=Date.now();
 return [...events.values()].filter(e=>e.done?!isExpired(e,now):performance.now()-e.updatedAt<EVENT_TTL).sort((a,b)=>a.firstAt-b.firstAt);
}
function pruneEvents(){
 const now=Date.now();
 for(const [key,e] of events){
  if(e.done&&isExpired(e,now)){events.delete(key);continue;}
  if(!e.done&&key!==currentKey&&performance.now()-e.updatedAt>EVENT_KEEP)events.delete(key);
 }
}
function tabLabel(e){
 const d=e.data,mag=d.Magnitude??d.Magunitude;
 return [d.Hypocenter||"震源不明",mag!=null&&mag!==""?"M"+formatMagnitude(mag):"",d.MaxIntensity?"震度"+d.MaxIntensity:"",d.isCancel===true?"(取消)":d.isFinal===true?"(最終)":""].filter(Boolean).join(" ");
}
function renderTabs(){
 const box=$("eventTabs"),all=[...events.values()].sort((a,b)=>a.firstAt-b.firstAt);
 box.replaceChildren();
 if(all.length<2){box.classList.add("hidden");return;}
 box.classList.remove("hidden");
 all.forEach((e,i)=>{
  const b=document.createElement("button");b.type="button";
  b.className="event-tab"+(e.key===currentKey?" active":"")+(e.done?" done":"");
  b.textContent=(i+1)+". "+tabLabel(e);
  b.addEventListener("click",()=>{show(e.key);resetRotate();});
  box.appendChild(b);
 });
}
function show(key){
 const e=events.get(key);if(!e)return;
 if(key!==currentKey)shownAt=performance.now();
 currentKey=key;render(e.data,e.raw,e.eventKey);renderTabs();
}
function rotate(){
 pruneEvents();const list=activeList();
 if(!list.length){renderTabs();return;}
 if(list.length===1){if(list[0].key!==currentKey)show(list[0].key);else renderTabs();return;}
 const i=list.findIndex(e=>e.key===currentKey);
 show(list[i<0?0:(i+1)%list.length].key);
}
function rotateTick(){sweep();if(performance.now()-shownAt<ROTATE_MS||activeList().length<2)return;rotate();}
function resetRotate(){shownAt=performance.now();if(rotateTimer===null)rotateTimer=setInterval(rotateTick,250);}
function handleEvent(data,raw){
 if(!data||typeof data!=="object"||Array.isArray(data))return;
 const eventId=data.EventID?String(data.EventID):null;
 if(!eventId)return;
 const key=eventId;
 const eventKey=[key,data.Serial??"",data.AnnouncedTime||"",data.isCancel===true?"cancel":"",data.isFinal===true?"final":""].join("|");
 const existing=events.get(key);
 if(existing&&isOlderSerial(data,existing))return;
 if(existing&&existing.eventKey===eventKey){existing.raw=raw;return;}
 const done=isDone(data),nowPerf=performance.now(),receivedAt=Date.now();
 const e=existing||{key,firstAt:nowPerf,receivedAt:null};
 if(done){
  const wasCancel=existing?.data?.isCancel===true,isCancelNow=data.isCancel===true;
  if(!existing||!existing.done||wasCancel!==isCancelNow)e.receivedAt=receivedAt;
 }else e.receivedAt=null;
 e.data=data;e.raw=raw;e.eventKey=eventKey;e.done=done;e.updatedAt=nowPerf;
 events.set(key,e);pruneEvents();
 const current=events.get(currentKey);
 if(!current){show(key);return;}
 if(currentKey===key){show(key);return;}
 if(current.done&&!done){show(key);return;}
 if(!existing&&!done){show(key);return;}
 renderTabs();
}
function processMessage(raw){
 lastMessageAt=performance.now();
 let data;
 try{data=JSON.parse(raw);}catch{handlePong(raw);return;}
 if(handlePong(data))return;
 if(data&&data.type==="heartbeat"){if(socket&&socket.readyState===WebSocket.OPEN){try{socket.send("ping");}catch{}}return;}
 if(data&&data.type&&data.type!=="jma_eew")return;
 handleEvent(data,raw);
}
function closeSocket(){
 if(!socket)return;
 const s=socket;socket=null;s.onopen=s.onmessage=s.onerror=s.onclose=null;
 try{s.close();}catch{}
}
function connect(){
 if(stopped)return;
 if(reconnectTimer!==null){clearTimeout(reconnectTimer);reconnectTimer=null;}
 stopPing();closeSocket();connState("接続中","");
 let s;
 try{s=new WebSocket(WS_URL);}catch{connState("通信エラー","error");scheduleReconnect();return;}
 socket=s;lastMessageAt=performance.now();
 s.onopen=()=>{
  if(socket!==s)return;
  reconnectDelay=RECONNECT_MIN;lastMessageAt=performance.now();connState("接続済み","online");
  try{s.send(COMMAND);startPing();}catch{connState("通信エラー","error");try{s.close();}catch{}}
 };
 s.onmessage=ev=>{
  if(socket!==s)return;
  if(typeof ev.data==="string")processMessage(ev.data);
  else if(ev.data instanceof Blob)ev.data.text().then(processMessage).catch(()=>{});
  else if(ev.data instanceof ArrayBuffer)processMessage(new TextDecoder("utf-8").decode(ev.data));
 };
 s.onerror=()=>{if(socket===s)connState("通信エラー","error");};
 s.onclose=()=>{
  if(socket!==s)return;
  stopPing();text("latency","--");connState("切断・再接続待ち","error");scheduleReconnect();
 };
}
function scheduleReconnect(){
 if(stopped||reconnectTimer!==null)return;
 const delay=reconnectDelay;reconnectDelay=Math.min(Math.ceil(reconnectDelay*1.6),RECONNECT_MAX);
 reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect();},delay);
}
function reconnectNow(){reconnectDelay=RECONNECT_MIN;connect();}
function startWatchdog(){
 if(watchdogTimer!==null)return;
 watchdogTimer=setInterval(()=>{
  if(stopped)return;
  if(socket&&socket.readyState===WebSocket.OPEN){
   if(performance.now()-lastMessageAt>SILENCE_LIMIT){connState("無通信・再接続","error");reconnectNow();}
  }else if(!socket&&reconnectTimer===null)reconnectNow();
 },3000);
}
function sweep(){
 const before=new Set(events.keys());pruneEvents();
 if(currentKey&&!events.has(currentKey)){
  const active=activeList();
  if(active.length)show(active[0].key);
  else{
   const rem=[...events.values()].sort((a,b)=>b.updatedAt-a.updatedAt);
   if(rem.length)show(rem[0].key);else{currentKey=null;clearWaveLayers();}
  }
 }
 if(before.size!==events.size||[...before].some(k=>!events.has(k)))renderTabs();
}
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState!=="visible")return;
 if(!socket||socket.readyState!==WebSocket.OPEN||performance.now()-lastMessageAt>PING_INTERVAL*2)reconnectNow();else sendPing();
 requestAnimationFrame(()=>{if(!mapReady)return;map.resize();ensureWaveLayers();updateEpicenterMarker();lastWaveSig="";updateWaveMap();map.triggerRepaint();});
});
window.addEventListener("resize",()=>{if(mapReady)map.resize();});
window.addEventListener("orientationchange",()=>setTimeout(()=>{if(mapReady)map.resize();},250));
window.addEventListener("online",reconnectNow);
$("reconnectBtn").addEventListener("click",reconnectNow);
window.addEventListener("beforeunload",()=>{
 stopped=true;
 [reconnectTimer,userTimer].forEach(t=>t!==null&&clearTimeout(t));
 [watchdogTimer,rotateTimer].forEach(t=>t!==null&&clearInterval(t));
 if(mapUpdateRaf!==null)cancelAnimationFrame(mapUpdateRaf);
 stopPing();closeSocket();
});
resetRotate();connect();startWatchdog();startMapUpdater();setInterval(sweep,1000);
syncClock();setInterval(syncClock,CLOCK_SYNC_INTERVAL);
});
</script>
