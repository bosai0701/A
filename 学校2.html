<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>降水ナウキャスト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.css">
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eef3f7}
#map{position:absolute;inset:0;width:100%;height:100%;visibility:visible;background:#eef3f7}
.maplibregl-canvas{image-rendering:auto;transform:translateZ(0)}
#loading{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.82);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:opacity .25s ease;font-family:Arial,sans-serif}
#loading.hide{opacity:0;pointer-events:none}
.loading-box{width:min(82vw,360px);text-align:center}
.loading-title{font-size:20px;font-weight:bold;color:#222;margin-bottom:8px}
.loading-status{min-height:22px;font-size:14px;color:#666;margin-bottom:18px;line-height:1.6}
.loading-spinner{width:34px;height:34px;margin:0 auto 18px;border:4px solid #e5e5e5;border-top-color:#1976d2;border-radius:50%;animation:loading-spin .8s linear infinite}
@keyframes loading-spin{to{transform:rotate(360deg)}}
.loading-progress{width:100%;height:5px;overflow:hidden;border-radius:10px;background:#e8e8e8}
.loading-progress-bar{width:0%;height:100%;border-radius:10px;background:#1976d2;transition:width .1s ease}
.loading-percent{margin-top:9px;font-size:12px;color:#888}
#connection-status{position:fixed;top:10px;right:10px;z-index:5000;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.88);box-shadow:0 2px 6px rgba(0,0,0,.18);font-family:Arial,sans-serif;font-size:12px;font-weight:bold;color:#16823b;pointer-events:none;display:none;white-space:nowrap;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#connection-status.unstable{color:#d88a00}
#connection-status.offline{color:#d32f2f}
#info-panel{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.85);padding:10px 14px;border-radius:6px;font-size:14px;font-family:Arial,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:1000;visibility:hidden;pointer-events:none;transform:translateZ(0);line-height:1.5}
#clock{font-weight:bold}
#sat-time,#nowcast-time{margin-top:2px}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none !important}
#location-btn{position:fixed;right:12px;bottom:12px;z-index:5000;width:52px;height:52px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .15s ease,transform .15s ease}
#location-btn:active{transform:scale(.92)}
#location-btn.active{background:#1976d2}
#location-btn svg{width:25px;height:25px;display:block;fill:none;stroke:#333;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#location-btn.active svg{stroke:#fff}
.user-location-marker{position:relative;width:18px;height:18px;border-radius:50%;background:#1976d2;border:3px solid #fff;box-shadow:0 0 0 2px rgba(25,118,210,.45),0 2px 6px rgba(0,0,0,.35)}
.user-location-marker::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;transform:translate(-50%,-50%);border-radius:50%;background:#fff}
</style>
</head>
<body>

<div id="loading">
  <div class="loading-box">
    <div id="loading-spinner" class="loading-spinner"></div>
    <div class="loading-title">降水ナウキャスト</div>
    <div id="loading-status" class="loading-status">地図を準備しています…</div>
    <div id="loading-progress" class="loading-progress"><div id="loading-progress-bar" class="loading-progress-bar"></div></div>
    <div id="loading-percent" class="loading-percent">0%</div>
  </div>
</div>

<div id="connection-status">● オンライン</div>
<div id="map"></div>

<div id="info-panel">
  <div id="clock">----/--/-- --:--:--</div>
  <div id="sat-time">衛星: --</div>
  <div id="nowcast-time">降水: --</div>
</div>

<button id="location-btn" type="button" aria-label="現在地を表示" title="現在地">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="7"></circle>
    <line x1="12" y1="2" x2="12" y2="5"></line>
    <line x1="12" y1="19" x2="12" y2="22"></line>
    <line x1="2" y1="12" x2="5" y2="12"></line>
    <line x1="19" y1="12" x2="22" y2="12"></line>
  </svg>
</button>

<script src="https://unpkg.com/maplibre-gl@1.14.0/dist/maplibre-gl.js"></script>
<script>

let loadingError = false;
let mapReady = false;
let initializing = false;
let initGeneration = 0;

let jmaConnectionTimer = null;
let nowcastTimer = null;
let satelliteTimer = null;
let initialDisplayTimer = null;

/* 現在地 */
let locationMarker = null;
let locationTimer = null;
let locationEnabled = false;
let locationFirstMove = true;

/* DOM */
const loading = document.getElementById('loading');
const loadingStatus = document.getElementById('loading-status');
const loadingProgress = document.getElementById('loading-progress');
const loadingProgressBar = document.getElementById('loading-progress-bar');
const loadingPercent = document.getElementById('loading-percent');
const loadingSpinner = document.getElementById('loading-spinner');
const connectionStatus = document.getElementById('connection-status');
const mapElement = document.getElementById('map');
const infoPanel = document.getElementById('info-panel');
const locationBtn = document.getElementById('location-btn');

/* =========================================
   接続状態 / ローディング
========================================= */

function setConnectionStatus(state) {
  connectionStatus.className = '';

  if (state === 'online') {
    connectionStatus.textContent = '● オンライン';
  } else if (state === 'unstable') {
    connectionStatus.textContent = '● 接続不安定';
    connectionStatus.classList.add('unstable');
  } else {
    connectionStatus.textContent = '● オフライン';
    connectionStatus.classList.add('offline');
  }

  if (mapReady) connectionStatus.style.display = 'block';
}

function showInitialError(message) {
  loadingError = true;
  initGeneration++;

  if (initialDisplayTimer) {
    clearTimeout(initialDisplayTimer);
    initialDisplayTimer = null;
  }

  // データ取得失敗でも地図本体は絶対に隠さない。
  // 「白画面」になるのを防ぐため、ベース地図をそのまま表示する。
  mapElement.style.visibility = 'visible';
  infoPanel.style.visibility = 'visible';

  loading.style.display = 'none';
  loading.classList.add('hide');

  loadingSpinner.style.display = 'none';
  loadingProgress.style.display = 'none';
  loadingPercent.style.display = 'none';

  loadingStatus.innerHTML =
    message ||
    '降水ナウキャストのデータがありません。<br>' +
    'データがないか、通信に障害が発生しています。';

  setConnectionStatus(navigator.onLine ? 'unstable' : 'offline');
}

function showLoading() {
  loadingError = false;

  if (initialDisplayTimer) {
    clearTimeout(initialDisplayTimer);
    initialDisplayTimer = null;
  }

  loading.style.display = 'flex';
  loading.classList.remove('hide');

  loadingSpinner.style.display = 'block';
  loadingProgress.style.display = 'block';
  loadingPercent.style.display = 'block';

  loadingProgressBar.style.width = '0%';
  loadingPercent.textContent = '0%';
}

function setLoading(text, percent) {
  if (loadingError) return;

  if (!navigator.onLine) {
    setConnectionStatus('offline');
    return;
  }

  loadingStatus.textContent = text;

  const value = Math.max(0, Math.min(100, percent));

  loadingProgressBar.style.width = value + '%';
  loadingPercent.textContent = Math.round(value) + '%';
}

function showMapAfterLoading() {
  if (loadingError) return;

  mapElement.style.visibility = 'visible';
  infoPanel.style.visibility = 'visible';

  loadingProgressBar.style.width = '100%';
  loadingPercent.textContent = '100%';
  loadingStatus.textContent = '地図の表示準備が完了しました';

  if (initialDisplayTimer) {
    clearTimeout(initialDisplayTimer);
    initialDisplayTimer = null;
  }

  initialDisplayTimer = setTimeout(() => {
    initialDisplayTimer = null;

    if (loadingError || !navigator.onLine) return;

    mapElement.style.visibility = 'visible';
    infoPanel.style.visibility = 'visible';

    mapReady = true;
    connectionStatus.style.display = 'block';

    setConnectionStatus('online');

    requestAnimationFrame(() => {
      map.resize();
      map.triggerRepaint();
    });

    loading.classList.add('hide');

    setTimeout(() => {
      if (!loadingError && navigator.onLine) {
        loading.style.display = 'none';
      }
    }, 300);

  }, 50);
}

/* =========================================
   定数
========================================= */

const NOWCAST_OPACITY = 0.55;
const BASE_ZOOM = 8;
const HIGH_ZOOM = 10;
const TILE_SIZE = 256;

/* タイル取得の同時実行数 */
const CONCURRENCY = 24;

/* 1枚あたりのタイム制限 */
const TILE_TIMEOUT = 8000;

/* 降水モザイク範囲 */
const TILE_X_MIN = 212;
const TILE_X_MAX = 243;
const TILE_Y_MIN = 92;
const TILE_Y_MAX = 115;

/*
 * 画質維持:
 * JMAの元タイルは256px。
 * 0.5倍に縮小せず、元の256pxのままモザイク化する。
 */
const NOWCAST_SCALE = 1;

/* 衛星 */
const SAT_ZOOM = 4;
const SAT_SCALE = Math.pow(2, SAT_ZOOM - 4);

const SAT_X_MIN = 11 * SAT_SCALE;
const SAT_X_MAX = 19 * SAT_SCALE - 1;
const SAT_Y_MIN = 1 * SAT_SCALE;
const SAT_Y_MAX = 15 * SAT_SCALE - 1;

/*
 * 衛星も元JPEGを縮小しない。
 */
const SATELLITE_SCALE = 1;

let latestTime1 = '';
let latestTime2 = '';
let previousTimestamp = '';
let z10Generation = 0;
let switchingToZ10 = false;
let nowcastBusy = false;

/* 衛星 */
let latestSatValidTime = null;
let latestSatBaseTime = null;
let satChecking = false;

/* =========================================
   現在地
========================================= */

function updateUserLocation() {
  if (!locationEnabled) return;
  if (!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(
    position => {
      if (!locationEnabled) return;

      const lng = position.coords.longitude;
      const lat = position.coords.latitude;

      if (!Number.isFinite(lng) || !Number.isFinite(lat)) return;

      if (!locationMarker) {
        const element = document.createElement('div');
        element.className = 'user-location-marker';

        locationMarker = new maplibregl.Marker({
          element: element,
          anchor: 'center'
        })
        .setLngLat([lng, lat])
        .addTo(map);

      } else {
        locationMarker.setLngLat([lng, lat]);
      }

      if (locationFirstMove) {
        locationFirstMove = false;

        map.flyTo({
          center: [lng, lat],
          zoom: 10,
          duration: 1000
        });
      }
    },
    error => {
      console.warn('位置情報取得エラー:', error);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

function startLocationTracking() {
  if (locationEnabled) return;
  if (!navigator.geolocation) return;

  locationEnabled = true;
  locationFirstMove = true;

  locationBtn.classList.add('active');

  updateUserLocation();

  if (locationTimer) clearInterval(locationTimer);

  locationTimer = setInterval(() => {
    if (locationEnabled && !document.hidden) {
      updateUserLocation();
    }
  }, 3000);
}

function stopLocationTracking() {
  locationEnabled = false;

  locationBtn.classList.remove('active');

  if (locationTimer) {
    clearInterval(locationTimer);
    locationTimer = null;
  }
}

locationBtn.addEventListener('click', () => {
  if (locationEnabled) {
    stopLocationTracking();
  } else {
    startLocationTracking();
  }
});

/* =========================================
   時刻表示
========================================= */

function formatSatJST(utcString) {
  const value = String(utcString);

  const date = new Date(Date.UTC(
    Number(value.slice(0, 4)),
    Number(value.slice(4, 6)) - 1,
    Number(value.slice(6, 8)),
    Number(value.slice(8, 10)),
    Number(value.slice(10, 12))
  ));

  date.setUTCHours(date.getUTCHours() + 9);

  const m = String(date.getUTCMonth() + 1).padStart(2, '0');
  const d = String(date.getUTCDate()).padStart(2, '0');
  const h = String(date.getUTCHours()).padStart(2, '0');
  const min = String(date.getUTCMinutes()).padStart(2, '0');

  return `${date.getUTCFullYear()}/${m}/${d} ${h}:${min} JST`;
}

/* =========================================
   座標
========================================= */

function tileXToLng(x, z) {
  return (x / Math.pow(2, z)) * 360 - 180;
}

function tileYToLat(y, z) {
  const n = Math.PI - (2 * Math.PI * y / Math.pow(2, z));

  return (180 / Math.PI) *
    Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

function mosaicCoordinates(xMin, xMax, yMin, yMax, z) {
  const w = tileXToLng(xMin, z);
  const e = tileXToLng(xMax + 1, z);
  const n = tileYToLat(yMin, z);
  const s = tileYToLat(yMax + 1, z);

  return [
    [w, n],
    [e, n],
    [e, s],
    [w, s]
  ];
}

const nowcastCoordinates =
  mosaicCoordinates(
    TILE_X_MIN,
    TILE_X_MAX,
    TILE_Y_MIN,
    TILE_Y_MAX,
    BASE_ZOOM
  );

const satCoordinates =
  mosaicCoordinates(
    SAT_X_MIN,
    SAT_X_MAX,
    SAT_Y_MIN,
    SAT_Y_MAX,
    SAT_ZOOM
  );

/* =========================================
   高画質モザイク
========================================= */

async function buildMosaic(options) {
  const xMin = options.xMin;
  const yMin = options.yMin;

  const cols = options.xMax - xMin + 1;
  const rows = options.yMax - yMin + 1;

  const total = cols * rows;

  const scale =
    options.scale === undefined ? 1 : options.scale;

  const outputTileSize = TILE_SIZE * scale;

  const canvas = document.createElement('canvas');

  // 巨大キャンバス生成失敗でアプリ全体が止まらないようにする。
  try {
    canvas.width = cols * outputTileSize;
    canvas.height = rows * outputTileSize;
  } catch (error) {
    console.warn('モザイク用キャンバス生成失敗:', error);
    return null;
  }

  const ctx = canvas.getContext('2d', {
    alpha: true,
    willReadFrequently: false
  });

  if (!ctx) {
    console.warn('2Dキャンバスを取得できません。');
    return null;
  }

  /*
   * 重要:
   * 元タイルを縮小しないため、
   * canvas内の各タイルも256pxのまま。
   */
  ctx.imageSmoothingEnabled = false;

  let next = 0;
  let done = 0;
  let loaded = 0;

  const worker = async () => {
    while (true) {
      const i = next++;

      if (i >= total) return;
      if (!navigator.onLine) return;

      const x = xMin + (i % cols);
      const y = yMin + Math.floor(i / cols);

      const controller = new AbortController();

      const timer = setTimeout(() => {
        controller.abort();
      }, TILE_TIMEOUT);

      try {
        const response = await fetch(
          options.urlFn(x, y),
          {
            signal: controller.signal
          }
        );

        if (response.ok) {
          const blob = await response.blob();

          if (window.createImageBitmap) {

            const bitmap = await createImageBitmap(
              blob,
              {
                colorSpaceConversion: 'none'
              }
            );

            ctx.drawImage(
              bitmap,
              (x - xMin) * outputTileSize,
              (y - yMin) * outputTileSize,
              outputTileSize,
              outputTileSize
            );

            bitmap.close();
            loaded++;

          } else {

            const img = new Image();

            const objectURL = URL.createObjectURL(blob);

            img.src = objectURL;

            const loadedImage = await new Promise(resolve => {
              img.onload = () => resolve(true);
              img.onerror = () => resolve(false);
            });

            if (loadedImage && img.naturalWidth > 0 && img.naturalHeight > 0) {
              ctx.drawImage(
                img,
                (x - xMin) * outputTileSize,
                (y - yMin) * outputTileSize,
                outputTileSize,
                outputTileSize
              );
              loaded++;
            }

            URL.revokeObjectURL(objectURL);
          }
        }

      } catch (error) {

        /* 取得失敗タイルは空白のまま */

      } finally {

        clearTimeout(timer);

        done++;

        if (
          options.onProgress &&
          (done % 8 === 0 || done === total)
        ) {
          options.onProgress(done, total);
        }
      }
    }
  };

  await Promise.all(
    Array.from(
      { length: CONCURRENCY },
      worker
    )
  );

  if (loaded === 0) {
    return null;
  }

  // 一部タイル欠損でも取得済みタイルを表示する。
  // オフライン復帰時に次回更新で完全な状態へ戻す。
  return canvas;
}

/* =========================================
   キャンバスレイヤー
========================================= */

let canvasSeq = 0;
const activeCanvasLayers = {};

function swapCanvasLayer(
  key,
  canvas,
  coordinates,
  layerOptions,
  beforeId
) {
  if (!canvas || !map || !map.isStyleLoaded()) return false;

  const n = ++canvasSeq;

  const sourceId =
    key + '-src-' + n;

  const layerId =
    key + '-layer-' + n;

  const layers =
    map.getStyle().layers || [];

  for (const layer of layers) {
    if (layer.id.startsWith(key + '-layer-')) {
      if (map.getLayer(layer.id)) {
        map.removeLayer(layer.id);
      }
    }
  }

  const previousCanvas =
    activeCanvasLayers[key] &&
    activeCanvasLayers[key].canvas;

  const sources =
    map.getStyle().sources || {};

  for (const srcId in sources) {
    if (srcId.startsWith(key + '-src-')) {
      if (map.getSource(srcId)) {
        map.removeSource(srcId);
      }
    }
  }

  map.addSource(sourceId, {
    type: 'canvas',
    canvas: canvas,
    coordinates: coordinates,
    animate: false
  });

  map.addLayer(
    {
      id: layerId,
      type: 'raster',
      source: sourceId,
      minzoom: layerOptions.minzoom,
      maxzoom: layerOptions.maxzoom,
      paint: {
        'raster-opacity': layerOptions.opacity,
        'raster-resampling': layerOptions.resampling,
        'raster-fade-duration': 0
      }
    },
    beforeId
  );

  if (
    previousCanvas &&
    previousCanvas !== canvas
  ) {
    previousCanvas.width = 0;
    previousCanvas.height = 0;
  }

  activeCanvasLayers[key] = {
    sourceId: sourceId,
    layerId: layerId,
    canvas: canvas
  };

  map.triggerRepaint();
  return true;
}

function activeLayerId(key) {
  const active =
    activeCanvasLayers[key];

  return active &&
    map.getLayer(active.layerId)
    ? active.layerId
    : null;
}

function setNowcastOpacity(value) {
  const id = activeLayerId('nowcast');

  if (id) {
    map.setPaintProperty(
      id,
      'raster-opacity',
      value
    );
  }
}

/* =========================================
   衛星
========================================= */

async function getSatLatestTime() {
  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 5000);

  try {
    const response = await fetch(
      'https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_fd.json?' +
      Date.now(),
      {
        cache: 'no-store',
        signal: controller.signal
      }
    );

    if (!response.ok) {
      throw new Error(
        'targetTimes_fd.json取得失敗'
      );
    }

    const data =
      await response.json();

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {
      throw new Error(
        '時刻データがありません'
      );
    }

    data.sort((a, b) =>
      String(a.validtime)
        .localeCompare(String(b.validtime))
    );

    return data[data.length - 1];

  } finally {
    clearTimeout(timeout);
  }
}

function getSatelliteBeforeLayerId() {
  const layers =
    map.getStyle().layers || [];

  const z10Layer =
    layers.find(layer =>
      layer.id.startsWith(
        'nowcast-z10-layer-'
      )
    );

  if (z10Layer) {
    return z10Layer.id;
  }

  const nowcastId =
    activeLayerId('nowcast');

  if (nowcastId) {
    return nowcastId;
  }

  return 'jma-mask';
}

async function updateSatellite() {
  if (satChecking) return;
  if (!map.isStyleLoaded()) return;

  if (!navigator.onLine) {
    setConnectionStatus('offline');
    return;
  }

  satChecking = true;

  try {
    const target =
      await getSatLatestTime();

    const baseTime =
      String(target.basetime);

    const validTime =
      String(target.validtime);

    if (
      latestSatValidTime === validTime &&
      latestSatBaseTime === baseTime &&
      activeLayerId('satellite')
    ) {
      return;
    }

    const canvas =
      await buildMosaic({
        xMin: SAT_X_MIN,
        xMax: SAT_X_MAX,
        yMin: SAT_Y_MIN,
        yMax: SAT_Y_MAX,

        /*
         * 衛星も縮小しない。
         */
        scale: SATELLITE_SCALE,

        urlFn: (x, y) => {
          const worldTiles =
            Math.pow(2, SAT_ZOOM);

          const wx =
            ((x % worldTiles) +
              worldTiles) %
            worldTiles;

          return (
            'https://www.jma.go.jp/bosai/himawari/data/satimg/' +
            baseTime +
            '/fd/' +
            validTime +
            '/B13/TBB/' +
            SAT_ZOOM +
            '/' +
            wx +
            '/' +
            y +
            '.jpg'
          );
        }
      });

    if (!canvas) {
      throw new Error(
        '衛星モザイク生成失敗'
      );
    }

    swapCanvasLayer(
      'satellite',
      canvas,
      satCoordinates,
      {
        minzoom: 0,
        maxzoom: 19,
        opacity: 0.65,
        resampling: 'linear'
      },
      getSatelliteBeforeLayerId()
    );

    latestSatValidTime =
      validTime;

    latestSatBaseTime =
      baseTime;

    document.getElementById(
      'sat-time'
    ).textContent =
      '衛星: ' +
      formatSatJST(validTime);

  } catch (error) {

    console.warn(
      '衛星画像更新エラー:',
      error
    );

    if (navigator.onLine) {
      setConnectionStatus('unstable');
    }

  } finally {

    satChecking = false;
  }
}

/* =========================================
   JMA通信速度チェック
========================================= */

async function checkJMAConnection() {
  if (!navigator.onLine) {
    setConnectionStatus('offline');
    return false;
  }

  const start =
    performance.now();

  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 5000);

  try {
    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?check=' +
        Date.now(),
        {
          cache: 'no-store',
          signal: controller.signal
        }
      );

    clearTimeout(timeout);

    const elapsed =
      performance.now() - start;

    if (!response.ok) {
      if (navigator.onLine) {
        setConnectionStatus('unstable');
      }

      return false;
    }

    setConnectionStatus(
      elapsed >= 1000
        ? 'unstable'
        : 'online'
    );

    return true;

  } catch (error) {

    clearTimeout(timeout);

    setConnectionStatus(
      navigator.onLine
        ? 'unstable'
        : 'offline'
    );

    return false;
  }
}

function startConnectionMonitor() {
  if (jmaConnectionTimer) {
    clearInterval(
      jmaConnectionTimer
    );
  }

  jmaConnectionTimer =
    setInterval(() => {
      checkJMAConnection();
    }, 1000);
}

/* =========================================
   最新時刻取得
========================================= */

async function fetchLatestTimes() {
  if (!navigator.onLine) {

    if (!mapReady) {
      showInitialError(
        'インターネットに接続されていません。<br>' +
        '接続を確認しています…'
      );
    }

    return false;
  }

  const start =
    performance.now();

  const fail = () => {

    if (mapReady) {
      setConnectionStatus(
        'unstable'
      );
    } else {
      showInitialError();
    }

    return false;
  };

  try {

    const response =
      await fetch(
        'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?_' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );

    const elapsed =
      performance.now() - start;

    if (!response.ok) {
      return fail();
    }

    const data =
      await response.json();

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {
      return fail();
    }

    const newTime1 =
      data[0].basetime;

    const newTime2 =
      data[0].validtime;

    if (!newTime1 || !newTime2) {
      return fail();
    }

    const changed =
      newTime1 !== latestTime1 ||
      newTime2 !== latestTime2;

    latestTime1 =
      newTime1;

    latestTime2 =
      newTime2;

    document.getElementById(
      'nowcast-time'
    ).textContent =
      '降水: ' +
      formatSatJST(
        String(newTime2)
      );

    if (elapsed >= 1000) {
      setConnectionStatus(
        'unstable'
      );
    } else if (mapReady) {
      setConnectionStatus(
        'online'
      );
    }

    return changed;

  } catch (error) {

    console.warn(
      'JMA時刻取得エラー:',
      error
    );

    setConnectionStatus(
      navigator.onLine
        ? 'unstable'
        : 'offline'
    );

    if (!mapReady) {
      showInitialError();
    }

    return false;
  }
}

function jmaTileURL(x, y) {
  return (
    'https://www.jma.go.jp/bosai/jmatile/data/nowc/' +
    latestTime1 +
    '/none/' +
    latestTime2 +
    '/surf/hrpns/' +
    BASE_ZOOM +
    '/' +
    x +

    y +

  );
}

async function createMosaic() {
  if (!latestTime1 || !latestTime2) {
    return null;
  }

  if (!navigator.onLine) {

    if (!mapReady) {
      showInitialError();
    }

    return null;
  }

  setLoading(
    '降水タイルを読み込んでいます…',
    10
  );

  const canvas =
    await buildMosaic({
      xMin: TILE_X_MIN,
      xMax: TILE_X_MAX,
      yMin: TILE_Y_MIN,
      yMax: TILE_Y_MAX,

      /*
       * 256px → 128pxへの縮小を廃止。
       * 元のJMAタイル解像度を維持。
       */
      scale: NOWCAST_SCALE,

      urlFn: jmaTileURL,

      onProgress: (
        done,
        total
      ) => {

        setLoading(
          `降水タイルを読み込み中… ${done}/${total}`,
          10 +
          (done / total) * 85
        );
      }
    });

  if (!canvas) {

    if (mapReady) {
      setConnectionStatus(
        'unstable'
      );
    } else {
      showInitialError();
    }

    return null;
  }

  return canvas;
}

/* =========================================
   降水 Z10 レイヤー
========================================= */

function getZ10BeforeLayerId() {
  return undefined;
}

function addZ10Layer(
  time1,
  time2
) {
  if (!navigator.onLine) return;

  const generation =
    ++z10Generation;

  const sourceId =
    'nowcast-z10-' +
    generation;

  const layerId =
    'nowcast-z10-layer-' +
    generation;

  const url =
    'https://www.jma.go.jp/bosai/jmatile/data/nowc/' +
    time1 +
    '/none/' +
    time2 +
    '/surf/hrpns/10/{x}/{y}.png';

  map.addSource(
    sourceId,
    {
      type: 'raster',

      tiles: [url],

      tileSize: 256,

      minzoom: 10,
      maxzoom: 10
    }
  );

  map.addLayer(
    {
      id: layerId,

      type: 'raster',

      source: sourceId,

      minzoom: 10,
      maxzoom: 14,

      paint: {
        'raster-opacity':
          NOWCAST_OPACITY,

        'raster-resampling':
          'nearest',

        'raster-fade-duration':
          0
      }
    },
    getZ10BeforeLayerId()
  );

  const checkLoaded = () => {

    if (
      generation !==
      z10Generation
    ) {
      return;
    }

    if (!navigator.onLine) {
      setConnectionStatus(
        'offline'
      );

      return;
    }

    if (!map.getSource(sourceId)) {
      return;
    }

    if (
      map.isSourceLoaded(
        sourceId
      )
    ) {

      setNowcastOpacity(0);

      const layers =
        map.getStyle().layers ||
        [];

      for (const layer of layers) {

        if (
          layer.id.startsWith(
            'nowcast-z10-layer-'
          ) &&
          layer.id !== layerId
        ) {

          const oldSource =
            layer.source;

          if (
            map.getLayer(
              layer.id
            )
          ) {
            map.removeLayer(
              layer.id
            );
          }

          if (
            oldSource &&
            map.getSource(
              oldSource
            )
          ) {
            map.removeSource(
              oldSource
            );
          }
        }
      }

      switchingToZ10 = false;

      map.triggerRepaint();

      return;
    }

    requestAnimationFrame(
      checkLoaded
    );
  };

  requestAnimationFrame(
    checkLoaded
  );
}

/* =========================================
   ズーム切り替え
========================================= */

function updateZoomLayers() {
  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return;
  }

  const zoom =
    map.getZoom();

  if (zoom >= HIGH_ZOOM) {

    const layers =
      map.getStyle().layers ||
      [];

    const z10Exists =
      layers.some(layer =>
        layer.id.startsWith(
          'nowcast-z10-layer-'
        )
      );

    if (
      !z10Exists &&
      !switchingToZ10 &&
      latestTime1 &&
      latestTime2
    ) {

      switchingToZ10 = true;

      addZ10Layer(
        latestTime1,
        latestTime2
      );
    }

    return;
  }

  setNowcastOpacity(
    NOWCAST_OPACITY
  );

  const layers =
    map.getStyle().layers ||
    [];

  for (const layer of layers) {

    if (
      layer.id.startsWith(
        'nowcast-z10-layer-'
      )
    ) {

      const source =
        layer.source;

      if (
        map.getLayer(
          layer.id
        )
      ) {
        map.removeLayer(
          layer.id
        );
      }

      if (
        source &&
        map.getSource(
          source
        )
      ) {
        map.removeSource(
          source
        );
      }
    }
  }

  switchingToZ10 = false;

  map.triggerRepaint();
}

map.on(
  'zoom',
  updateZoomLayers
);

/* =========================================
   ナウキャスト更新
========================================= */

function getNowcastBeforeLayerId() {

  const layers =
    map.getStyle().layers ||
    [];

  const z10Layer =
    layers.find(layer =>
      layer.id.startsWith(
        'nowcast-z10-layer-'
      )
    );

  if (z10Layer) {
    return z10Layer.id;
  }

  return undefined;
}

async function updateNowcastLayers() {

  const canvas =
    await createMosaic();

  if (!canvas) {
    return false;
  }

  swapCanvasLayer(
    'nowcast',
    canvas,
    nowcastCoordinates,
    {
      minzoom: 3,
      maxzoom: 10,
      opacity: NOWCAST_OPACITY,
      resampling: 'nearest'
    },
    getNowcastBeforeLayerId()
  );

  if (
    map.getZoom() >=
    HIGH_ZOOM
  ) {

    switchingToZ10 = true;

    addZ10Layer(
      latestTime1,
      latestTime2
    );
  }

  return true;
}

async function checkNowcastUpdate() {

  if (!mapReady) return;
  if (nowcastBusy) return;

  if (!navigator.onLine) {

    setConnectionStatus(
      'offline'
    );

    return;
  }

  nowcastBusy = true;

  try {

    const changed =
      await fetchLatestTimes();

    if (!changed) return;

    const timestamp =
      latestTime1 +
      '_' +
      latestTime2;

    if (
      timestamp ===
      previousTimestamp
    ) {
      return;
    }

    previousTimestamp =
      timestamp;

    const ready =
      await updateNowcastLayers();

    if (ready) {

      checkJMAConnection();

    } else if (
      navigator.onLine
    ) {

      setConnectionStatus(
        'unstable'
      );
    }

  } finally {

    nowcastBusy = false;
  }
}

/* =========================================
   初期化
========================================= */

async function initialize() {

  if (initializing) return;

  initializing = true;

  const generation =
    ++initGeneration;

  showLoading();

  // ローディング表示は気象データ用。ベース地図はすでに表示済み。
  mapElement.style.visibility = 'visible';
  infoPanel.style.visibility = 'visible';

  if (!navigator.onLine) {

    showInitialError(
      'インターネットに接続されていません。<br>' +
      '接続を確認しています…'
    );

    initializing = false;

    return;
  }

  setLoading(
    '気象庁データの時刻を取得しています…',
    3
  );

  await fetchLatestTimes();

  if (
    generation !==
    initGeneration ||
    loadingError ||
    !navigator.onLine ||
    !latestTime1 ||
    !latestTime2
  ) {

    if (!mapReady) {
      showInitialError();
    }

    initializing = false;

    return;
  }

  previousTimestamp =
    latestTime1 +
    '_' +
    latestTime2;

  const ready =
    await updateNowcastLayers();

  if (
    generation !==
    initGeneration ||
    !ready ||
    !navigator.onLine
  ) {

    if (!mapReady) {
      showInitialError();
    } else {
      setConnectionStatus('unstable');
    }

    initializing = false;

    return;
  }

  showMapAfterLoading();

  initializing = false;

  startConnectionMonitor();
}

   オフライン / オンライン復帰

window.addEventListener(

  const day =

  const hours =

/* =========================================

========================================= */

map.on(

    if (

    ) {

      console.warn(

/* =========================================
   読み込み完了
========================================= */

map.on(
  'load',
  () => {
    // MapLibreのロード完了時点でベース地図を即表示。
    // 気象データの取得を待たないため、白画面にはならない。
    mapElement.style.visibility = 'visible';
    infoPanel.style.visibility = 'visible';
    mapReady = true;
    connectionStatus.style.display = 'block';
    setConnectionStatus(navigator.onLine ? 'online' : 'offline');

    requestAnimationFrame(() => {
      map.resize();
      map.triggerRepaint();
    });

    // 気象レイヤーはベース地図表示後に独立して読み込む。
    // ベース地図を先に描画する。衛星は少し遅らせて開始。
    setTimeout(() => {
      updateSatellite().catch(error => {
        console.warn('初期衛星更新エラー:', error);
      });
    }, 150);

    Promise.resolve().then(() => initialize()).catch(error => {
      console.error('初期化エラー:', error);
      initializing = false;
      if (navigator.onLine) setConnectionStatus('unstable');
      showInitialError(
        '気象データの初期化に失敗しました。<br>' +
        'ベース地図は引き続き使用できます。'
      );
    });
  }
);

/* =========================================
   アプリ復帰
========================================= */

document.addEventListener(
  'visibilitychange',
  () => {

    if (
      !document.hidden &&
      mapReady
    ) {

      updateSatellite();

      checkNowcastUpdate();

      checkJMAConnection();

      if (locationEnabled) {
        updateUserLocation();
      }

      requestAnimationFrame(
        () => {

          map.resize();

          map.triggerRepaint();
        }
      );
    }
  }
);

/* =========================================
   グローバル安全装置
   予期しないJavaScript例外でもベース地図を消さない
========================================= */
window.addEventListener('error', event => {
  console.error('アプリケーションエラー:', event.error || event.message);
  mapElement.style.visibility = 'visible';
  infoPanel.style.visibility = 'visible';
  if (mapReady) {
    setConnectionStatus(navigator.onLine ? 'unstable' : 'offline');
  }
});

window.addEventListener('unhandledrejection', event => {
  console.error('非同期処理エラー:', event.reason);
  mapElement.style.visibility = 'visible';
  infoPanel.style.visibility = 'visible';
  if (mapReady) {
    setConnectionStatus(navigator.onLine ? 'unstable' : 'offline');
  }
});

<script>
(function(hostMap) {
  let nextLayerId = 0;
  let mapStyleReady = hostMap.isStyleLoaded();
  const styleReadyCallbacks = [];
  if (!mapStyleReady) {
    hostMap.once('load', () => {
      mapStyleReady = true;
      styleReadyCallbacks.splice(0).forEach(callback => callback());
    });
  }
  const toLngLat = ([lat, lng]) => [Number(lng), Number(lat)];
  const asFeature = geometry => ({type: 'Feature', properties: {}, geometry});
  const whenStyleReady = callback => {
    if (mapStyleReady) callback();
    else styleReadyCallbacks.push(callback);
  };
  const removeMapArtifacts = id => {
    if (!mapStyleReady) return;
    if (hostMap.getLayer(id + '-fill')) hostMap.removeLayer(id + '-fill');
    if (hostMap.getLayer(id + '-line')) hostMap.removeLayer(id + '-line');
    if (hostMap.getSource(id)) hostMap.removeSource(id);
  };
  class ShapeLayer {
    constructor(geometry, options, type) {
      this.id = 'typhoon-layer-' + (++nextLayerId);
      this.feature = asFeature(geometry);
      this.options = options || {};
      this.type = type;
      this.cancelled = false;
      this.addTo = () => {
        whenStyleReady(() => {
          if (this.cancelled || hostMap.getSource(this.id)) return;
          hostMap.addSource(this.id, {type: 'geojson', data: this.feature});
          if (this.type === 'line') {
            const dash = this.options.dashArray ? String(this.options.dashArray).trim().split(/\s+/).map(Number) : null;
            hostMap.addLayer({id: this.id + '-line', type: 'line', source: this.id, paint: {
              'line-color': this.options.color || '#3388ff',
              'line-width': Number(this.options.weight) || 3,
              'line-opacity': this.options.opacity === undefined ? 1 : Number(this.options.opacity),
              ...(dash && dash.length ? {'line-dasharray': dash} : {})
            }});
          } else {
            const isCircle = this.type === 'circle';
            hostMap.addLayer({id: this.id + '-fill', type: 'fill', source: this.id, paint: {
              'fill-color': isCircle ? (this.options.fillColor || this.options.color || '#3388ff') : (this.options.fillColor || this.options.color || '#3388ff'),
              'fill-opacity': this.options.fillOpacity === undefined ? 0 : Number(this.options.fillOpacity)
            }});
            hostMap.addLayer({id: this.id + '-line', type: 'line', source: this.id, paint: {
              'line-color': this.options.color || '#3388ff',
              'line-width': Number(this.options.weight) || 1,
              'line-opacity': this.options.opacity === undefined ? 1 : Number(this.options.opacity),
              ...(this.options.dashArray ? {'line-dasharray': String(this.options.dashArray).trim().split(/\s+/).map(Number)} : {})
            }});
          }
        });
        return this;
      };
      this.remove = () => {
        this.cancelled = true;
        removeMapArtifacts(this.id);
      };
    }
  }
  class MarkerLayer {
    constructor(position, icon) {
      this.position = position;
      this.icon = icon;
      this.marker = null;
      this.cancelled = false;
      this.addTo = () => {
        whenStyleReady(() => {
          if (this.cancelled) return;
          const settings = this.icon.options;
          const element = document.createElement('div');
          element.className = settings.className || '';
          element.innerHTML = settings.html || '';
          this.marker = new maplibregl.Marker({element, anchor: 'center'})
            .setLngLat(toLngLat(this.position)).addTo(hostMap);
        });
        return this;
      };
      this.getElement = () => this.marker ? this.marker.getElement() : null;
      this.remove = () => {
        this.cancelled = true;
        if (this.marker) this.marker.remove();
      };
    }
  }
  class LayerGroup {
    constructor() { this.layers = []; }
    addTo() { return this; }
    addLayer(layer) { this.layers.push(layer); layer.addTo(hostMap); return this; }
    clearLayers() { this.layers.forEach(layer => layer.remove()); this.layers = []; }
    eachLayer(callback) { this.layers.forEach(callback); }
  }
  const makeCircle = (center, radius) => {
    const [lat, lng] = center.map(Number);
    const points = [];
    for (let angle = 0; angle <= 360; angle += 5) {
      const radians = angle * Math.PI / 180;
      const latOffset = radius * Math.cos(radians) / 111000;
      const lngOffset = radius * Math.sin(radians) / (111000 * Math.cos(lat * Math.PI / 180));
      points.push([lng + lngOffset, lat + latOffset]);
    }
    return {type: 'Polygon', coordinates: [points]};
  };
  const compatMap = {
    setView() { return this; },
    getZoom() { return hostMap.getZoom(); },
    on(event, handler) { hostMap.on(event, handler); return this; },
    fitBounds(points, options) {
      if (!Array.isArray(points) || points.length === 0) return this;
      let west = Infinity, south = Infinity, east = -Infinity, north = -Infinity;
      points.forEach(point => { const [lng, lat] = toLngLat(point); west = Math.min(west, lng); east = Math.max(east, lng); south = Math.min(south, lat); north = Math.max(north, lat); });
      const padding = Array.isArray(options && options.padding) ? {top: options.padding[0], bottom: options.padding[0], left: options.padding[1], right: options.padding[1]} : (options && options.padding);
      hostMap.fitBounds([[west, south], [east, north]], {padding: padding || 20});
      return this;
    }
  };
  window.L = {
    map() { return compatMap; },
    tileLayer() { return {addTo() { return this; }}; },
    layerGroup() { return new LayerGroup(); },
    divIcon(options) { return {options}; },
    marker(position, options) { return new MarkerLayer(position, options.icon); },
    circle(center, options) { return new ShapeLayer(makeCircle(center, Number(options.radius) || 0), options, 'circle'); },
    polyline(points, options) { return new ShapeLayer({type: 'LineString', coordinates: points.map(toLngLat)}, options, 'line'); },
    polygon(points, options) { const ring = points.map(toLngLat); if (ring.length && (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1])) ring.push(ring[0]); return new ShapeLayer({type: 'Polygon', coordinates: [ring]}, options, 'polygon'); }
  };
  (function() {
const map =
    L.map('map').setView(
      [35, 138],
      4
    );
  L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    {
      attribution:
        '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>',
      maxZoom: 18,
      minZoom: 3
    }
  ).addTo(map);
  const layerGroup =
    L.layerGroup().addTo(map);
  const actualPathGroup =
    L.layerGroup().addTo(map);
  const forecastPathGroup =
    L.layerGroup().addTo(map);
  /*
   * 予報日時
   */
  function formatLabel(
    dateStr
  ) {
    const d =
      new Date(dateStr);
    return (
      String(
        d.getDate()
      ).padStart(2, '0') +
      '日' +
      String(
        d.getHours()
      ).padStart(2, '0') +
      '時'
    );
  }
  /*
   * 円の右下方向、
   * 円の外側にラベルを配置
   */
  function getBottomRightPosition(
    center,
    radiusMeters,
    multiplier = 1.12
  ) {
    const radius =
      Number(
        radiusMeters
      ) || 0;
    const latOffset =
      (radius / 111000) *
      multiplier *
      0.7071;
    const lngOffset =
      (radius /
        (111000 *
          Math.cos(
            center[0] *
              Math.PI /
              180
          ))) *
      multiplier *
      0.7071;
    return [
      center[0] -
        latOffset,
      center[1] +
        lngOffset
    ];
  }
  /*
   * 文字だけのラベル
   */
  function createTextLabel(
    position,
    text,
    className,
    width
  ) {
    return L.marker(
      position,
      {
        icon:
          L.divIcon({
            className:
              className,
            html:
              `<span>${text}</span>`,
            iconSize: [
              width,
              20
            ],
            iconAnchor: [
              width / 2,
              10
            ]
          }),
        interactive:
          false
      }
    );
  }
  /*
   * 台風番号
   *
   * 2626 → 台風26号
   * 2610 → 台風10号
   * 2601 → 台風1号
   *
   * a → 熱帯低気圧a
   */
  function getTyphoonLabel(
    typhoonNumber
  ) {
    const value =
      String(
        typhoonNumber ?? ''
      ).trim();
    /*
     * 4桁の場合
     *
     * 先頭2桁 = 年
     * 下2桁 = 台風番号
     */
    if (
      /^\d{4}$/.test(
        value
      )
    ) {
      const number =
        Number(
          value.slice(2)
        );
      if (
        number >= 1 &&
        number <= 99
      ) {
        return (
          `${number}号`
        );
      }
    }
    /*
     * 英字
     */
    const letterMatch =
      value.match(
        /^T?([A-Za-z]+)$/
      );
    if (
      letterMatch
    ) {
      return (
        `熱帯低気圧${letterMatch[1]}`
      );
    }
    /*
     * その他
     */
    if (value) {
      return (
        `熱帯低気圧${value.replace(/^T/, '')}`
      );
    }
    return '熱帯低気圧';
  }
  /*
   * 中心位置
   */
  function centerMarker(
    pos,
    typhoonLabel,
    galeArea
  ) {
    const p1 =
      L.polyline(
        [
          [
            pos[0] -
              0.35,
            pos[1]
          ],
          [
            pos[0] +
              0.35,
            pos[1]
          ]
        ],
        {
          color:
            'rgba(255,255,255,0.7)',
          weight: 3,
          opacity: 0.7
        }
      );
    const p2 =
      L.polyline(
        [
          [
            pos[0],
            pos[1] -
              0.45
          ],
          [
            pos[0],
            pos[1] +
              0.45
          ]
        ],
        {
          color:
            'rgba(255,255,255,0.7)',
          weight: 3,
          opacity: 0.7
        }
      );
    layerGroup.addLayer(
      p1
    );
    layerGroup.addLayer(
      p2
    );
    /*
     * 強風域の右下・円の外側
     */
    if (
      galeArea &&
      galeArea.center &&
      Number(
        galeArea.radius
      ) > 0
    ) {
      const labelPos =
        getBottomRightPosition(
          galeArea.center,
          galeArea.radius,
          1.12
        );
      layerGroup.addLayer(
        createTextLabel(
          labelPos,
          typhoonLabel,
          'typhoon-label',
          140
        )
      );
    }
  }
  function polarToLatLng(
    center,
    radiusMeters,
    ang
  ) {
    const lat =
      center[0] +
      (radiusMeters /
        111000) *
        Math.sin(
          (ang - 90) *
            Math.PI /
            180
        );
    const lng =
      center[1] +
      (radiusMeters /
        (111000 *
          Math.cos(
            center[0] *
              Math.PI /
              180
          ))) *
        Math.cos(
          (ang - 90) *
            Math.PI /
            180
        );
    return [
      lat,
      lng
    ];
  }
  function makeArc(
    center,
    radius,
    start,
    end
  ) {
    const pts = [];
    for (
      let a = start;
      a <= end;
      a += 1
    ) {
      pts.push(
        polarToLatLng(
          center,
          radius,
          a
        )
      );
    }
    return L.polygon(
      pts,
      {
        color:
          '#ff4b4b',
        fillColor:
          '#ff4b4b',
        fillOpacity:
          0.25,
        opacity: 1,
        weight: 1.5
      }
    );
  }
  function drawTyphoon(
    item,
    forecast
  ) {
    const actualPoints = [];
    const forecastPoints = [];
    const allBounds = [];
    /*
     * 台風番号は
     * typhoonNumber を使用
     */
    const typhoonNumber =
      item.typhoonNumber;
    const typhoonLabel =
      getTyphoonLabel(
        typhoonNumber
      );
    for (
      const itemForecast of forecast
    ) {
      const track =
        itemForecast.track ||
        {};
      /*
       * 実際の経路
       */
      if (
        Array.isArray(
          track.preTyphoon
        )
      ) {
        actualPoints.push(
          ...track.preTyphoon
        );
        allBounds.push(
          ...track.preTyphoon
        );
      }
      if (
        Array.isArray(
          track.typhoon
        )
      ) {
        actualPoints.push(
          ...track.typhoon
        );
        allBounds.push(
          ...track.typhoon
        );
      }
      /*
       * 予想経路
       */
      if (
        Array.isArray(
          itemForecast.center
        )
      ) {
        forecastPoints.push(
          itemForecast.center
        );
        allBounds.push(
          itemForecast.center
        );
      }
      const advancedHours =
        Number(
          itemForecast
            .advancedHours ||
          0
        );
      /*
       * 強風域
       */
      if (
        itemForecast
          .galeWarningArea &&
        advancedHours === 0
      ) {
        layerGroup.addLayer(
          L.circle(
            itemForecast
              .galeWarningArea
              .center,
            {
              radius:
                Number(
                  itemForecast
                    .galeWarningArea
                    .radius
                ) || 0,
              color:
                '#f8e76b',
              weight: 2,
              opacity: 1,
              fillColor:
                '#f8e76b',
              fillOpacity:
                0.42
            }
          )
        );
      }
      /*
       * 暴風域
       */
      if (
        itemForecast
          .stormWarningArea &&
        advancedHours === 0
      ) {
        for (
          const arc of
          itemForecast
            .stormWarningArea
            .arc || []
        ) {
          const center =
            arc[0];
          const radius =
            Number(
              arc[1]
            ) || 0;
          const start =
            Number(
              arc[2][0]
            ) || 0;
          const end =
            Number(
              arc[2][1]
            ) || 360;
          layerGroup.addLayer(
            makeArc(
              center,
              radius,
              start,
              end
            )
          );
        }
      }
      /*
       * 現在位置
       */
      if (
        itemForecast.center &&
        advancedHours === 0
      ) {
        centerMarker(
          itemForecast.center,
          typhoonLabel,
          itemForecast
            .galeWarningArea
        );
      }
      /*
       * 予報円
       */
      if (
        itemForecast
          .probabilityCircle
      ) {
        const pc =
          itemForecast
            .probabilityCircle;
        const radius =
          Number(
            pc.radius
          ) || 0;
        layerGroup.addLayer(
          L.circle(
            itemForecast.center,
            {
              radius:
                radius,
              color:
                '#ffffff',
              weight:
                1.5,
              opacity:
                0.7,
              fillOpacity:
                0,
              dashArray:
                '6 8'
            }
          )
        );
        /*
         * 接線
         */
        for (
          const tangent of
          pc.tangent || []
        ) {
          if (
            Array.isArray(
              tangent
            ) &&
            tangent.length === 2
          ) {
            layerGroup.addLayer(
              L.polyline(
                tangent,
                {
                  color:
                    '#ffffff',
                  weight:
                    1.5,
                  opacity:
                    0.7
                }
              )
            );
          }
        }
        /*
         * 予報日時
         *
         * Z4以上だけ表示
         */
        if (
          itemForecast.validtime &&
          itemForecast.validtime.JST &&
          itemForecast.center
        ) {
          const labelPos =
            getBottomRightPosition(
              itemForecast.center,
              radius,
              1.12
            );
          const label =
            createTextLabel(
              labelPos,
              formatLabel(
                itemForecast
                  .validtime
                  .JST
              ),
              'forecast-label',
              100
            );
          /*
           * ズーム変更時に
           * 表示・非表示を切り替える
           */
          label._isForecastDateLabel =
            true;
          layerGroup.addLayer(
            label
          );
        }
      }
    }
    /*
     * 実際に通った経路
     */
    if (
      actualPoints.length >= 2
    ) {
      actualPathGroup.addLayer(
        L.polyline(
          actualPoints,
          {
            color:
              '#f1c40f',
            weight: 4,
            opacity: 0.9
          }
        )
      );
    }
    /*
     * 予想経路
     */
    if (
      forecastPoints.length >= 2
    ) {
      forecastPathGroup.addLayer(
        L.polyline(
          forecastPoints,
          {
            color:
              '#1ea6ff',
            weight: 3,
            opacity: 0.9,
            dashArray:
              '8 8'
          }
        )
      );
    }
    /*
     * 最終予報の暴風域
     */
    const last =
      forecast[
        forecast.length - 1
      ];
    if (
      last &&
      last.stormWarningArea
    ) {
      for (
        const arc of
        last.stormWarningArea
          .arc || []
      ) {
        const center =
          arc[0];
        const radius =
          Number(
            arc[1]
          ) || 0;
        const start =
          Number(
            arc[2][0]
          ) || 0;
        const end =
          Number(
            arc[2][1]
          ) || 360;
        layerGroup.addLayer(
          makeArc(
            center,
            radius,
            start,
            end
          )
        );
      }
      for (
        const line of
        last.stormWarningArea
          .line || []
      ) {
        if (
          Array.isArray(line) &&
          line.length >= 2
        ) {
          layerGroup.addLayer(
            L.polyline(
              line,
              {
                color:
                  '#ff4b4b',
                weight:
                  2,
                opacity:
                  1
              }
            )
          );
        }
      }
    }
    return allBounds;
  }
  /*
   * ズームレベル変更時に
   * 予報日時を表示・非表示
   */
  function updateForecastDateLabels() {
    const zoom =
      map.getZoom();
    layerGroup.eachLayer(
      layer => {
        if (
          layer._isForecastDateLabel
        ) {
          const element =
            layer.getElement();
          if (element) {
            element.style.display =
              zoom >= 4
                ? ''
                : 'none';
          }
        }
      }
    );
  }
  /*
   * ズーム変更を監視
   */
  map.on(
    'zoomend',
    updateForecastDateLabels
  );
  /*
   * 台風データ取得
   */
  function loadAllTyphoons() {
    layerGroup.clearLayers();
    actualPathGroup.clearLayers();
    forecastPathGroup.clearLayers();
    fetch(
      'https://www.jma.go.jp/bosai/typhoon/data/targetTc.json'
    )
      .then(
        response => {
          if (!response.ok) {
            throw new Error(
              `HTTP ${response.status}`
            );
          }
          return response.json();
        }
      )
      .then(items => {
        return Promise.all(
          items.map(item =>
            fetch(
              `https://www.jma.go.jp/bosai/typhoon/data/${item.tropicalCyclone}/forecast.json`,
              { cache: 'no-store' }
            )
              .then(response => {
                if (!response.ok) {
                  throw new Error(
                    `HTTP ${response.status}: ${item.tropicalCyclone}`
                  );
                }
                return response.json();
              })
              .then(forecast => ({
                item,
                forecast
              }))
              .catch(error => {
                console.warn(
                  '台風個別データ取得失敗:',
                  item.tropicalCyclone,
                  error
                );
                return null;
              })
          )
        );
      })
      .then(all => {
        const bounds = [];
        all.filter(Boolean).forEach(
          ({
            item,
            forecast
          }) => {
            const result =
              drawTyphoon(
                item,
                forecast
              );
            if (
              Array.isArray(
                result
              )
            ) {
              bounds.push(
                ...result
              );
            }
          }
        );
        // 台風データ取得だけで地図を勝手に移動させない。
        // 現在地・利用者の表示位置を維持する。
        /*
         * 初期ズーム確定後に
         * ラベル表示状態を反映
         */
        updateForecastDateLabels();
      })
      .catch(error => {
        console.error(
          '台風データ取得に失敗しました',
          error
        );
      });
  }
  loadAllTyphoons();
  })();
})(map);
</script>
</body>
</html>
